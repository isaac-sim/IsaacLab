# Template for ~/.isaaclab/install_profile.yaml
#
# This file is written automatically by execute_install.py after a successful
# install. It is the canonical record of *how* Isaac Lab was set up on this
# machine. Three things you can do with it:
#
#   1. Attach a redacted copy to GitHub issues so maintainers can see your
#      exact combo + system facts in one shot. Generate one with:
#         python3 scripts/profile_io.py redact -o profile-for-issue.yaml
#
#   2. Reproduce the install on another machine:
#         python3 scripts/profile_io.py reproduce
#
#   3. Pass it to scripts/verify.py or scripts/doctor.py so they know which
#      Python and which IsaacLab directory to inspect.
#
# Nothing in this file is uploaded anywhere automatically. It's just a file on
# your disk. Share it (or don't) at your own discretion.

schema_version: 1
timestamp: "2026-05-30T00:00:00Z"
skill_version: "0.1.0"

combo_id: pip-uv-source
combo_title: "Isaac Sim (pip) + Isaac Lab (source) + uv (Recommended)"

install_method:
  isaaclab: source        # source | pip
  isaacsim: pip           # pip | binary | source | kitless
