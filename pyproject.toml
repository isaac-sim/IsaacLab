[project]
name = "isaaclab-dev"
version = "0.1.0"
description = "Isaac Lab source checkout development environment."
requires-python = ">=3.12,<3.13"
# Single source of truth for all Isaac Lab dependencies. The editable workspace
# members (``isaaclab*``) are listed here and resolved to the local ``source/``
# checkouts via ``[tool.uv.sources]``; the third-party requirements they used to
# declare individually now live in this file. The wheel builder
# (``tools/wheel_builder/gen_pyproject.py``) and the ``./isaaclab.sh -i`` install
# CLI both read this file, stripping the ``isaaclab*`` self-references.
dependencies = [
    # ----- editable workspace members (always installed) -----
    "isaaclab",
    "isaaclab-assets",
    "isaaclab-contrib",
    "isaaclab-experimental",
    "isaaclab-newton",
    "isaaclab-ov",
    "isaaclab-ovphysx",
    "isaaclab-physx",
    "isaaclab-ppisp",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-tasks-experimental",
    "isaaclab-visualizers",
    # ----- generic -----
    "numpy>=2",
    "torch>=2.10",
    "torchvision>=0.25.0",
    "torchaudio>=2.10",
    "onnx>=1.18.0",
    "prettytable>=3.3.0",
    "protobuf>=4.25.8,!=5.26.0",
    # devices
    "hidapi>=0.14.0",
    # reinforcement learning
    "gymnasium>=1.2.0",
    # procedural-generation
    "trimesh",
    "pyglet>=2.1.6,<3",
    # pytetwild ships only an x86_64 manylinux wheel and its sdist fails to build on
    # aarch64 (CMake hardcodes -m64). Gate it on x86_64 so ARM64 docker builds are
    # not blocked; tetrahedralize callers degrade gracefully via ImportError when missing.
    # Pinned to ==0.2.3: >=0.3 unconditionally imports pyvista at package import time.
    "pytetwild==0.2.3 ; platform_machine in 'x86_64 AMD64'",
    # image processing
    "transformers==4.57.6",
    "einops",
    "warp-lang==1.13.0",
    "matplotlib>=3.10.3",
    # keep consistent with isaac sim version
    "pillow==12.1.1",
    # required by omni.replicator.core S3 backend
    "botocore",
    # livestream (range chosen to coexist with isaacsim 6.0)
    "starlette>=0.46.0,<0.50",
    "omniverseclient==2.71.1.7015",
    # cross-platform file locking
    "filelock",
    "lazy_loader>=0.4",
    # IK controller (Linux x86_64 + ARM64), requires pinning to 3.1.0 and 0.8.5 to avoid breaking change
    "pin ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "pin-pink==3.1.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "daqp==0.8.5 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    # OpenUSD (kit-less mode)
    "usd-core>=25.0.0 ; platform_machine in 'x86_64 AMD64'",
    "usd-exchange>=2.2 ; platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    # avoid broken hf-xet pre-release cached on NVIDIA Artifactory
    "hf-xet>=1.4.1,<2.0.0 ; platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    # ----- tasks -----
    "tensorboard",
    "numba>=0.63.1",
    # ----- rl utilities -----
    "hydra-core",
    "h5py>=3.15.0",
    "moviepy",
    "packaging",
    "tqdm>=4.67.1",
    # ----- default RL framework (rsl_rl is the documented default for training) -----
    "rsl-rl-lib==5.0.1",
    "onnxscript>=0.5",
    # ----- Newton (default physics engine, installed everywhere) -----
    "newton[sim] @ git+https://github.com/newton-physics/newton.git@v1.2.1rc2",
    "PyOpenGL-accelerate>=3.1.0",
]

[project.optional-dependencies]
# Developer/test tooling.
test = [
    "pytest",
    "pytest-mock",
    "junitparser",
    "flatdict>=4.1.0",
    "flaky",
    # coverage>=7.6.1 restored coverage.types.Tracer as a shim; required for
    # numba compatibility (numba subclasses Tracer at import time)
    "coverage>=7.6.1",
]
# RL frameworks (rsl_rl is in the core deps above as the default).
sb3 = ["stable-baselines3>=2.6", "tqdm", "rich"]
skrl = ["skrl>=2.1.0"]
rl-games = [
    "aiohttp==3.13.3",
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@python3.11",
    "gym",
    "standard-distutils",
]
rsl-rl = ["rsl-rl-lib==5.0.1", "onnxscript>=0.5"]
rl-all = [
    "stable-baselines3>=2.6",
    "tqdm",
    "rich",
    "skrl>=2.1.0",
    "aiohttp==3.13.3",
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@python3.11",
    "gym",
    "standard-distutils",
    "rsl-rl-lib==5.0.1",
    "onnxscript>=0.5",
]
# Newton interactive viewer GUI (the Newton physics engine itself is a core dep).
newton = [
    "imgui-bundle>=1.92.5",
    "typing-extensions>=4.15.0",
]
# Other visualizer backends.
viser = ["viser>=1.0.16"]
rerun = [
    "rerun-sdk>=0.29.0",
    # Match rerun-sdk's supported Arrow stack and avoid resolver drift across environments.
    "pyarrow==22.0.0",
]
# Omniverse renderer / physics backends.
ov = ["ovphysx==0.4.13"]
rtx = ["ovrtx>=0.3.0,<0.4.0"]
# Optional submodules (the editable member ships with its third-party deps).
mimic = [
    "isaaclab-mimic",
    # jupyter notebook
    "ipywidgets>=8.1.5",
    # USD to URDF conversion (no aarch64 wheels)
    "nvidia-srl-usd-to-urdf ; platform_machine != 'aarch64'",
    # data augmentation (Linux only)
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.4.0 ; sys_platform == 'linux'",
]
teleop = [
    "isaaclab-teleop",
    # IsaacTeleop is only available on Linux x86_64
    "isaacteleop[retargeters,ui,cloudxr]~=1.3.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64'",
    "dex-retargeting==0.5.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64'",
]
# Externally contributed runtime dependencies (RLinf VLA post-training).
rlinf = [
    "ray[default]>=2.47.0",
    "av>=12.3.0",
    "numpydantic>=1.7.0",
    "albumentations>=1.4.18",
    "decord2",
    "dm_tree>=0.1.8",
    "diffusers>=0.35.0",
    "timm>=1.0.14",
    "peft>=0.17.0",
    "pandas",
]
# Everything optional in one shot. Excludes ``teleop``: dex-retargeting pins
# lxml>=5.2.2 while mimic's nvidia-srl-usd-to-urdf pins lxml<5.0.0, so the two
# cannot co-resolve. Install the teleop stack on its own with ``--extra teleop``.
all = [
    "isaaclab-mimic",
    "stable-baselines3>=2.6",
    "tqdm",
    "rich",
    "skrl>=2.1.0",
    "aiohttp==3.13.3",
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@python3.11",
    "gym",
    "standard-distutils",
    "rsl-rl-lib==5.0.1",
    "onnxscript>=0.5",
    "imgui-bundle>=1.92.5",
    "typing-extensions>=4.15.0",
    "viser>=1.0.16",
    "rerun-sdk>=0.29.0",
    "pyarrow==22.0.0",
    "ovphysx==0.4.13",
    "ovrtx>=0.3.0,<0.4.0",
    "ipywidgets>=8.1.5",
    "nvidia-srl-usd-to-urdf ; platform_machine != 'aarch64'",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.4.0 ; sys_platform == 'linux'",
    "ray[default]>=2.47.0",
    "av>=12.3.0",
    "numpydantic>=1.7.0",
    "albumentations>=1.4.18",
    "decord2",
    "dm_tree>=0.1.8",
    "diffusers>=0.35.0",
    "timm>=1.0.14",
    "peft>=0.17.0",
    "pandas",
]

# Extras shipped in the published wheel but intentionally excluded from the uv
# workspace resolution. The source workspace uses a repo-local Isaac Sim (the
# ``_isaac_sim`` symlink / ``.env``), and ``isaacsim``'s exact version pins
# conflict with several workspace extras under uv's strict resolver. Declaring
# them here (rather than under ``[project.optional-dependencies]``) keeps the
# wheel's extras defined in this single file while leaving ``uv lock`` solvable.
# ``tools/wheel_builder/gen_pyproject.py`` merges these into the wheel metadata.
[tool.isaaclab.wheel-extras]
isaacsim = ["isaacsim[all,extscache]>=6.0.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

# Exclude directories
extend-exclude = [
    "logs",
    "_isaac_sim",
    ".vscode",
    "_*",
    ".git",
]

[tool.ruff.lint]
# Enable flake8 rules and other useful ones
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "C90",    # mccabe complexity
    # "D",      # pydocstyle
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
]

# Ignore specific rules (matching your flake8 config)
ignore = [
    "E402",   # Module level import not at top of file
    "D401",   # First line should be in imperative mood
    "RET504", # Unnecessary variable assignment before return statement
    "RET505", # Unnecessary elif after return statement
    "SIM102", # Use a single if-statement instead of nested if-statements
    "SIM103", # Return the negated condition directly
    "SIM108", # Use ternary operator instead of if-else statement
    "SIM117", # Merge with statements for context managers
    "SIM118", # Use {key} in {dict} instead of {key} in {dict}.keys()
    "UP006",  # Use 'dict' instead of 'Dict' type annotation
    "UP018",  # Unnecessary `float` call (rewrite as a literal)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]

# Custom import sections with separate sections for each Isaac Lab extension
section-order = [
    "future",
    "standard-library",
    "third-party",
    # Group omniverse extensions separately since they are run-time dependencies
    # which are pulled in by Isaac Lab extensions
    "omniverse-extensions",
    # Group Isaac Lab extensions together since they are all part of the Isaac Lab project
    "isaaclab",
    "isaaclab-contrib",
    "isaaclab-rl",
    "isaaclab-mimic",
    "isaaclab-tasks",
    "isaaclab-assets",
    # First-party is reserved for project templates
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
# Define what belongs in each custom section

"omniverse-extensions" = [
    "isaacsim",
    "omni",
    "pxr",
    "carb",
    "usdrt",
    "Semantics",
    "curobo",
]

"isaaclab" = ["isaaclab"]
"isaaclab-assets" = ["isaaclab_assets"]
"isaaclab-contrib" = ["isaaclab_contrib"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-mimic" = ["isaaclab_mimic"]
"isaaclab-tasks" = ["isaaclab_tasks"]

[tool.ruff.format]

docstring-code-format = true

[tool.pyright]

include = ["source", "scripts"]
exclude = [
    "**/__pycache__",
    "**/_isaac_sim",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
# Therefore, we have to ignore missing imports
reportMissingImports = "none"
# This is required to ignore for type checks of modules with stubs missing.
reportMissingModuleSource = "none" # -> most common: prettytable in mdp managers

reportGeneralTypeIssues = "none"       # -> raises 218 errors (usage of literal MISSING in dataclasses)
reportOptionalMemberAccess = "warning" # -> raises 8 errors
reportPrivateUsage = "warning"


[tool.codespell]
skip = '*.usd,*.usda,*.usdz,*.svg,*.png,_isaac_sim*,*.bib,*.css,*/_build'
quiet-level = 0
# the world list should always have words in lower case
ignore-words-list = "haa,slq,collapsable,buss,reacher,thirdparty"


[tool.pytest.ini_options]

markers = [
    "isaacsim_ci: mark test to run in isaacsim ci",
]

# Add pypi.nvidia.com so that `uv pip install isaaclab[isaacsim]` works without --extra-index-url.
# Pip still needs "--extra-index-url https://pypi.nvidia.com".
[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Some NVIDIA-hosted dependencies have mismatched versions across pypi.nvidia.com
# and PyPI. unsafe-best-match lets uv resolve the correct version from any index,
# and prerelease=allow covers packages that only publish pre-release wheels.
[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
override-dependencies = ["numpy>=2"]
# Pin the exact torch stack for the dev workspace (routed through the CUDA
# indexes below via [tool.uv.sources]). The loose specs in
# [project.dependencies] keep the published wheel resolvable against isaacsim.
constraint-dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchaudio==2.10.0",
]
# The teleop stack (dex-retargeting -> lxml>=5.2.2) cannot co-resolve with the
# mimic stack (nvidia-srl-usd-to-urdf -> lxml<5.0.0), which is also pulled in by
# the aggregate ``all`` extra. Declaring the conflict lets uv lock each side in
# its own resolution fork instead of failing.
conflicts = [
    [{ extra = "teleop" }, { extra = "mimic" }],
    [{ extra = "teleop" }, { extra = "all" }],
]
python-preference = "only-managed"
package = false

[tool.uv.sources]
isaaclab = { path = "source/isaaclab", editable = true }
"isaaclab-assets" = { path = "source/isaaclab_assets", editable = true }
"isaaclab-contrib" = { path = "source/isaaclab_contrib", editable = true }
"isaaclab-experimental" = { path = "source/isaaclab_experimental", editable = true }
"isaaclab-mimic" = { path = "source/isaaclab_mimic", editable = true }
"isaaclab-newton" = { path = "source/isaaclab_newton", editable = true }
"isaaclab-ov" = { path = "source/isaaclab_ov", editable = true }
"isaaclab-ovphysx" = { path = "source/isaaclab_ovphysx", editable = true }
"isaaclab-physx" = { path = "source/isaaclab_physx", editable = true }
"isaaclab-ppisp" = { path = "source/isaaclab_ppisp", editable = true }
"isaaclab-rl" = { path = "source/isaaclab_rl", editable = true }
"isaaclab-tasks" = { path = "source/isaaclab_tasks", editable = true }
"isaaclab-tasks-experimental" = { path = "source/isaaclab_tasks_experimental", editable = true }
"isaaclab-teleop" = { path = "source/isaaclab_teleop", editable = true }
"isaaclab-visualizers" = { path = "source/isaaclab_visualizers", editable = true }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'arm64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'arm64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'arm64'" },
]

[tool.uv.pip]
index-strategy = "unsafe-best-match"
prerelease = "allow"
