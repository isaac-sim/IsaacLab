[project]
name = "isaaclab-dev"
version = "0.1.0"
description = "Isaac Lab source checkout development environment."
requires-python = ">=3.12,<3.13"
# Single source of truth for all dependencies, also read by the wheel builder and
# ``./isaaclab.sh -i``. Workspace members resolve to ``source/`` via [tool.uv.sources].
dependencies = [
    # ----- workspace members (editable) -----
    "isaaclab",
    "isaaclab-assets",
    "isaaclab-contrib",
    "isaaclab-experimental",
    "isaaclab-newton",
    "isaaclab-ov",
    "isaaclab-ovphysx",
    "isaaclab-physx",
    "isaaclab-ppisp",
    "isaaclab-rl",
    "isaaclab-tasks",
    "isaaclab-tasks-experimental",
    "isaaclab-visualizers",
    # ----- generic -----
    "numpy>=2",
    "torch>=2.11",
    "torchvision>=0.26.0",
    "torchaudio>=2.11",
    "onnx>=1.18.0",
    "prettytable>=3.3.0",
    "protobuf>=4.25.8,!=5.26.0",
    "hidapi>=0.14.0",
    "gymnasium>=1.2.0",
    "trimesh",
    "pyglet>=2.1.6,<3",
    # x86_64-only wheel (sdist fails to build on aarch64). Capped <0.3: >=0.3
    # imports pyvista at import time.
    "pytetwild>=0.2.3,<0.3 ; platform_machine in 'x86_64 AMD64'",
    "transformers>=4.57.6",
    "einops",
    "warp-lang>=1.14.0",
    "matplotlib>=3.10.3",
    "pillow>=12.1.1",  # keep consistent with isaac sim
    "botocore",  # omni.replicator.core S3 backend
    "starlette>=0.46.0,<0.50",  # livestream; range coexists with isaacsim 6.0
    "omniverseclient>=2.71.1.7015",
    "filelock",
    "lazy_loader>=0.4",
    # IK controller (Linux only); 3.1.0/0.8.5 pins avoid a breaking change
    "pin ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "pin-pink==3.1.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "daqp==0.8.5 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    # OpenUSD (kit-less mode)
    "usd-core>=25.11,<26.0 ; platform_machine in 'x86_64 AMD64'",
    "usd-exchange>=2.2 ; platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    # avoid broken hf-xet pre-release cached on NVIDIA Artifactory
    "hf-xet>=1.4.1,<2.0.0 ; platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    # ----- tasks -----
    "tensorboard",
    "numba>=0.63.1",
    # ----- rl utilities -----
    "hydra-core",
    "h5py>=3.15.0",
    "moviepy",
    "packaging",
    "tqdm>=4.67.1",
    "rsl-rl-lib==5.0.1",  # default RL framework
    "onnxscript>=0.5",
    # ----- newton (default physics engine) -----
    # Loose lower bound keeps the wheel resolvable and lets the base install track
    # the latest Newton from the index (prereleases allowed via [tool.uv]); adding
    # the ``isaacsim`` extra narrows it to isaacsim's own ``==`` pin.
    "newton[sim]>=1.2.0",
    "PyOpenGL-accelerate>=3.1.0",
    # ----- newton interactive viewer GUI (HUD controls) -----
    # In base so the Newton viewer works out of the box (no extra required).
    "imgui-bundle>=1.92.5",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
# Developer/test tooling.
test = [
    "pytest",
    "pytest-mock",
    "junitparser",
    "flatdict>=4.1.0",
    "flaky",
    # numba subclasses coverage.types.Tracer at import; >=7.6.1 restores that shim
    "coverage>=7.6.1",
]
# RL frameworks (rsl-rl is the default, in core deps); install the one you train with.
sb3 = ["stable-baselines3>=2.6", "tqdm", "rich"]
skrl = ["skrl>=2.1.0"]
rl-games = [
    "aiohttp>=3.12.14",
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@python3.11",
    "gym",
    "standard-distutils",
]
rsl-rl = ["rsl-rl-lib==5.0.1", "onnxscript>=0.5"]
# Note: the Newton interactive viewer GUI (imgui-bundle, typing-extensions) is
# part of the base install (see [project.dependencies]); there is no ``newton``
# extra. The ``-i newton`` / ``visualizer[newton]`` tokens are accepted as no-ops.
# Other visualizer backends.
viser = ["viser>=1.0.16"]
rerun = [
    "rerun-sdk>=0.29.0",
    "pyarrow==22.0.0",  # match rerun-sdk's Arrow stack
]
# Isaac Sim (PhysX physics backend). The pinned version mirrors
# ``[tool.isaaclab.versions].isaacsim`` (the single source of truth read by docs
# and CI). Co-resolves with the base install under uv via the conflicts table in
# [tool.uv]; isaacsim narrows newton to its ``==`` pin.
isaacsim = ["isaacsim[all,extscache]==6.0.0.1"]
# Omniverse renderer / physics backends. Installable separately or together via
# the ``ov[ovphysx]`` / ``ov[ovrtx]`` / ``ov[all]`` install selectors. Pins mirror
# ``[tool.isaaclab.versions]``.
ov = ["ovphysx==0.4.13"]
rtx = ["ovrtx>=0.3.0,<0.4.0"]
mimic = [
    "isaaclab-mimic",
    "ipywidgets>=8.1.5",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.4.0 ; sys_platform == 'linux'",
]
teleop = [
    "isaaclab-teleop",
    # IsaacTeleop is Linux x86_64 only
    "isaacteleop[retargeters,ui,cloudxr]~=1.3.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64'",
    "dex-retargeting==0.5.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64'",
]
# RLinf VLA post-training (externally contributed).
rlinf = [
    "ray[default]>=2.47.0",
    "av>=12.3.0",
    "numpydantic>=1.7.0",
    "albumentations>=1.4.18",
    "decord2",
    "dm_tree>=0.1.8",
    "diffusers>=0.35.0",
    "timm>=1.0.14",
    "peft>=0.17.0",
    "pandas",
]
# Everything that co-resolves with isaacsim in one shot (the documented
# ``[all,isaacsim]`` install). Excludes extras whose pins clash with isaacsim's:
# ``teleop`` (lxml vs mimic), ``ov`` (packaging<24), and ``viser``
# (websockets==12.0). Install those via their own extra.
all = [
    "isaaclab-dev[sb3,skrl,rl-games,rsl-rl,rerun,rlinf,mimic]",
]

# Single source of truth for externally-pinned package versions. Read by the docs
# (``docs/conf.py``), the install CLI (``isaaclab.cli.commands.install``), the CI
# workflows, and the install-CI tests. TOML has no interpolation, so the literal
# pins in ``[project.optional-dependencies]`` and ``[tool.uv].constraint-dependencies``
# mirror these values; ``test_version_single_source`` fails CI if they ever drift.
[tool.isaaclab.versions]
isaacsim = "6.0.0.1"
torch = "2.11.0"
torchvision = "0.26.0"
torchaudio = "2.11.0"
ovphysx = "0.4.13"
ovrtx = ">=0.3.0,<0.4.0"

# Single source of truth for each distributable sub-package's third-party
# dependencies. ``tools/gen_package_pyproject.py`` copies these declarations into
# the managed region of every ``source/<pkg>/pyproject.toml`` so the sub-packages
# keep complete, self-contained metadata while being edited in one place. Specs
# are deliberately relaxed (``>=``, upper bounds only where strictly required);
# the exact, known-good versions live in ``[tool.uv]`` and ``uv.lock``. Each spec
# must match the curated root ``[project.dependencies]`` / extras above (enforced
# by ``gen_package_pyproject.py --check`` and ``test_source_package_metadata``).
[tool.isaaclab.packages.isaaclab]
dependencies = [
    "numpy>=2",
    "torch>=2.11",
    "onnx>=1.18.0",
    "prettytable>=3.3.0",
    "hidapi>=0.14.0",
    "gymnasium>=1.2.0",
    "trimesh",
    "pyglet>=2.1.6,<3",
    "pytetwild>=0.2.3,<0.3 ; platform_machine in 'x86_64 AMD64'",
    "transformers>=4.57.6",
    "einops",
    "warp-lang>=1.14.0",
    "matplotlib>=3.10.3",
    "pillow>=12.1.1",
    "botocore",
    "starlette>=0.46.0,<0.50",
    "omniverseclient>=2.71.1.7015",
    "filelock",
    "lazy_loader>=0.4",
    "pin ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "pin-pink==3.1.0 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "daqp==0.8.5 ; platform_system == 'Linux' and platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "usd-core>=25.11,<26.0 ; platform_machine in 'x86_64 AMD64'",
    "usd-exchange>=2.2 ; platform_machine in 'x86_64 AMD64 aarch64 arm64'",
    "hf-xet>=1.4.1,<2.0.0 ; platform_machine in 'x86_64 AMD64 aarch64 arm64'",
]

