# Scopes pytest to this package so the perf-gate unit tests run in isolation:
# making this dir the rootdir stops pytest from loading the repo-wide
# tools/conftest.py (the IsaacSim test harness), which is irrelevant here and
# slow to import. Run with:  cd tools/perf_regression_gate && pytest
[pytest]
testpaths = tests
addopts = -q
