name: 'Detect Changes'
description: >
  Decide whether expensive downstream jobs should run on this PR. Returns
  "true" on non-PR events (push, workflow_dispatch) and fails-safe to "true"
  if the changed-files API call errors out. On PR events, returns "true" iff
  any provided regex pattern matches a changed file path.

  Renders a step summary table for visibility on the run page.

  This pattern (always-runs gating job + downstream `if:`) is used instead of
  a workflow-level `paths:` filter because a not-triggered required check
  would block PRs indefinitely under branch protection.

inputs:
  patterns:
    description: >
      Newline-separated, TAB-delimited regex + human-readable description
      pairs. Example:
        ^source/\tLibrary source code
        ^docker/\tContainer build inputs
    required: true
  triggered-jobs:
    description: >
      Short text shown in the step summary describing what runs when this
      returns true.
    required: false
    default: 'downstream jobs'
  summary-title:
    description: 'Heading text for the step summary section.'
    required: false
    default: 'Change detection'

outputs:
  run:
    description: '"true" if any pattern matched (or this is a non-PR event); "false" otherwise.'
    value: ${{ steps.detect.outputs.run }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        PATTERNS_INPUT: ${{ inputs.patterns }}
        TRIGGERED_JOBS: ${{ inputs.triggered-jobs }}
        SUMMARY_TITLE: ${{ inputs.summary-title }}
      run: |
        set -euo pipefail

        # Parse newline+tab-delimited input into a bash array. Tab-less lines
        # are an error (likely space-delimited by mistake) — a silently-skipped
        # pattern could make the workflow not trigger on changes it should have.
        patterns=()
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          if [[ "$line" != *$'\t'* ]]; then
            echo "::error::detect-changes: pattern line missing tab separator: '$line'"
            exit 1
          fi
          patterns+=("$line")
        done <<< "$PATTERNS_INPUT"

        if [ "${#patterns[@]}" -eq 0 ]; then
          echo "::error::detect-changes received no valid pattern lines"
          exit 1
        fi

        render_table() {
          local files="$1" entry regex desc count sample
          echo "| Pattern | What it covers | Matched files |"
          echo "|---|---|---|"
          for entry in "${patterns[@]}"; do
            IFS=$'\t' read -r regex desc <<< "$entry"
            count=$(grep -cE "$regex" <<< "$files" || true)
            if [ "$count" -gt 0 ]; then
              sample=$(grep -m 3 -E "$regex" <<< "$files" | paste -sd ', ' -)
              [ "$count" -gt 3 ] && sample="$sample (and $((count - 3)) more)"
              echo "| \`$regex\` | $desc | $sample |"
            else
              echo "| \`$regex\` | $desc | - |"
            fi
          done
        }

        any_match() {
          local files="$1" entry regex
          for entry in "${patterns[@]}"; do
            IFS=$'\t' read -r regex _ <<< "$entry"
            if grep -qE "$regex" <<< "$files"; then
              return 0
            fi
          done
          return 1
        }

        decide() {
          local decision="$1" reason="$2" files="${3:-}"
          echo "Decision: run=$decision ($reason)"
          echo "run=$decision" >> "$GITHUB_OUTPUT"
          {
            echo "## ${SUMMARY_TITLE}"
            echo ""
            if [ "$decision" = "true" ]; then
              echo "Downstream jobs will **run**: $reason."
            else
              echo "Downstream jobs will be **skipped**: $reason."
            fi
            echo ""
            echo "Triggered jobs: $TRIGGERED_JOBS."
            if [ -n "$files" ]; then
              echo ""
              render_table "$files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        }

        if [ "$EVENT_NAME" != "pull_request" ]; then
          decide true "non-PR event ($EVENT_NAME)"
          exit 0
        fi

        if ! changed_files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
          echo "::warning::Could not list changed files; defaulting to run=true"
          decide true "fail-safe (could not list changed files)"
          exit 0
        fi

        printf '%s\n' "$changed_files"

        if any_match "$changed_files"; then
          decide true "relevant paths changed" "$changed_files"
        else
          decide false "no relevant paths changed" "$changed_files"
        fi
