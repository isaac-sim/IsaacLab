name: 'Run Package Tests'
description: >
  Pulls the Docker image from ECR, runs pytest inside the container, uploads
  results as an artifact, and fails fork PRs on test failures.
  NOTE: The calling job must check out the code before using this action.

inputs:
  image-tag:
    description: 'Docker image tag'
    required: true
  isaacsim-base-image:
    description: 'IsaacSim base image'
    required: true
  isaacsim-version:
    description: 'IsaacSim version'
    required: true
  dockerfile-path:
    description: 'Path to Dockerfile'
    default: 'docker/Dockerfile.base'
    required: false
  cache-tag:
    description: 'ECR cache tag'
    default: 'cache-base'
    required: false
  filter-pattern:
    description: >-
      Pattern to filter test files (e.g., isaaclab_tasks); test files whose path
      contains this pattern are included. Only one pattern can be used at a time,
      no comma-separated substrings allowed. Also supports the legacy "not <pattern>"
      form for exclude-only jobs.
    default: ''
    required: false
  exclude-pattern:
    description: >-
      Comma-separated substrings; test files whose path contains any entry are
      skipped. Combines with filter-pattern (include + exclude).
    default: ''
    required: false
  test-k-expr:
    description: >-
      Global pytest -k expression applied inside every per-file pytest run
      spawned by tools/conftest.py (combined with device-split selectors).
    default: ''
    required: false
  shard-index:
    description: 'Zero-based shard index'
    default: ''
    required: false
  shard-count:
    description: 'Total number of shards'
    default: ''
    required: false
  curobo-only:
    description: 'Run only cuRobo and SkillGen tests'
    default: 'false'
    required: false
  quarantined-only:
    description: 'Run only quarantined tests'
    default: 'false'
    required: false
  include-files:
    description: 'Comma-separated list of specific test files to include'
    default: ''
    required: false
  test-node-ids-file:
    description: 'TOML file containing exact pytest node IDs to run'
    default: ''
    required: false
  test-node-ids-key:
    description: 'Top-level key in test-node-ids-file containing the node IDs for this job'
    default: ''
    required: false
  pytest-options:
    description: 'Additional pytest options'
    default: ''
    required: false
  extra-pip-packages:
    description: 'Space-separated pip packages to install inside the Docker container before pytest starts'
    default: ''
    required: false
  wheelhouse-image:
    description: 'Optional digest-pinned Docker image containing /wheelhouse and /manifest.json'
    default: ''
    required: false
  wheelhouse-packages:
    description: 'Space-separated packages to install from the wheelhouse with pip --no-index'
    default: ''
  omni-github-test-type:
    description: 'Test type stored on each uploaded omni-github test row'
    default: 'pytest'
    required: false
  warp-cache:
    description: >-
      Warp kernel cache mode. Empty disables the cache entirely. 'restore'
      reads the shared cache and never writes it; this is what every test job
      uses. 'save' starts from an empty cache and publishes the result on
      success; only the warm-warp-cache job may use it, and only on the default
      branch, since caches written from a pull request are scoped to that pull
      request and unreadable by any other.
    default: ''
    required: false
  warp-cache-max-mb:
    description: 'Refuse to publish a Warp cache larger than this, in MB, to protect the repository cache quota'
    default: '5000'
    required: false
  standalone-script-scope:
    description: 'Enable standalone script smoke tests for this scripts/ subdirectory'
    default: ''
    required: false
  standalone-script-visualizer:
    description: 'Visualizer slice used when standalone-script-scope is set'
    default: 'none'
    required: false
  standalone-script-runtime-group:
    description: 'Run Kit-dependent or non-Kit standalone script cases'
    default: ''
    required: false
  result-file:
    description: 'Optional JUnit result filename; defaults to the workflow job identifier'
    default: ''
    required: false
  container-name:
    description: 'Docker container name prefix (run-id is appended automatically)'
    required: true
runs:
  using: composite
  steps:
    # Display some details on AWS instance we're running on
    - name: AWS Instance Info
      shell: bash
      run: |
        # get instance ID for debugging purposes (if running on EC2)
        IMDS_TOKEN=$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600") || true
        if [ -n "$IMDS_TOKEN" ]; then
          INSTANCE_ID=$(curl -sf -H "X-aws-ec2-metadata-token: ${IMDS_TOKEN}" \
            "http://169.254.169.254/latest/meta-data/instance-id") || true
          INSTANCE_REGION=$(curl -sf -H "X-aws-ec2-metadata-token: ${IMDS_TOKEN}" \
              "http://169.254.169.254/latest/meta-data/placement/region") || true
          INSTANCE_TYPE=$(curl -sf -H "X-aws-ec2-metadata-token: ${IMDS_TOKEN}" \
              "http://169.254.169.254/latest/meta-data/instance-type") || true
          echo "⚪ Instance ID: ${INSTANCE_ID:-Not running on EC2}"
          echo "⚪ Instance Region: ${INSTANCE_REGION:-Not running on EC2}"
          echo "⚪ Instance Type: ${INSTANCE_TYPE:-Not running on EC2}"
          echo "⚪ Connect: https://${INSTANCE_REGION}.console.aws.amazon.com/ec2-instance-connect/ssh/home?region=${INSTANCE_REGION}&connType=standard&instanceId=${INSTANCE_ID}&osUser=ubuntu&sshPort=22&addressFamily=ipv4"
        else
          echo "🟠 Could not obtain IMDS token, probably not running on EC2"
        fi

    - name: Prepare Docker disk space
      shell: bash
      run: |
        bash .github/actions/run-package-tests/cleanup_docker_storage.sh \
          "${{ inputs.isaacsim-base-image }}:${{ inputs.isaacsim-version }}" \
          "isaacsim-pin-${{ inputs.container-name }}-${{ github.run_id }}-${{ github.run_attempt }}-pre" \
          "pre-test-cleanup" \
          "true"

    - name: Record pull start time
      id: pull-start
      shell: bash
      run: echo "time=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Pull image from ECR
      uses: ./.github/actions/ecr-build-push-pull
      with:
        image-tag: ${{ inputs.image-tag }}
        isaacsim-base-image: ${{ inputs.isaacsim-base-image }}
        isaacsim-version: ${{ inputs.isaacsim-version }}
        dockerfile-path: ${{ inputs.dockerfile-path }}
        cache-tag: ${{ inputs.cache-tag }}

    - name: Report pull duration
      if: always()
      shell: bash
      run: |
        start_time="${{ steps.pull-start.outputs.time }}"
        if [ -z "$start_time" ]; then
          echo "🟠 Could not calculate pull duration (start time not recorded)" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        elapsed=$(( $(date +%s) - start_time ))
        printf "🔵 Image pull took %dm %ds\n" $((elapsed/60)) $((elapsed%60))
        echo "🔵 Docker Image Pulled in ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

    - name: Resolve Warp cache key
      if: inputs.warp-cache != ''
      id: warp-cache-key
      uses: ./.github/actions/warp-cache-key

    - name: Restore Warp kernel cache
      if: inputs.warp-cache == 'restore'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.warp-cache-key.outputs.host-dir }}
        key: ${{ steps.warp-cache-key.outputs.key }}
        restore-keys: ${{ steps.warp-cache-key.outputs.restore-keys }}

    - name: Measure restored Warp cache
      if: inputs.warp-cache != ''
      shell: bash
      env:
        HOST_DIR: ${{ steps.warp-cache-key.outputs.host-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$HOST_DIR"
        if [ ! -w "$HOST_DIR" ]; then
          echo "::error::Warp cache directory is not writable: $HOST_DIR"
          exit 1
        fi
        echo "WARP_CACHE_MB_BEFORE=$(du -sm "$HOST_DIR" | cut -f1)" >> "$GITHUB_ENV"
        echo "Warp cache at $HOST_DIR: $(du -sh "$HOST_DIR" | cut -f1)"

    - name: Setup wheelhouse registry authentication
      if: inputs.wheelhouse-image != ''
      uses: ./.github/actions/_lib/setup-docker-config

    - name: Extract ovphysx wheelhouse
      id: extract-wheelhouse
      if: inputs.wheelhouse-image != ''
      shell: bash
      env:
        WHEELHOUSE_IMAGE: ${{ inputs.wheelhouse-image }}
      run: |
        set -euo pipefail

        if [[ "$WHEELHOUSE_IMAGE" != *@sha256:* ]]; then
          echo "::error::wheelhouse-image must be pinned by digest"
          exit 1
        fi

        wheelhouse_root="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ovphysx-wheelhouse.XXXXXX")"
        container_id=""
        image_pulled=false
        preserve_root=false
        cleanup() {
          if [ -n "$container_id" ]; then
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          fi
          if [ "$image_pulled" = "true" ]; then
            docker image rm "$WHEELHOUSE_IMAGE" >/dev/null 2>&1 || true
          fi
          if [ "$preserve_root" != "true" ]; then
            rm -rf "$wheelhouse_root"
          fi
        }
        trap cleanup EXIT

        docker pull "$WHEELHOUSE_IMAGE"
        image_pulled=true
        container_id="$(docker create "$WHEELHOUSE_IMAGE")"
        docker cp "${container_id}:/wheelhouse" "$wheelhouse_root/wheelhouse"
        docker cp "${container_id}:/manifest.json" "$wheelhouse_root/manifest.json"
        docker rm "$container_id"
        container_id=""
        docker image rm "$WHEELHOUSE_IMAGE" >/dev/null 2>&1 || true
        image_pulled=false

        echo "wheelhouse_host_dir=$wheelhouse_root" >> "$GITHUB_OUTPUT"
        preserve_root=true

    - name: Cleanup wheelhouse registry authentication
      if: always() && inputs.wheelhouse-image != ''
      shell: bash
      run: |
        if [ -n "${DOCKER_CONFIG:-}" ] && [ -d "$DOCKER_CONFIG" ]; then
          rm -rf "$DOCKER_CONFIG"
        fi

    - name: Run Tests
      uses: ./.github/actions/run-tests
      with:
        test-path: "tools"
        result-file: "${{ inputs.result-file != '' && inputs.result-file || format('{0}-report.xml', github.job) }}"
        container-name: "${{ inputs.container-name }}-${{ github.run_id }}-${{ github.run_attempt }}"
        image-tag: ${{ inputs.image-tag }}
        pytest-options: ${{ inputs.pytest-options }}
        filter-pattern: ${{ inputs.filter-pattern }}
        exclude-pattern: ${{ inputs.exclude-pattern }}
        test-k-expr: ${{ inputs.test-k-expr }}
        shard-index: ${{ inputs.shard-index }}
        shard-count: ${{ inputs.shard-count }}
        curobo-only: ${{ inputs.curobo-only }}
        quarantined-only: ${{ inputs.quarantined-only }}
        include-files: ${{ inputs.include-files }}
        test-node-ids-file: ${{ inputs.test-node-ids-file }}
        test-node-ids-key: ${{ inputs.test-node-ids-key }}
        volume-mount-source: ${{ github.workspace }}
        extra-pip-packages: ${{ inputs.extra-pip-packages }}
        wheelhouse-host-dir: ${{ steps.extract-wheelhouse.outputs.wheelhouse_host_dir }}
        wheelhouse-packages: ${{ inputs.wheelhouse-packages }}
        omni-github-test-type: ${{ inputs.omni-github-test-type }}
        warp-cache-host-dir: ${{ steps.warp-cache-key.outputs.host-dir }}
        standalone-script-scope: ${{ inputs.standalone-script-scope }}
        standalone-script-visualizer: ${{ inputs.standalone-script-visualizer }}
        standalone-script-runtime-group: ${{ inputs.standalone-script-runtime-group }}

    - name: Check Test Results
      if: always()
      shell: bash
      env:
        RESULT_FILE: "${{ inputs.result-file != '' && inputs.result-file || format('{0}-report.xml', github.job) }}"
      run: |
        if [ -f "reports/$RESULT_FILE" ]; then
          if grep -qE 'failures="[1-9][0-9]*"' "reports/$RESULT_FILE" || grep -qE 'errors="[1-9][0-9]*"' "reports/$RESULT_FILE"; then
            echo "Tests failed for PR from fork. The test report is in the logs. Failing the job."
            exit 1
          fi
        else
          echo "No test results file found. This might indicate test execution failed."
          exit 1
        fi

    # How much the cache grew during this job is the coverage signal: growth is
    # exactly the kernels this job needed that the warmer never compiled. A job
    # that grows the cache a lot names an axis missing from the warmer's -k
    # expression. Tune that expression on these numbers, not on guesses.
    - name: Report Warp cache coverage
      if: always() && inputs.warp-cache == 'restore'
      shell: bash
      env:
        HOST_DIR: ${{ steps.warp-cache-key.outputs.host-dir }}
      run: |
        set -euo pipefail

        if [ ! -d "$HOST_DIR" ]; then
          echo "Warp cache directory is missing; nothing to report"
          exit 0
        fi

        before="${WARP_CACHE_MB_BEFORE:-0}"
        after="$(du -sm "$HOST_DIR" | cut -f1)"
        grew=$(( after - before ))

        if [ "$before" -eq 0 ]; then
          verdict="no cache was restored (cold run)"
        elif [ "$grew" -le 0 ]; then
          verdict="fully covered by the warm cache"
        else
          verdict="compiled $(( grew * 100 / before ))% beyond the warm cache"
        fi

        echo "Warp cache: restored ${before} MB, ended at ${after} MB (+${grew} MB) - ${verdict}"
        echo "🔵 Warp cache: ${before} MB restored, +${grew} MB compiled - ${verdict}" >> "$GITHUB_STEP_SUMMARY"

    - name: Measure Warp kernel cache
      if: success() && inputs.warp-cache == 'save'
      id: warp-cache-size
      shell: bash
      env:
        HOST_DIR: ${{ steps.warp-cache-key.outputs.host-dir }}
        MAX_MB: ${{ inputs.warp-cache-max-mb }}
      run: |
        set -euo pipefail

        size_mb="$(du -sm "$HOST_DIR" | cut -f1)"
        echo "Warp cache size: ${size_mb} MB (limit ${MAX_MB} MB)"
        echo "🔵 Warp cache: ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"

        # The repository-wide GitHub cache quota is 10 GB and eviction is LRU
        # across the whole repository, so an oversized Warp cache does not just
        # fail to help - it evicts every other cache in the repository. Skip the
        # publish rather than take that trade.
        if [ "$size_mb" -gt "$MAX_MB" ]; then
          echo "::warning::Warp cache is ${size_mb} MB, above the ${MAX_MB} MB limit; skipping publish"
          echo "publish=false" >> "$GITHUB_OUTPUT"
        elif [ "$size_mb" -lt 1 ]; then
          echo "::warning::Warp cache is empty; skipping publish"
          echo "publish=false" >> "$GITHUB_OUTPUT"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Warp kernel cache
      if: success() && inputs.warp-cache == 'save' && steps.warp-cache-size.outputs.publish == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.warp-cache-key.outputs.host-dir }}
        key: ${{ steps.warp-cache-key.outputs.key }}

    - name: Cleanup wheelhouse artifacts
      if: always() && steps.extract-wheelhouse.outputs.wheelhouse_host_dir != ''
      shell: bash
      run: rm -rf "${{ steps.extract-wheelhouse.outputs.wheelhouse_host_dir }}"

    - name: Kill container on cancellation
      if: cancelled()
      shell: bash
      run: |
        CONTAINER="${{ inputs.container-name }}-${{ github.run_id }}-${{ github.run_attempt }}"
        echo "🟠 Workflow cancelled, force-killing container ${CONTAINER}..."
        docker kill "${CONTAINER}" 2>/dev/null || true
        docker rm -f "${CONTAINER}" 2>/dev/null || true

    - name: Cleanup old Docker images
      if: always()
      shell: bash
      run: |
        bash .github/actions/run-package-tests/cleanup_docker_storage.sh \
          "${{ inputs.isaacsim-base-image }}:${{ inputs.isaacsim-version }}" \
          "isaacsim-pin-${{ inputs.container-name }}-${{ github.run_id }}-${{ github.run_attempt }}-post" \
          "post-job-cleanup" \
          "false"
