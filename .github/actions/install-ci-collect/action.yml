name: 'Collect Installation CI Tests'
description: >
  Runs `pytest --collect-only` against source/isaaclab/test/install_ci in a
  uv-managed environment and writes the collected test list to the GitHub step
  summary. Used to gate the heavy install jobs on a fast inventory check.

inputs:
  test-filter:
    description: 'pytest -k expression (empty = collect everything)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.12.9"
    - name: Collect tests
      shell: bash
      env:
        TEST_FILTER: ${{ inputs.test-filter }}
      run: |
        set -uo pipefail
        collected="$RUNNER_TEMP/install-ci-collected.txt"
        args=( --collect-only --run-gpu -q source/isaaclab/test/install_ci )
        [ -n "$TEST_FILTER" ] && args+=(-k "$TEST_FILTER")
        uv run --no-project --python 3.12 --with pytest python -m pytest "${args[@]}" 2>&1 | tee "$collected"
        rc=${PIPESTATUS[0]}
        {
          echo '```'
          cat "$collected"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$rc"
