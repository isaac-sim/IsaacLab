name: 'Build Docker Image'
description: 'Builds a Docker image with IsaacSim and IsaacLab dependencies'

inputs:
  image-tag:
    description: 'Docker image tag to use'
    required: true
  isaacsim-base-image:
    description: 'IsaacSim base image'
    required: true
  isaacsim-version:
    description: 'IsaacSim version'
    required: true
  dockerfile-path:
    description: 'Path to Dockerfile'
    default: 'docker/Dockerfile.base'
    required: false
  context-path:
    description: 'Build context path'
    default: '.'
    required: false

runs:
  using: composite
  steps:
    - name: NGC Login
      shell: sh
      env:
        BASE_IMAGE_REF: ${{ inputs.isaacsim-base-image }}:${{ inputs.isaacsim-version }}
      run: |
        # Only attempt NGC login if API key is available
        if [ -n "${NGC_API_KEY:-}" ]; then
          echo "Logging into NGC registry..."
          printf '%s' "${NGC_API_KEY}" | docker login -u '$oauthtoken' --password-stdin nvcr.io
          echo "✅ Successfully logged into NGC registry"
        else
          echo "⚠️ NGC_API_KEY not available - skipping NGC login"
          echo "This is normal for PRs from forks or when secrets are not configured"
        fi

        # NGC declines the runner's inherited private-org credentials a pull token
        # for the public nvidia/* catalog, so keep those credentials only while
        # they can read the base image this build was asked for.
        if ! docker buildx imagetools inspect "${BASE_IMAGE_REF}" >/dev/null 2>&1; then
          ANON_CONFIG_DIR=$(mktemp -d)
          echo '{"credsStore":"","auths":{}}' > "${ANON_CONFIG_DIR}/config.json"
          if DOCKER_CONFIG="${ANON_CONFIG_DIR}" docker buildx imagetools inspect \
            "${BASE_IMAGE_REF}" >/dev/null 2>&1; then
            echo "⚠️ Inherited credentials cannot read ${BASE_IMAGE_REF}; using anonymous access"
            echo "DOCKER_CONFIG=${ANON_CONFIG_DIR}" >> "$GITHUB_ENV"
          else
            rm -rf "${ANON_CONFIG_DIR}"
          fi
        fi

    - name: Build Docker Image
      shell: sh
      run: |
        # Function to build Docker image
        build_docker_image() {
          local image_tag="$1"
          local isaacsim_base_image="$2"
          local isaacsim_version="$3"
          local dockerfile_path="$4"
          local context_path="$5"

          # Skip build if image already exists locally (e.g. built by a prior job on the same runner)
          if docker image inspect "$image_tag" > /dev/null 2>&1; then
            echo "Image $image_tag already exists locally, skipping build."
            return 0
          fi

          echo "Building Docker image: $image_tag"
          echo "Using Dockerfile: $dockerfile_path"
          echo "Build context: $context_path"

          # Build Docker image
          docker buildx build --progress=plain --platform linux/amd64 \
            -t $image_tag \
            --build-arg ISAACSIM_BASE_IMAGE_ARG="$isaacsim_base_image" \
            --build-arg ISAACSIM_VERSION_ARG="$isaacsim_version" \
            --build-arg ISAACSIM_ROOT_PATH_ARG=/isaac-sim \
            --build-arg ISAACLAB_PATH_ARG=/workspace/isaaclab \
            --build-arg DOCKER_USER_HOME_ARG=/root \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -f $dockerfile_path \
            --load $context_path

          echo "✅ Docker image built successfully: $image_tag"
          echo "Current local Docker images:"
          docker images
        }

        # Call the function with provided parameters
        build_docker_image "${{ inputs.image-tag }}" "${{ inputs.isaacsim-base-image }}" "${{ inputs.isaacsim-version }}" "${{ inputs.dockerfile-path }}" "${{ inputs.context-path }}"
