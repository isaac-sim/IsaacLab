name: 'Upload JUnit Test Results'
description: >
  Uploads a JUnit XML report as a GitHub artifact and forwards it to the
  omni-github test-results pipeline. Both uploads are best-effort: a missing
  report is silently ignored by the artifact upload and warned about by the
  omni-github converter.

inputs:
  junit-file:
    description: 'Path to the JUnit XML report'
    required: true
  artifact-name:
    description: 'GitHub artifact name for the raw JUnit XML'
    required: true
  artifact-prefix:
    description: 'Artifact name prefix passed to upload-omni-github-test-results'
    required: true
  test-type:
    description: 'Suite category stored on each omni-github test row (e.g. installation-e2e)'
    default: 'pytest'
    required: false
  comparison-images-path:
    description: 'Path to comparison images directory; uploaded as a separate artifact when provided'
    default: ''
    required: false
  comparison-images-artifact-name:
    description: 'GitHub artifact name for the comparison images'
    default: ''
    required: false
  retention-days:
    description: 'GitHub artifact retention in days'
    default: '7'
    required: false

runs:
  using: composite
  steps:
    - name: Upload comparison images
      if: always() && inputs.comparison-images-path != ''
      id: upload-comparison-images
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.comparison-images-artifact-name }}
        path: ${{ inputs.comparison-images-path }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}
        compression-level: 9

    - name: Upload JUnit XML report
      if: always()
      id: upload-junit-report
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.junit-file }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}
        compression-level: 9

    - name: Upload omni-github test results
      if: always()
      uses: ./.github/actions/upload-omni-github-test-results
      with:
        junit-file: ${{ inputs.junit-file }}
        junit-log-url: ${{ steps.upload-junit-report.outputs.artifact-url }}
        comparison-images-url: ${{ steps.upload-comparison-images.outputs.artifact-url }}
        artifact-prefix: ${{ inputs.artifact-prefix }}
        test-type: ${{ inputs.test-type }}
        retention-days: ${{ inputs.retention-days }}
