name: Tools Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # The repo-root conftest.py writes the crash journal these tests read back.
      - "conftest.py"
      # Tool subpackages have separate test workflows.
      - "tools/*.py"
      - "tools/perf_smoke/**"
      - "tools/perf_smoke_thresholds.json"
      # Shared CI action helpers and their co-located tests.
      - ".github/actions/_lib/**"
      - ".github/actions/ecr-build-push-pull/**"
      - ".github/workflows/build.yaml"
      - ".github/workflows/tools-tests.yml"
  workflow_dispatch:

concurrency:
  group: tools-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tools-tests:
    name: Tools tests
    runs-on: ubuntu-latest
    # Stop the job if a crash-test subprocess hangs.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Use this workflow's dependency list as the cache key.
          cache-dependency-path: .github/workflows/tools-tests.yml

      # These tests run without Isaac Sim; flaky and pytest-xdist enable retry and parallel crash tests.
      - name: Install test dependencies
        run: bash "$GITHUB_WORKSPACE/.github/actions/_lib/with-python-package-retries.sh" python3 -m pip install pytest pytest-xdist junitparser flaky pyyaml

      - name: Run tools tests
        env:
          # The tests import the modules under test (crash_journal) directly.
          PYTHONPATH: tools
        # Explicit files avoid tests that need Isaac Sim; --noconftest prevents the full-suite orchestrator from running.
        run: python3 -m pytest tools/test_crash_journal.py tools/test_file_scheduler.py
          .github/actions/_lib/test_performance_workflow.py -v --noconftest

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Test performance comparisons
        run: uv run --no-project --with-requirements tools/perf_smoke/requirements.txt --with pytest --with pyyaml
          python -m pytest tools/perf_smoke/test_source_revision.py tools/perf_smoke/test_paired.py -v --noconftest
