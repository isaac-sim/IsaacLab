# ARM/Spark CI — exercises Isaac Lab on aarch64 Linux self-hosted runners
# (NVIDIA DGX Spark). Mirrors build.yaml's structure: one job builds
# Dockerfile.base for linux/arm64 via the shared ecr-build-push-pull action
# (with ECR-backed deps caching), downstream jobs pull the same image and
# `docker run` pytest inside it.
#
# Each test step is wrapped with `continue-on-error: true` so a failure in
# one tier does not abort the others. Each pytest invocation passes
# `--timeout=N --timeout-method=signal --continue-on-collection-errors` so a
# hung or import-broken test cannot consume the whole job slot.
#
# Marker-driven discovery: `pytest <path> -m arm_ci`. Adding a new aarch64-safe
# test = tag it with arm_ci, no yaml edit.

name: ARM CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
  # Arch-suffixed tag so the per-commit ECR lookup, layer cache, and local
  # docker tag never collide with the linux/amd64 image built by build.yaml.
  CI_IMAGE_TAG: isaac-lab-ci-arm64:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_arm_ci: ${{ steps.detect.outputs.run_arm_ci }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          patterns=(
            $'^source/\tLibrary source code'
            $'^tools/\tBuild tooling'
            $'^apps/\tStandalone apps'
            $'^docker/\tContainer build inputs'
            $'(^|/)pyproject\\.toml$\tPython project metadata'
            $'^\\.github/workflows/arm-ci\\.yaml$\tThis workflow file'
            $'^\\.github/actions/ecr-build-push-pull/\tECR action'
            $'^VERSION$\tVersion file'
          )
          any_match() {
            local files="$1" entry regex
            for entry in "${patterns[@]}"; do
              IFS=$'\t' read -r regex _ <<< "$entry"
              if grep -qE "$regex" <<< "$files"; then
                return 0
              fi
            done
            return 1
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_arm_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' || true)"
          if [ -z "$changed_files" ] || any_match "$changed_files"; then
            echo "run_arm_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_arm_ci=false" >> "$GITHUB_OUTPUT"
          fi

  config:
    name: Load Config
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_arm_ci == 'true'
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: load
        shell: bash
        run: |
          set -euo pipefail
          # Read isaacsim_image_name/tag from .github/workflows/config.yaml.
          # Fallback to nightly tag if yq is unavailable on ubuntu-latest.
          if command -v yq >/dev/null 2>&1; then
            name=$(yq -r .isaacsim_image_name .github/workflows/config.yaml)
            tag=$(yq -r .isaacsim_image_tag .github/workflows/config.yaml)
          else
            name=$(grep '^isaacsim_image_name:' .github/workflows/config.yaml | awk '{print $2}')
            tag=$(grep '^isaacsim_image_tag:' .github/workflows/config.yaml | awk '{print $2}')
          fi
          echo "isaacsim_image_name=$name" >> "$GITHUB_OUTPUT"
          echo "isaacsim_image_tag=$tag" >> "$GITHUB_OUTPUT"

  build-arm:
    name: Build Base Docker Image (arm64)
    runs-on: [self-hosted, arm64]
    needs: [changes, config]
    if: needs.changes.outputs.run_arm_ci == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Build and push to ECR
        uses: ./.github/actions/ecr-build-push-pull
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base-arm64
          platform: linux/arm64

  arm-ci:
    name: arm-ci
    runs-on: [self-hosted, arm64]
    needs: [build-arm, config]
    if: needs.build-arm.result == 'success'
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Pull Base Docker image
        uses: ./.github/actions/ecr-build-push-pull
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base-arm64
          platform: linux/arm64

      - name: Run tier 1/2 tests
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p reports
          # Dockerfile.base already installs isaaclab via ./isaaclab.sh --install
          # and symlinks _isaac_sim → /isaac-sim, so the container is ready to
          # run pytest immediately. We bind-mount the workspace so the test
          # files reflect this PR's checkout (not the image's frozen copy).
          docker run --rm --user root \
            -v "${{ github.workspace }}":/workspace/isaaclab \
            -w /workspace/isaaclab \
            --gpus all \
            -e ACCEPT_EULA=Y \
            -e OMNI_KIT_ACCEPT_EULA=yes \
            -e ISAAC_SIM_HEADLESS=1 \
            -e PRIVACY_CONSENT=Y \
            --entrypoint bash \
            "${{ env.CI_IMAGE_TAG }}" -lc '
              set +e  # individual tier failures do not abort the script

              echo "::group::Tier 1 — general-arm smoke (torch + scipy)"
              ./isaaclab.sh -p -m pytest \
                source/isaaclab/test/deps \
                --ignore=tools/conftest.py \
                -m arm_ci \
                --continue-on-collection-errors \
                --timeout=60 \
                --timeout-method=signal \
                -v \
                --junitxml=reports/general-arm.xml
              echo "::endgroup::"

              echo "::group::Tier 1 — kit-launch-arm (boot Kit headless)"
              timeout 120 ./isaaclab.sh -p -c "from isaaclab.app import AppLauncher; sim = AppLauncher(headless=True).app; assert sim is not None, \"AppLauncher did not return a SimulationApp\"; sim.close()"
              echo "::endgroup::"

              # Tier 2 uses tools/conftest.py subprocess-per-file orchestrator
              # (CI_MARKER=arm_ci) so aarch64 Kit re-init across multiple
              # AppLauncher-at-module-level test files cannot SIGSEGV — each
              # test file gets its own python process.
              echo "::group::Tier 2 — arm_ci marker discovery (subprocess-per-file)"
              CI_MARKER=arm_ci ./isaaclab.sh -p -m pytest tools -v --junitxml=reports/tier2-arm.xml
              echo "::endgroup::"
              true
            '

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-ci-reports
          path: reports/
          retention-days: 7
