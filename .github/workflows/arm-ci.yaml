# ARM/Spark CI — exercises Isaac Lab on aarch64 Linux self-hosted runners
# (NVIDIA DGX Spark). Mirrors the spirit of build.yaml but stays lean by
# running tests inside the multi-arch nvcr.io/nvidian/isaac-sim image
# instead of building a full isaac-lab-ci image. (Once the apt deps and
# editable-install scope stabilize, we can promote to a Dockerfile.base
# build that mirrors build.yaml's structure end-to-end.)
#
# Single job, multiple steps. Each test step sets `continue-on-error: true`
# so a failure in one tier does not abort the others. Each pytest invocation
# passes `--timeout=N --timeout-method=signal --continue-on-collection-errors`
# so a hung or import-broken test cannot consume the whole job slot.
#
# Marker-driven discovery: `pytest <path> -m arm_ci`. Adding a new aarch64-safe
# test = tag it with arm_ci, no yaml edit.

name: ARM CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_arm_ci: ${{ steps.detect.outputs.run_arm_ci }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          patterns=(
            $'^source/\tLibrary source code'
            $'^tools/\tBuild tooling'
            $'^apps/\tStandalone apps'
            $'^docker/\tContainer build inputs'
            $'(^|/)pyproject\\.toml$\tPython project metadata'
            $'^\\.github/workflows/arm-ci\\.yaml$\tThis workflow file'
            $'^\\.github/actions/ecr-build-push-pull/\tECR action'
            $'^VERSION$\tVersion file'
          )
          any_match() {
            local files="$1" entry regex
            for entry in "${patterns[@]}"; do
              IFS=$'\t' read -r regex _ <<< "$entry"
              if grep -qE "$regex" <<< "$files"; then
                return 0
              fi
            done
            return 1
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_arm_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' || true)"
          if [ -z "$changed_files" ] || any_match "$changed_files"; then
            echo "run_arm_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_arm_ci=false" >> "$GITHUB_OUTPUT"
          fi

  config:
    name: Load Config
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_arm_ci == 'true'
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: load
        shell: bash
        run: |
          set -euo pipefail
          # Read isaacsim_image_name/tag from .github/workflows/config.yaml.
          # Fallback to nightly tag if yq is unavailable on ubuntu-latest.
          if command -v yq >/dev/null 2>&1; then
            name=$(yq -r .isaacsim_image_name .github/workflows/config.yaml)
            tag=$(yq -r .isaacsim_image_tag .github/workflows/config.yaml)
          else
            name=$(grep '^isaacsim_image_name:' .github/workflows/config.yaml | awk '{print $2}')
            tag=$(grep '^isaacsim_image_tag:' .github/workflows/config.yaml | awk '{print $2}')
          fi
          echo "isaacsim_image_name=$name" >> "$GITHUB_OUTPUT"
          echo "isaacsim_image_tag=$tag" >> "$GITHUB_OUTPUT"

  arm-ci:
    name: arm-ci
    runs-on: [self-hosted, arm64]
    needs: [changes, config]
    if: needs.changes.outputs.run_arm_ci == 'true'
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Login to nvcr.io
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NGC_API_KEY:-}" ]; then
            echo "${NGC_API_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          fi

      - name: Build arm-ci docker image
        shell: bash
        run: |
          set -euo pipefail
          # Build the lightweight arm-ci image from docker/Dockerfile.arm-ci.
          # That Dockerfile layers cmake/build-essential/git plus EULA env vars
          # and a bash entrypoint onto the multi-arch Isaac Sim base image
          # (auto-resolves to the arm64 manifest on aarch64 hosts).
          docker build \
            --platform linux/arm64 \
            --build-arg "ISAACSIM_BASE_IMAGE_ARG=${{ needs.config.outputs.isaacsim_image_name }}" \
            --build-arg "ISAACSIM_VERSION_ARG=${{ needs.config.outputs.isaacsim_image_tag }}" \
            -f docker/Dockerfile.arm-ci \
            -t isaac-lab-arm-ci:${{ github.sha }} \
            docker

      - name: Install isaaclab via ./isaaclab.sh -i + run all tier 1/2 tests
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          # Single docker run because uv-managed Python lives in
          # $HOME/.cache/uv/python inside the container and is discarded on
          # container exit, leaving env_isaaclab_uv/bin/python as a dangling
          # symlink in subsequent containers.
          #
          # Install via ./isaaclab.sh -i (the canonical user-facing install
          # entry point) instead of hand-rolled uv pip install lines. This
          # picks up _ensure_cuda_torch (re-installs cu130 torch on aarch64
          # after isaacsim downgrades it to a CPU wheel), nlopt arm prep,
          # pin-pink dependency probe, etc. — same install path real users
          # hit on `./isaaclab.sh -i`, so CI failures here are real user bugs.
          mkdir -p reports
          docker run --rm --user root \
            -v "${{ github.workspace }}":/workspace/isaaclab \
            -w /workspace/isaaclab \
            --gpus all \
            isaac-lab-arm-ci:${{ github.sha }} "
              set -e
              if ! command -v uv >/dev/null 2>&1; then
                curl -LsSf https://astral.sh/uv/install.sh | sh
                export PATH=\$HOME/.local/bin:\$PATH
              fi

              uv venv --python 3.12 env_isaaclab_uv
              source env_isaaclab_uv/bin/activate
              uv pip install pytest pytest-timeout

              # Use ./isaaclab.sh -i (mirrors user install path).
              # Tokens: isaacsim (Tier 1 kit-launch + controllers need it),
              #         ov[ovrtx] (Tier 2 newton-ovrtx kitless rendering needs ovrtx).
              # _ensure_cuda_torch fires automatically after isaacsim install.
              ./isaaclab.sh -i isaacsim,'ov[ovrtx]'
              python -c 'import isaaclab, isaaclab_assets, isaaclab_physx, isaaclab_tasks; print(\"editable imports ok\")'

              set +e  # individual tier failures do not abort the script

              echo '::group::Tier 1 — general-arm smoke (torch + scipy)'
              ./isaaclab.sh -p -m pytest \
                source/isaaclab/test/deps \
                --ignore=tools/conftest.py \
                -m arm_ci \
                --continue-on-collection-errors \
                --timeout=60 \
                --timeout-method=signal \
                -v \
                --junitxml=reports/general-arm.xml
              echo '::endgroup::'

              echo '::group::Tier 1 — kit-launch-arm (boot Kit headless)'
              timeout 120 ./isaaclab.sh -p -c \"from isaaclab.app import AppLauncher; sim = AppLauncher(headless=True).app; assert sim is not None, 'AppLauncher did not return a SimulationApp'; sim.close()\"
              echo '::endgroup::'

              # Tier 2 uses tools/conftest.py's subprocess-per-file orchestrator
              # (CI_MARKER=arm_ci) so aarch64 Kit re-init across multiple
              # AppLauncher-at-module-level test files doesn't SIGSEGV — each
              # test file gets its own Python process.
              echo '::group::Tier 2 — arm_ci marker discovery (subprocess-per-file)'
              CI_MARKER=arm_ci python -m pytest tools -v --junitxml=reports/tier2-arm.xml
              echo '::endgroup::'
              true
            "

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-ci-reports
          path: reports/
          retention-days: 7

      - name: Clean up per-run image
        if: always()
        shell: bash
        run: |
          docker rmi -f isaac-lab-arm-ci:${{ github.sha }} || true
