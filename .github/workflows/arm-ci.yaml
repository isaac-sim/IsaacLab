# ARM/Spark CI — exercises Isaac Lab on aarch64 Linux self-hosted runners
# (NVIDIA DGX Spark). Single job that builds Dockerfile.base for linux/arm64
# and runs the `arm_ci`-marked pytest set against it. ECR is not wired for
# arm64, so build output stays local to the runner; the action's local
# exact-tag and deps-tag checks short-circuit rebuilds when the runner is
# still warm from a prior run.
#
# Marker-driven discovery: `pytest <path> -m arm_ci`. Adding a new aarch64-safe
# test = tag it with arm_ci, no yaml edit.

name: ARM CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'release/**'
  push:
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
  # Arch-suffixed tag so the per-commit ECR lookup, layer cache, and local
  # docker tag never collide with the linux/amd64 image built by build.yaml.
  CI_IMAGE_TAG: isaac-lab-ci-arm64:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_arm_ci: ${{ steps.detect.outputs.run_arm_ci }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          patterns=(
            $'^source/\tLibrary source code'
            $'^tools/\tBuild tooling'
            $'^apps/\tStandalone apps'
            $'^docker/\tContainer build inputs'
            $'(^|/)pyproject\\.toml$\tPython project metadata'
            $'^\\.github/workflows/arm-ci\\.yaml$\tThis workflow file'
            $'^\\.github/actions/ecr-build-push-pull/\tECR action'
            $'^VERSION$\tVersion file'
          )
          any_match() {
            local files="$1" entry regex
            for entry in "${patterns[@]}"; do
              IFS=$'\t' read -r regex _ <<< "$entry"
              if grep -qE "$regex" <<< "$files"; then
                return 0
              fi
            done
            return 1
          }
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_arm_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' || true)"
          if [ -z "$changed_files" ] || any_match "$changed_files"; then
            echo "run_arm_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_arm_ci=false" >> "$GITHUB_OUTPUT"
          fi

  config:
    name: Load Config
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.run_arm_ci == 'true'
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: load
        shell: bash
        run: |
          set -euo pipefail
          # Read isaacsim_image_name/tag from .github/workflows/config.yaml.
          # Fallback to nightly tag if yq is unavailable on ubuntu-latest.
          if command -v yq >/dev/null 2>&1; then
            name=$(yq -r .isaacsim_image_name .github/workflows/config.yaml)
            tag=$(yq -r .isaacsim_image_tag .github/workflows/config.yaml)
          else
            name=$(grep '^isaacsim_image_name:' .github/workflows/config.yaml | awk '{print $2}')
            tag=$(grep '^isaacsim_image_tag:' .github/workflows/config.yaml | awk '{print $2}')
          fi
          echo "isaacsim_image_name=$name" >> "$GITHUB_OUTPUT"
          echo "isaacsim_image_tag=$tag" >> "$GITHUB_OUTPUT"

  arm-ci:
    name: arm-ci
    runs-on: [self-hosted, arm64]
    needs: [changes, config]
    if: needs.changes.outputs.run_arm_ci == 'true'
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true

      - name: Build Base Docker image
        uses: ./.github/actions/ecr-build-push-pull
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base-arm64
          platform: linux/arm64

      # tools/conftest.py's subprocess-per-file orchestrator picks up
      # CI_MARKER=arm_ci and spawns one python subprocess per test file
      # tagged `pytest.mark.arm_ci`. Each Kit launch is isolated, so the
      # AppLauncher-at-module-level pattern cannot SIGSEGV across files.
      - name: Run arm_ci marker tests
        uses: ./.github/actions/run-tests
        with:
          test-path: "tools"
          result-file: "arm-ci-report.xml"
          container-name: "isaac-lab-arm-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          image-tag: ${{ env.CI_IMAGE_TAG }}
          pytest-options: ""
          ci-marker: "arm_ci"
          volume-mount-source: ${{ github.workspace }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-ci-reports
          path: reports/
          retention-days: 7
