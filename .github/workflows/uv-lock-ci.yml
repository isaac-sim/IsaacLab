# Pure-``uv`` install path. Exercises the workflow a fresh user runs (see
# docs/source/setup/installation/uv_run.rst). This is the basic installation that must
# always work for everyone, so on every change to the dependency graph it checks that a
# fresh resolution works with both supported physics backends in sequence:
#
#   - Newton MJWarp  -- ``uv lock --upgrade`` still resolves, installs, and trains.
#   - PhysX          -- ``uv run --extra isaacsim`` reuses the environment and adds Isaac Sim.
#
# GPU access: like every other GPU job in this repo (see .github/actions/run-tests and
# tools/run_install_ci.py), the work runs inside a container launched with ``--gpus all``.
# Bare steps on the self-hosted host do NOT see the GPU. Do NOT set ``CUDA_VISIBLE_DEVICES``
# (``all`` is not a valid value and hides every device); ``--gpus all`` handles exposure.
#
# NOTE: A ``paths:`` filter keeps this off unrelated PRs. Do NOT mark this workflow a
# required status check while the filter is in place: a required check that never
# triggers blocks the PR forever (same reasoning as install-ci.yml).

name: uv Lockfile Install

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "source/**"
      - ".github/workflows/uv-lock-ci.yml"
  push:
    branches:
      - main
      - develop
      - "release/**"
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "source/**"
      - ".github/workflows/uv-lock-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  uv-train:
    name: uv run training
    runs-on: [self-hosted, gpu]
    timeout-minutes: 90
    container:
      image: ubuntu:24.04
      # --gpus all exposes the GPUs (the repo-wide pattern); NVIDIA_DRIVER_CAPABILITIES=all
      # is set at create time so graphics/compute driver libs are injected for the backends.
      options: --gpus all -e NVIDIA_DRIVER_CAPABILITIES=all
    env:
      # Isaac Sim wheels refuse to import without EULA acceptance.
      OMNI_KIT_ACCEPT_EULA: "yes"
      ACCEPT_EULA: "Y"
      ISAACSIM_ACCEPT_EULA: "YES"
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The bare ubuntu:24.04 image needs git (for checkout + lfs) and the build toolchain
      # a couple of dependencies compile from sdist. Mirrors Dockerfile.installci's set.
      - name: Install system prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git git-lfs curl cmake python3 python3-dev python3-venv \
            build-essential libglib2.0-0 ca-certificates

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Re-resolve against the live indexes to verify that an end user can update the lock
      # and still run successfully.
      - name: Re-resolve lockfile
        run: uv lock --upgrade

      - name: Verify CUDA GPU and core imports (fresh Newton MJWarp)
        run: |
          uv run python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "no CUDA GPU available inside the container"
          print("CUDA GPUs:", torch.cuda.device_count())
          import isaaclab
          import isaaclab_assets
          import isaaclab_tasks
          import isaaclab_rl
          import isaaclab_newton
          print("core imports ok")
          PY

      # Runs headless (no --visualizer/--viz). ``Training time:`` in the output confirms
      # training ran to completion rather than exiting early with a zero return code.
      - name: Train Cartpole (fresh Newton MJWarp)
        run: |
          set -o pipefail
          uv run isaaclab train \
            --rl_library rsl_rl \
            --task Isaac-Cartpole-Direct \
            --num_envs 16 \
            --max_iterations 5 \
            physics=newton_mjwarp 2>&1 | tee train-newton-fresh.log
          grep -q "Training time:" train-newton-fresh.log

      - name: Verify CUDA GPU and core imports (PhysX)
        run: |
          uv run --extra isaacsim python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "no CUDA GPU available inside the container"
          print("CUDA GPUs:", torch.cuda.device_count())
          import isaacsim
          import isaaclab
          import isaaclab_assets
          import isaaclab_tasks
          import isaaclab_rl
          print("Isaac Sim and core imports ok")
          PY

      - name: Train Cartpole (PhysX)
        run: |
          set -o pipefail
          uv run --extra isaacsim isaaclab train \
            --rl_library rsl_rl \
            --task Isaac-Cartpole-Direct \
            --num_envs 16 \
            --max_iterations 5 \
            physics=physx 2>&1 | tee train-physx.log
          grep -q "Training time:" train-physx.log
