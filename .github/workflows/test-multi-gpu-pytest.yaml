# Multi-GPU unit-test workflow
#
# Runs the cuda:1-parameterized subset of unit tests on the multi-GPU
# runner pool. Uses the same ECR-pulled isaac-lab image as the single-GPU
# CI; only diffs are the runner label, the env vars that pin Kit and the
# test parametrize to cuda:1, and the include-files list of opt-in tests.
#
# Adding a new test to multi-GPU coverage: migrate its device parametrize
# to call ``isaaclab.test.utils.cuda_test_devices()`` and add the file's
# basename to ``include-files`` below.

name: Multi-GPU pytest

on:
  pull_request:
    paths:
      - "source/isaaclab/isaaclab/test/utils/**"
      - "source/isaaclab/isaaclab/app/app_launcher.py"
      - "source/**/test/**/test_*.py"
      - ".github/workflows/test-multi-gpu-pytest.yaml"
      - ".github/actions/run-package-tests/**"
      - ".github/actions/run-tests/**"
      - ".github/actions/ecr-build-push-pull/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE_TAG: isaac-lab-ci:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

jobs:
  config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows/config.yaml
          sparse-checkout-cone-mode: false
      - id: load
        run: |
          set -euo pipefail
          f=.github/workflows/config.yaml
          echo "isaacsim_image_name=$(yq -r .isaacsim_image_name "$f")" >> "$GITHUB_OUTPUT"
          echo "isaacsim_image_tag=$(yq -r .isaacsim_image_tag "$f")" >> "$GITHUB_OUTPUT"

  build:
    name: Build / cache image + detect GPUs
    needs: [config]
    runs-on: [self-hosted, linux, x64, multi-gpu]
    outputs:
      # JSON array of cuda device indices to shard the test matrix across.
      # cuda:0 is omitted because single-GPU CI already covers it; we use
      # the non-default GPUs (cuda:1 .. cuda:N-1) for multi-GPU coverage.
      cuda_shards: ${{ steps.detect.outputs.shards }}
      # Length of cuda_shards, consumed as shard-count by tools/conftest.py.
      shard_count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Detect available GPUs
        # Query the actual runner instead of hard-coding ``[1, 2, 3]``.  If the
        # pool ever changes (4 → 2 GPUs, or 4 → 8 GPUs), the test matrix
        # follows automatically.  Fails fast here on a regressed pool so we
        # don't allocate test runners that will then fail.
        id: detect
        run: |
          N=$(nvidia-smi -L | wc -l)
          if [ "$N" -lt 2 ]; then
            echo "::error::Need at least 2 GPUs (cuda:0 + at least 1 non-default); found $N"
            exit 1
          fi
          shards=$(python3 -c "import json; print(json.dumps(list(range(1, $N))))")
          count=$((N - 1))
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "::notice::$N GPUs → shards=$shards (shard_count=$count)"

      # Pre-populates the ECR exact-commit tag from deps-cache (registry-side
      # alias). Without this prior step, run-package-tests' internal
      # ecr-build-push-pull hits exact-cache-miss + deps-cache-hit and leaves
      # no local image, causing `docker run` to fail with `pull access
      # denied`. Mirrors the build → test split in build.yaml.
      - uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base

  test-multi-gpu-pytest:
    name: Multi-GPU unit tests [cuda:${{ matrix.cuda }}]
    needs: [config, build]
    if: needs.build.result == 'success'
    runs-on: [self-hosted, linux, x64, multi-gpu]
    timeout-minutes: 30
    strategy:
      # Matrix shards pinned to each non-default cuda:N on the runner
      # (cuda:0 is covered by single-GPU CI). Shard list comes from the
      # build job's GPU detection, so the matrix auto-adapts to whatever
      # the multi-GPU pool exposes (4 GPUs today, could be 2 or 8 later).
      # fail-fast off so one shard's failure doesn't mask the others.
      fail-fast: false
      matrix:
        cuda: ${{ fromJSON(needs.build.outputs.cuda_shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Discover opt-in test files
        # Auto-discovery: any test_*.py that calls ``cuda_test_devices`` is
        # in scope.  Adding a new test to multi-GPU CI requires no workflow
        # edit — migrate the file to use the helper and the next run picks
        # it up.  Per-device skips (e.g. cuda:1 is known broken for a file)
        # are declared inside the file via ``cuda_test_devices(skip={...})``
        # so the workflow stays opt-in/opt-out-free.
        id: discover
        run: |
          mapfile -t discovered < <(grep -rl 'cuda_test_devices' source/ --include='test_*.py' | sort -u)
          if [ ${#discovered[@]} -eq 0 ]; then
            echo "::error::No opt-in tests discovered (grep for cuda_test_devices)"
            exit 1
          fi
          basenames=$(printf '%s\n' "${discovered[@]}" | xargs -n1 basename | sort -u | paste -sd,)
          echo "include=$basenames" >> "$GITHUB_OUTPUT"
          echo "::notice::Discovered ${#discovered[@]} opt-in test files"
          printf '  %s\n' "${discovered[@]}"

      - name: Compute shard env for this cuda device
        # ``matrix.cuda`` is the single source of truth.  ``cuda_test_devices``
        # reads ISAACLAB_TEST_DEVICES as a positional bitmask (pos 0=cpu,
        # pos k+1=cuda:k), so for cuda:N the mask is ``'0' * (N+1) + '1'``.
        # The shard-index for tools/conftest.py's ``paths[idx::3]`` slice is
        # ``cuda - 1`` (matrix.cuda runs 1..3, shard-index runs 0..2).
        id: shard
        run: |
          N="${{ matrix.cuda }}"
          mask=$(python3 -c "print('0' * ($N + 1) + '1')")
          echo "test_devices=$mask" >> "$GITHUB_OUTPUT"
          echo "sim_device=cuda:$N" >> "$GITHUB_OUTPUT"
          echo "shard_index=$((N - 1))" >> "$GITHUB_OUTPUT"
          echo "::notice::cuda:$N → mask=$mask, shard-index=$((N - 1))"

      - uses: ./.github/actions/run-package-tests
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          container-name: isaac-lab-multi-gpu-pytest-cuda${{ matrix.cuda }}
          # Auto-discovered from the ``Discover opt-in test files`` step:
          # every test that calls ``cuda_test_devices()`` is in scope.
          include-files: ${{ steps.discover.outputs.include }}
          # File-level shard split via tools/conftest.py:
          # ``test_files[shard_index::shard_count]`` after a stable sort.
          shard-index: ${{ steps.shard.outputs.shard_index }}
          shard-count: ${{ needs.build.outputs.shard_count }}
          # Pin Kit's active_gpu and the parametrize device to cuda:N so
          # the booted SimulationApp and per-test parametrize agree.
          extra-env-vars: |
            ISAACLAB_TEST_DEVICES=${{ steps.shard.outputs.test_devices }}
            ISAACLAB_SIM_DEVICE=${{ steps.shard.outputs.sim_device }}
