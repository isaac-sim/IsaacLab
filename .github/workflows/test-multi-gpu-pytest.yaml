# Multi-GPU unit-test workflow
#
# Runs the subset of unit tests that opt in to the multi-GPU device
# parametrization via :func:`isaaclab.testing.cuda_test_devices`.  On the
# multi-GPU runner pool the env var ``ISAACLAB_TEST_DEVICES=001`` makes the
# helper return ``[cuda:1]``; on single-GPU CI (where this workflow does not
# run) the env var is unset and the helper returns ``[cpu, cuda:0]``.
#
# Start small: only the P0 pure-Python utility tests are in the pytest target
# below.  Add files to the target list as their parametrize calls are
# migrated to use ``cuda_test_devices()``.

name: Multi-GPU pytest

on:
  pull_request:
    paths:
      - "source/isaaclab/isaaclab/testing/**"
      - "source/isaaclab/test/utils/test_math.py"
      - "source/isaaclab/test/utils/test_wrench_composer.py"
      - "source/isaaclab/test/utils/test_episode_data.py"
      - ".github/workflows/test-multi-gpu-pytest.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-multi-gpu-pytest:
    name: Multi-GPU unit tests
    runs-on: [self-hosted, linux, x64, multi-gpu]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install cmake via pip (avoid sudo apt path)
        # install.py skips its sudo apt-get block when ``cmake`` is already on
        # PATH (source/isaaclab/isaaclab/cli/commands/install.py:35).  The pip
        # wheel provides a cmake shim under the setup-python venv's bin/.
        run: pip install cmake

      - name: Install Isaac Lab
        # ``--install none`` = core submodules only (no mimic, no teleop, no
        # auto-extra features).  Avoids robomimic/egl_probe build that needs
        # libEGL/X11 headers the multi-GPU runner image lacks.
        run: ./isaaclab.sh --install none

      - name: Install Isaac Sim
        # Isaac Sim is an optional extra in source/isaaclab/setup.py and is
        # not pulled by ``--install none``.  Pinned to 6.0.0 (matches local
        # env_isaaclab); the 5.x line on PyPI requires Python 3.11.
        run: pip install 'isaacsim[all,extscache]==${{ vars.ISAACSIM_BASE_VERSION || '6.0.0' }}' --extra-index-url https://pypi.nvidia.com

      - name: Verify multi-GPU availability
        # Fail loud if the runner regressed to a single GPU.  ``cuda_test_devices``
        # in strict mode would also raise on a mask requesting an unavailable
        # device, but pre-flight gives a clearer diagnostic.
        run: |
          GPU_COUNT=$(nvidia-smi -L | wc -l)
          echo "Detected $GPU_COUNT GPU(s)"
          if [ "$GPU_COUNT" -lt 2 ]; then
            echo "::error::At least 2 GPUs required for multi-GPU pytest, found $GPU_COUNT"
            exit 1
          fi

      - name: Run multi-GPU unit tests
        # ISAACLAB_TEST_DEVICES=001 makes cuda_test_devices() return [cuda:1].
        # Tests in the pytest target below are migrated to call the helper, so
        # they run only on cuda:1 here (single-GPU CI continues to run them on
        # [cpu, cuda:0] via the helper's default mask 110).
        env:
          OMNI_KIT_ACCEPT_EULA: "yes"
          ACCEPT_EULA: "Y"
          ISAAC_SIM_HEADLESS: "1"
          ISAACLAB_TEST_DEVICES: "001"
        run: |
          ./isaaclab.sh -p -m pytest -v \
            source/isaaclab/test/utils/test_math.py \
            source/isaaclab/test/utils/test_wrench_composer.py \
            source/isaaclab/test/utils/test_episode_data.py
