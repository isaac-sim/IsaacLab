# Multi-GPU unit-test workflow
#
# Runs the non-default-GPU subset of unit tests across the multi-GPU runner
# pool's GPUs in parallel. Uses the same ECR-pulled isaac-lab image as the
# single-GPU CI; only diffs are the runner label and the env vars that pin
# Kit and the test parametrize to the shard's non-default GPU.
#
# Adding a new test to multi-GPU coverage: give its device parametrize a
# non-default-capable scope — argless ``isaaclab.test.utils.test_devices()``
# (cpu + cuda:0 + non-default GPUs) or any ``"..X"`` mask. The workflow
# auto-discovers it.

name: Multi-GPU pytest

on:
  pull_request:
    paths:
      - "source/isaaclab/isaaclab/test/utils/**"
      - "source/isaaclab/isaaclab/app/app_launcher.py"
      - "source/**/test/**/test_*.py"
      - ".github/workflows/test-multi-gpu-pytest.yaml"
      - ".github/actions/run-package-tests/**"
      - ".github/actions/run-tests/**"
      - ".github/actions/ecr-build-push-pull/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE_TAG: isaac-lab-ci:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

jobs:
  config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows/config.yaml
          sparse-checkout-cone-mode: false
      - id: load
        run: |
          set -euo pipefail
          f=.github/workflows/config.yaml
          echo "isaacsim_image_name=$(yq -r .isaacsim_image_name "$f")" >> "$GITHUB_OUTPUT"
          echo "isaacsim_image_tag=$(yq -r .isaacsim_image_tag "$f")" >> "$GITHUB_OUTPUT"

  build:
    name: Build / cache image + detect GPUs
    needs: [config]
    runs-on: [self-hosted, linux, x64, multi-gpu]
    outputs:
      # JSON array of cuda device indices to shard the test matrix across.
      # cuda:0 is omitted because single-GPU CI already covers it; we use
      # the non-default GPUs (cuda:1 .. cuda:N-1) for multi-GPU coverage.
      cuda_shards: ${{ steps.detect.outputs.shards }}
      # Length of cuda_shards, consumed as shard-count by tools/conftest.py.
      shard_count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Detect available GPUs
        # Query the actual runner instead of hard-coding ``[1, 2, 3]``.  If the
        # pool ever changes (4 → 2 GPUs, or 4 → 8 GPUs), the test matrix
        # follows automatically.  Fails fast here on a regressed pool so we
        # don't allocate test runners that will then fail.
        id: detect
        run: |
          N=$(nvidia-smi -L | wc -l)
          if [ "$N" -lt 2 ]; then
            echo "::error::Need at least 2 GPUs (cuda:0 + at least 1 non-default); found $N"
            exit 1
          fi
          shards=$(python3 -c "import json; print(json.dumps(list(range(1, $N))))")
          count=$((N - 1))
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "::notice::$N GPUs → shards=$shards (shard_count=$count)"

      # Pre-populates the ECR exact-commit tag from deps-cache (registry-side
      # alias). Without this prior step, run-package-tests' internal
      # ecr-build-push-pull hits exact-cache-miss + deps-cache-hit and leaves
      # no local image, causing `docker run` to fail with `pull access
      # denied`. Mirrors the build → test split in build.yaml.
      - uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base

  test-multi-gpu-pytest:
    name: Multi-GPU unit tests
    needs: [config, build]
    if: needs.build.result == 'success'
    runs-on: [self-hosted, linux, x64, multi-gpu]
    # DIAGNOSTIC: 45 min (target is 30). The first buffered parallel run hit
    # the 30-min wall without finishing or printing anything. Raised so a
    # slow-but-completing run yields real per-shard durations; tighten back
    # to 30 once the split is balanced and the contention picture is clear.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Discover opt-in test files
        # Auto-discovery: any test_*.py with a non-default-capable scope — an
        # argless ``test_devices()`` (defaults to "11X") or any
        # ``test_devices("..X")`` mask, whose trailing ``X`` spans the
        # non-default GPUs — is in scope.  Adding a test to multi-GPU CI needs
        # no workflow edit; opting a file out is just narrowing its scope (drop
        # the ``X``, e.g. "110"), so the workflow stays opt-in/opt-out-free.
        id: discover
        run: |
          # Known-fragile exclusion: newton + physx ``test_articulation`` trigger a
          # Kit/Isaac-Sim process-lifecycle failure under concurrent multi-GPU
          # execution on non-default GPUs (newton: SIGHUP ~80% into the file on
          # cuda:2/3; physx: shutdown hang). It is not reproducible single-host and
          # is not caused by the sharding (workflow/conftest/queue verified clean);
          # the heavy file is the same one the Kit-integration pipeline disables.
          # The file still runs in single-GPU CI. Tracked upstream as a Kit issue
          # (see PR description); re-include by dropping this grep filter once fixed.
          mapfile -t discovered < <(grep -rlE 'test_devices\(\)|test_devices\("[^"]*X"\)' source/ --include='test_*.py' \
            | grep -vE 'isaaclab_(newton|physx)/test/assets/test_articulation\.py' \
            | sort -u)
          if [ ${#discovered[@]} -eq 0 ]; then
            echo "::error::No opt-in tests discovered (grep for test_devices with an X scope)"
            exit 1
          fi
          basenames=$(printf '%s\n' "${discovered[@]}" | xargs -n1 basename | sort -u | paste -sd,)
          echo "include=$basenames" >> "$GITHUB_OUTPUT"
          # Full relative paths too, to seed the shared work queue (the run step
          # needs runnable paths, not just basenames).
          echo "paths=$(printf '%s,' "${discovered[@]}")" >> "$GITHUB_OUTPUT"
          echo "::notice::Discovered ${#discovered[@]} opt-in test files"
          printf '  %s\n' "${discovered[@]}"

      - name: Pull image from ECR
        # Pulls the per-commit image the build job pushed. ecr-build-push-pull
        # handles ECR auth via the EC2 IAM role, and on exact-cache-hit (which
        # the build job's deps-cache-hit registry-tag created for this SHA)
        # it pulls the image locally and tags it as ``$CI_IMAGE_TAG`` for our
        # parallel ``docker run`` block below.
        uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base

      - name: Run shards in parallel on local GPUs
        # Single job, one container per non-default cuda:N, all launched in
        # parallel on the SAME runner — uses the GPUs the multi-gpu instance
        # exposes without burning N separate runners from the pool.  All shards
        # pull from one shared work queue (ISAACLAB_TEST_QUEUE) instead of a
        # static slice, so every file runs on exactly one GPU with dynamic
        # (work-stealing) balancing.
        env:
          IMAGE_TAG: ${{ env.CI_IMAGE_TAG }}
          CUDA_SHARDS: ${{ needs.build.outputs.cuda_shards }}
          INCLUDE_FILES: ${{ steps.discover.outputs.include }}
          PATHS: ${{ steps.discover.outputs.paths }}
        run: |
          set +e
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          host_user="$(id -un)"

          # Pre-create the ``_isaac_sim`` symlink on the host once so the
          # parallel containers don't race rm/ln on the shared workspace
          # mount.  The host has no /isaac-sim path, so the symlink is
          # dangling locally; inside each container it resolves to
          # /isaac-sim correctly.
          rm -f _isaac_sim && ln -s /isaac-sim _isaac_sim

          runtime_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/mgpu-runtime.XXXXXX")"
          mkdir -p "$runtime_dir"

          # Shared work queue: all discovered files, one per line, in a dir
          # mounted into every shard container. Each container's conftest claims
          # the next file under flock (work-stealing), so a container that lands
          # a slow file simply claims fewer — dynamic balance, each file once.
          queue_dir="$runtime_dir/queue"
          mkdir -p "$queue_dir"
          printf '%s\n' "$PATHS" | tr ',' '\n' | grep -v '^$' > "$queue_dir/queue.txt"
          echo "::notice::seeded work queue with $(wc -l < "$queue_dir/queue.txt") files"

          declare -A pids logfiles results
          for cuda in $(echo "$CUDA_SHARDS" | jq -r '.[]'); do
            # Per-shard runtime mask naming exactly this shard's GPU: position
            # cuda+1 is set (position 0 = cpu, 1 = cuda:0, 2 = cuda:1, ...), so
            # cuda:1 -> "001", cuda:2 -> "0001".  scope ∩ runtime then resolves
            # to this one non-default GPU, and ISAACLAB_SIM_DEVICE boots Kit on
            # the same one.  Each file runs once on one non-default GPU.
            runtime_devices=$(python3 -c "print('0' * ($cuda + 1) + '1')")
            idx=$((cuda - 1))

            # Per-shard writable runtime tree mirroring run-tests action
            # (HOME, Kit cache/data/logs, isaac-sim writable subdirs).
            shard_runtime="$runtime_dir/cuda-$cuda"
            mkdir -p \
              "$shard_runtime/home/.cache" \
              "$shard_runtime/home/.local/share" \
              "$shard_runtime/home/.nvidia-omniverse/config" \
              "$shard_runtime/home/.nvidia-omniverse/logs" \
              "$shard_runtime/isaac-sim/kit/cache" \
              "$shard_runtime/isaac-sim/kit/data" \
              "$shard_runtime/isaac-sim/kit/logs" \
              "$shard_runtime/isaac-sim/cache" \
              "$shard_runtime/isaac-sim/computecache" \
              "$shard_runtime/isaac-sim/config" \
              "$shard_runtime/isaac-sim/data" \
              "$shard_runtime/isaac-sim/logs" \
              "$shard_runtime/isaac-sim/pkg"
            logfiles[$cuda]="$runtime_dir/shard-cuda-$cuda.log"

            # Subshell: stream tagged output live AND keep a clean per-shard
            # logfile (tee writes the unprefixed stream for the end-of-job
            # grouped re-print; sed prefixes the live copy so the three
            # concurrent shards stay followable in the workflow log).
            (
            docker run --rm --gpus all --network=host \
              --entrypoint bash \
              --user "${host_uid}:${host_gid}" \
              --name "isaac-lab-mgpu-cuda${cuda}-${{ github.run_id }}-${{ github.run_attempt }}" \
              -v "$PWD:/workspace/isaaclab:rw" \
              -v "$shard_runtime/home:/tmp/isaaclab-ci-home:rw" \
              -v "$shard_runtime/isaac-sim/kit/cache:/isaac-sim/kit/cache:rw" \
              -v "$shard_runtime/isaac-sim/kit/data:/isaac-sim/kit/data:rw" \
              -v "$shard_runtime/isaac-sim/kit/logs:/isaac-sim/kit/logs:rw" \
              -v "$shard_runtime/isaac-sim/cache:/isaac-sim/.cache:rw" \
              -v "$shard_runtime/isaac-sim/computecache:/isaac-sim/.nv/ComputeCache:rw" \
              -v "$shard_runtime/isaac-sim/config:/isaac-sim/.nvidia-omniverse/config:rw" \
              -v "$shard_runtime/isaac-sim/data:/isaac-sim/.local/share/ov/data:rw" \
              -v "$shard_runtime/isaac-sim/logs:/isaac-sim/.nvidia-omniverse/logs:rw" \
              -v "$shard_runtime/isaac-sim/pkg:/isaac-sim/.local/share/ov/pkg:rw" \
              -v "$queue_dir:/mgpu:rw" \
              -e HOME=/tmp/isaaclab-ci-home \
              -e XDG_CACHE_HOME=/tmp/isaaclab-ci-home/.cache \
              -e XDG_DATA_HOME=/tmp/isaaclab-ci-home/.local/share \
              -e USER="${host_user}" \
              -e LOGNAME="${host_user}" \
              -e OMNI_KIT_ACCEPT_EULA=yes \
              -e ACCEPT_EULA=Y \
              -e OMNI_KIT_DISABLE_CUP=1 \
              -e ISAAC_SIM_HEADLESS=1 \
              -e ISAAC_SIM_LOW_MEMORY=1 \
              -e PYTHONUNBUFFERED=1 \
              -e PYTHONIOENCODING=utf-8 \
              -e ISAACLAB_TEST_DEVICES="$runtime_devices" \
              -e ISAACLAB_SIM_DEVICE="cuda:$cuda" \
              -e ISAACLAB_TEST_QUEUE=/mgpu/queue.txt \
              -e TEST_INCLUDE_FILES="$INCLUDE_FILES" \
              "$IMAGE_TAG" \
              -c '
                set +e
                cd /workspace/isaaclab
                unset HUB__ARGS__DETECT_ONLY
                # Install test-only deps that are NOT in the image build
                # (mirrors the hardcoded line in run-tests action.yml).
                # junitparser is imported at tools/conftest.py load time,
                # so it must be present before pytest fires.
                ./isaaclab.sh -p -m pip install pytest pytest-mock junitparser flatdict flaky "coverage>=7.6.1"
                ./isaaclab.sh -p -m pytest \
                  --ignore=tools/conftest.py \
                  --ignore=source/isaaclab/test/install_ci \
                  tools -v
              ' 2>&1 | tee "${logfiles[$cuda]}" | stdbuf -oL sed "s/^/[cuda:$cuda] /"
              # Propagate docker's exit (PIPESTATUS[0]), not sed's, so a
              # passing tail doesn't mask a failing shard.
              exit "${PIPESTATUS[0]}"
            ) &
            pids[$cuda]=$!
            echo "::notice::launched shard cuda:$cuda (pid ${pids[$cuda]}, idx=$idx, runtime_devices=$runtime_devices)"
          done

          # Wait for every shard before aggregating, so a fast failure
          # doesn't tear down still-running siblings.
          for cuda in "${!pids[@]}"; do
            wait "${pids[$cuda]}"
            results[$cuda]=$?
          done

          fail=0
          for cuda in $(echo "$CUDA_SHARDS" | jq -r '.[]'); do
            rc="${results[$cuda]}"
            echo "::group::shard cuda:$cuda — exit $rc"
            cat "${logfiles[$cuda]}"
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || fail=1
          done

          exit $fail
