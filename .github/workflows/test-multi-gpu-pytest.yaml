# Multi-GPU unit-test workflow
#
# Runs the non-default-GPU subset of unit tests across the multi-GPU runner
# pool's GPUs in parallel. Uses the same ECR-pulled isaac-lab image as the
# single-GPU CI; only diffs are the runner label and the env vars that pin
# Kit and the test parametrize to the shard's non-default GPU.
#
# Adding a new test to multi-GPU coverage: give its device parametrize a
# non-default-capable scope — argless ``isaaclab.test.utils.test_devices()``
# (cpu + cuda:0 + non-default GPUs) or any ``"..X"`` mask. The workflow
# auto-discovers it.

name: Multi-GPU pytest

on:
  pull_request:
    paths:
      - "source/isaaclab/isaaclab/test/utils/**"
      - "source/isaaclab/isaaclab/app/app_launcher.py"
      - "source/**/test/**/test_*.py"
      - ".github/workflows/test-multi-gpu-pytest.yaml"
      - ".github/actions/run-package-tests/**"
      - ".github/actions/run-tests/**"
      - ".github/actions/ecr-build-push-pull/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE_TAG: isaac-lab-ci:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

jobs:
  config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows/config.yaml
          sparse-checkout-cone-mode: false
      - id: load
        run: |
          set -euo pipefail
          f=.github/workflows/config.yaml
          echo "isaacsim_image_name=$(yq -r .isaacsim_image_name "$f")" >> "$GITHUB_OUTPUT"
          echo "isaacsim_image_tag=$(yq -r .isaacsim_image_tag "$f")" >> "$GITHUB_OUTPUT"

  build:
    name: Build / cache image + detect GPUs
    needs: [config]
    runs-on: [self-hosted, linux, x64, multi-gpu]
    outputs:
      # JSON array of cuda device indices to shard the test matrix across.
      # cuda:0 is omitted because single-GPU CI already covers it; we use
      # the non-default GPUs (cuda:1 .. cuda:N-1) for multi-GPU coverage.
      cuda_shards: ${{ steps.detect.outputs.shards }}
      # Length of cuda_shards, consumed as shard-count by tools/conftest.py.
      shard_count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Detect available GPUs
        # Query the actual runner instead of hard-coding ``[1, 2, 3]``.  If the
        # pool ever changes (4 → 2 GPUs, or 4 → 8 GPUs), the test matrix
        # follows automatically.  Fails fast here on a regressed pool so we
        # don't allocate test runners that will then fail.
        id: detect
        run: |
          N=$(nvidia-smi -L | wc -l)
          if [ "$N" -lt 2 ]; then
            echo "::error::Need at least 2 GPUs (cuda:0 + at least 1 non-default); found $N"
            exit 1
          fi
          shards=$(python3 -c "import json; print(json.dumps(list(range(1, $N))))")
          count=$((N - 1))
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "::notice::$N GPUs → shards=$shards (shard_count=$count)"

      # Pre-populates the ECR exact-commit tag from deps-cache (registry-side
      # alias). Without this prior step, run-package-tests' internal
      # ecr-build-push-pull hits exact-cache-miss + deps-cache-hit and leaves
      # no local image, causing `docker run` to fail with `pull access
      # denied`. Mirrors the build → test split in build.yaml.
      - uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base

  test-multi-gpu-pytest:
    name: Multi-GPU unit tests
    needs: [config, build]
    if: needs.build.result == 'success'
    runs-on: [self-hosted, linux, x64, multi-gpu]
    # DIAGNOSTIC: 45 min (target is 30). The first buffered parallel run hit
    # the 30-min wall without finishing or printing anything. Raised so a
    # slow-but-completing run yields real per-shard durations; tighten back
    # to 30 once the split is balanced and the contention picture is clear.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Discover opt-in test files
        # Auto-discovery: any test_*.py with a non-default-capable scope — an
        # argless ``test_devices()`` (defaults to "11X") or any
        # ``test_devices("..X")`` mask, whose trailing ``X`` spans the
        # non-default GPUs — is in scope.  Adding a test to multi-GPU CI needs
        # no workflow edit; opting a file out is just narrowing its scope (drop
        # the ``X``, e.g. "110"), so the workflow stays opt-in/opt-out-free.
        id: discover
        run: |
          # File-level opt-out: a test file can exclude itself from multi-GPU CI
          # by declaring a module-level ``MULTI_GPU_SKIP_REASON = "..."`` line.
          # Used for files with known Kit/Isaac-Sim concurrency issues; the file
          # still runs in single-GPU CI. Excluded files are reported as a notice
          # below for visibility. No workflow edit needed to add/remove a file.
          mapfile -t candidates < <(grep -rlE 'test_devices\(\)|test_devices\("[^"]*X"\)' source/ --include='test_*.py' | sort -u)
          discovered=()
          skipped=()
          for f in "${candidates[@]}"; do
            if grep -q '^MULTI_GPU_SKIP_REASON' "$f"; then
              skipped+=("$f")
            else
              discovered+=("$f")
            fi
          done
          for f in "${skipped[@]}"; do
            reason=$(grep -m1 '^MULTI_GPU_SKIP_REASON' "$f" | sed -E 's/^MULTI_GPU_SKIP_REASON[[:space:]]*=[[:space:]]*//; s/^"//; s/"$//')
            echo "::notice::multi-GPU skipped: $f — $reason"
          done
          if [ ${#discovered[@]} -eq 0 ]; then
            echo "::error::No opt-in tests discovered (grep for test_devices with an X scope)"
            exit 1
          fi
          basenames=$(printf '%s\n' "${discovered[@]}" | xargs -n1 basename | sort -u | paste -sd,)
          echo "include=$basenames" >> "$GITHUB_OUTPUT"
          # Full relative paths too, to seed the shared work queue (the run step
          # needs runnable paths, not just basenames).
          echo "paths=$(printf '%s,' "${discovered[@]}")" >> "$GITHUB_OUTPUT"
          echo "::notice::Discovered ${#discovered[@]} opt-in test files"
          printf '  %s\n' "${discovered[@]}"

      - name: Pull image from ECR
        # Pulls the per-commit image the build job pushed. ecr-build-push-pull
        # handles ECR auth via the EC2 IAM role, and on exact-cache-hit (which
        # the build job's deps-cache-hit registry-tag created for this SHA)
        # it pulls the image locally and tags it as ``$CI_IMAGE_TAG`` for our
        # parallel ``docker run`` block below.
        uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base

      - name: Run shards in parallel on local GPUs (1-docker N-shard)
        # ONE container hosts all N pytest shards as parallel subshells. Each
        # shard pins ISAACLAB_SIM_DEVICE / ISAACLAB_TEST_DEVICES to its own
        # non-default cuda:N and pulls files from the shared work queue. This
        # collapses the previous N-container layout into one container, removing
        # cross-container races on the shared workspace mount (``_isaac_sim``
        # symlink, ``/mgpu`` queue, ``/dev/dri`` cap-add) and ~30s of docker
        # init per shard, at the cost of sharing the container's /isaac-sim/
        # writable subtrees. Per-shard HOME (under /tmp) keeps user-level
        # caches isolated.
        #
        # Scaling: shard count is derived inside the container from
        # ``nvidia-smi -L`` (truth — torch.cuda.device_count() under-counts MIG
        # slices on the same parent GPU), so this works unchanged on any GPU
        # count or topology. ``CUDA_VISIBLE_DEVICES`` is set to the
        # comma-separated MIG-UUID list only on MIG-mode hosts; discrete-GPU
        # runners rely on ``--gpus all``.
        env:
          IMAGE_TAG: ${{ env.CI_IMAGE_TAG }}
          INCLUDE_FILES: ${{ steps.discover.outputs.include }}
          PATHS: ${{ steps.discover.outputs.paths }}
        run: |
          set +e
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          host_user="$(id -un)"

          # _isaac_sim symlink on the host — single creator now, no race.
          rm -f _isaac_sim && ln -s /isaac-sim _isaac_sim

          runtime_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/mgpu-runtime.XXXXXX")"
          mkdir -p "$runtime_dir"

          # Shared work queue inside one container — flock still serializes
          # claims across the in-container subshells exactly as it did across
          # sibling containers; the file lives on the same mount.
          queue_dir="$runtime_dir/queue"
          mkdir -p "$queue_dir"
          printf '%s\n' "$PATHS" | tr ',' '\n' | grep -v '^$' > "$queue_dir/queue.txt"
          echo "::notice::seeded work queue with $(wc -l < "$queue_dir/queue.txt") files"

          # Per-shard log dir mounted from the container so we can grouped-print
          # the per-shard stream after the run completes.
          logs_dir="$runtime_dir/logs"
          mkdir -p "$logs_dir"

          # MIG detection: only override CUDA_VISIBLE_DEVICES on MIG hosts.
          # nvidia-smi -L is authoritative — see memory rule
          # ``reference_gpu_enumeration``: torch.cuda.device_count() under-counts
          # MIG slices on the same parent GPU.
          cvd_args=()
          if nvidia-smi -L | grep -q "^  MIG "; then
            mapfile -t MIGS < <(nvidia-smi -L | awk -F'UUID: ' '/^  MIG /{print $2}' | tr -d ')')
            MIG_LIST=$(IFS=,; echo "${MIGS[*]}")
            cvd_args=(-e "CUDA_VISIBLE_DEVICES=${MIG_LIST}")
            echo "::notice::MIG mode: ${#MIGS[@]} slices — overriding CUDA_VISIBLE_DEVICES"
          else
            echo "::notice::discrete GPU mode — relying on --gpus all"
          fi

          # --cap-add=SYS_PTRACE for py-spy/gdb hang capture in conftest.
          docker run --rm --gpus all --network=host \
            --cap-add=SYS_PTRACE \
            --entrypoint bash \
            --user "${host_uid}:${host_gid}" \
            --name "isaac-lab-mgpu-${{ github.run_id }}-${{ github.run_attempt }}" \
            -v "$PWD:/workspace/isaaclab:rw" \
            -v "$queue_dir:/mgpu:rw" \
            -v "$logs_dir:/shard-logs:rw" \
            -e USER="${host_user}" \
            -e LOGNAME="${host_user}" \
            -e OMNI_KIT_ACCEPT_EULA=yes \
            -e ACCEPT_EULA=Y \
            -e OMNI_KIT_DISABLE_CUP=1 \
            -e ISAAC_SIM_HEADLESS=1 \
            -e ISAAC_SIM_LOW_MEMORY=1 \
            -e PYTHONUNBUFFERED=1 \
            -e PYTHONIOENCODING=utf-8 \
            -e ISAACLAB_TEST_QUEUE=/mgpu/queue.txt \
            -e TEST_INCLUDE_FILES="$INCLUDE_FILES" \
            -e ISAACLAB_PIN_KIT_GPU=1 \
            -e HOME=/tmp/mgpu-base-home \
            "${cvd_args[@]}" \
            "$IMAGE_TAG" \
            -c '
              set +e
              cd /workspace/isaaclab
              unset HUB__ARGS__DETECT_ONLY

              # Container-level HOME for the pre-fan-out pip install. The
              # image runs ``--user $host_uid:$host_gid`` with no matching
              # /etc/passwd entry, so HOME defaults to /root which the user
              # cannot write. /tmp/mgpu-base-home is on /tmp (1777 tmpfs)
              # and writable by any user. Per-shard subshells below override
              # HOME to their own /tmp/isaaclab-ci-home-N for test runs.
              mkdir -p /tmp/mgpu-base-home

              # Pytest deps (same as run-tests action). junitparser is imported
              # at tools/conftest.py load time, so it must be present first.
              ./isaaclab.sh -p -m pip install pytest pytest-mock junitparser flatdict flaky py-spy "coverage>=7.6.1"

              # Shard count from nvidia-smi -L (truth; torch under-counts MIG).
              MIG_COUNT=$(nvidia-smi -L | grep -c "^  MIG ")
              GPU_COUNT=$(nvidia-smi -L | grep -c "^GPU ")
              if [ "$MIG_COUNT" -gt 0 ]; then
                DEV_COUNT=$MIG_COUNT
                echo "::notice::container: MIG mode, $MIG_COUNT slices"
              else
                DEV_COUNT=$GPU_COUNT
                echo "::notice::container: discrete mode, $GPU_COUNT GPUs"
              fi
              if [ "$DEV_COUNT" -lt 2 ]; then
                echo "::error::Need at least 2 visible devices; found $DEV_COUNT"
                exit 1
              fi

              # Cross-check with torch and cap shard count to what torch can
              # actually address — guards against a CUDA_VISIBLE_DEVICES misconfig
              # silently fanning out shards that crash on device access.
              TORCH_COUNT=$(/isaac-sim/python.sh -c "import torch; print(torch.cuda.device_count())")
              echo "container: torch sees $TORCH_COUNT cuda devices (cross-check vs $DEV_COUNT)"
              if [ "$TORCH_COUNT" -lt "$DEV_COUNT" ]; then
                echo "::warning::torch sees fewer devices than nvidia-smi — capping shards to $TORCH_COUNT"
                DEV_COUNT=$TORCH_COUNT
              fi

              # Fan out 1 pytest subshell per non-default cuda:N. Each gets its
              # own HOME (per-shard isolation for .cache, .local/share, etc.)
              # and per-shard ISAACLAB_SIM_DEVICE / ISAACLAB_TEST_DEVICES.
              declare -A pids
              for ((cuda = 1; cuda < DEV_COUNT; cuda++)); do
                zeros=""
                for ((i = 0; i <= cuda; i++)); do zeros+="0"; done
                runtime_devices="${zeros}1"

                shard_home="/tmp/isaaclab-ci-home-${cuda}"
                mkdir -p "${shard_home}/.cache" "${shard_home}/.local/share" \
                         "${shard_home}/.nvidia-omniverse/config" \
                         "${shard_home}/.nvidia-omniverse/logs"

                shard_log="/shard-logs/cuda-${cuda}.log"

                (
                  export HOME="$shard_home"
                  export XDG_CACHE_HOME="${HOME}/.cache"
                  export XDG_DATA_HOME="${HOME}/.local/share"
                  export ISAACLAB_TEST_DEVICES="$runtime_devices"
                  export ISAACLAB_SIM_DEVICE="cuda:${cuda}"

                  ./isaaclab.sh -p -m pytest \
                    --ignore=tools/conftest.py \
                    --ignore=source/isaaclab/test/install_ci \
                    tools -v 2>&1 \
                    | tee "$shard_log" \
                    | stdbuf -oL sed "s/^/[cuda:${cuda}] /"

                  exit "${PIPESTATUS[0]}"
                ) &
                pids[$cuda]=$!
                echo "::notice::launched shard cuda:${cuda} (pid ${pids[$cuda]}, runtime_devices=$runtime_devices)"
              done

              # Wait for every shard before aggregating exits.
              declare -A results
              for cuda in "${!pids[@]}"; do
                wait "${pids[$cuda]}"
                results[$cuda]=$?
              done

              fail=0
              for cuda in "${!results[@]}"; do
                rc="${results[$cuda]}"
                echo "shard cuda:${cuda} exited $rc"
                [ "$rc" -eq 0 ] || fail=1
              done
              exit $fail
            '
          docker_rc=$?

          # Grouped re-print of per-shard logs (preserved across the host).
          for log in "$logs_dir"/cuda-*.log; do
            cuda=$(basename "$log" .log | sed s/cuda-//)
            echo "::group::shard cuda:${cuda} log"
            cat "$log"
            echo "::endgroup::"
          done

          exit "$docker_rc"
