# Multi-GPU unit-test workflow
#
# Runs the non-default-GPU subset of unit tests across the multi-GPU runner
# pool's GPUs in parallel. Uses the same ECR-pulled isaac-lab image as the
# single-GPU CI; only diffs are the runner label and the env vars that pin
# Kit and the test parametrize to the shard's non-default GPU.
#
# Adding a new test to multi-GPU coverage: give its device parametrize a
# non-default-capable scope — argless ``isaaclab.test.utils.test_devices()``
# (cpu + cuda:0 + non-default GPUs) or any ``"..X"`` mask. The workflow
# auto-discovers it.

name: Multi-GPU pytest

on:
  pull_request:
    paths:
      - "source/isaaclab/isaaclab/test/utils/**"
      - "source/isaaclab/isaaclab/app/app_launcher.py"
      - "source/**/test/**/test_*.py"
      - ".github/workflows/test-multi-gpu-pytest.yaml"
      - ".github/actions/run-package-tests/**"
      - ".github/actions/run-tests/**"
      - ".github/actions/ecr-build-push-pull/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE_TAG: isaac-lab-ci:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

jobs:
  config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows/config.yaml
          sparse-checkout-cone-mode: false
      - id: load
        run: |
          set -euo pipefail
          f=.github/workflows/config.yaml
          echo "isaacsim_image_name=$(yq -r .isaacsim_image_name "$f")" >> "$GITHUB_OUTPUT"
          echo "isaacsim_image_tag=$(yq -r .isaacsim_image_tag "$f")" >> "$GITHUB_OUTPUT"

  build:
    name: Build / cache image
    needs: [config]
    # Build only needs Docker + ECR access, not multi-GPU. Aligns with the
    # build jobs in build.yaml that also publish the per-commit image.
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      # Pre-populates the ECR exact-commit tag from deps-cache (registry-side
      # alias). Without this prior step, run-package-tests' internal
      # ecr-build-push-pull hits exact-cache-miss + deps-cache-hit and leaves
      # no local image, causing `docker run` to fail with `pull access
      # denied`. Mirrors the build → test split in build.yaml.
      - uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base

  test-multi-gpu-pytest:
    name: Multi-GPU unit tests
    needs: [config, build]
    if: needs.build.result == 'success'
    # Matches the runner label used by test-multi-gpu.yaml +
    # test-fabric-multi-gpu.yaml — the canonical multi-GPU pool.
    runs-on: [self-hosted, linux, x64, gpu, multi-gpu]
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Discover opt-in test files
        # Auto-discovery: any test_*.py with a non-default-capable scope — an
        # argless ``test_devices()`` (defaults to "11X") or any
        # ``test_devices("..X")`` mask, whose trailing ``X`` spans the
        # non-default GPUs — is in scope.  Adding a test to multi-GPU CI needs
        # no workflow edit; opting a file out is just narrowing its scope (drop
        # the ``X``, e.g. "110"), so the workflow stays opt-in/opt-out-free.
        #
        # Within a discovered file, tests that are NOT parametrized over the
        # ``device`` argument are filtered out at collection time by the
        # workspace-root ``conftest.py``: single-GPU CI already covers them on
        # ``cuda:0`` and re-running on every non-default shard adds wall-time
        # without surfacing any new failure mode.
        id: discover
        run: |
          # File-level opt-out: a test file can exclude itself from multi-GPU CI
          # by declaring a module-level ``MULTI_GPU_SKIP_REASON = "..."`` line.
          # Used for files with known Kit/Isaac-Sim concurrency issues; the file
          # still runs in single-GPU CI. Excluded files are reported as a notice
          # below for visibility. No workflow edit needed to add/remove a file.
          mapfile -t candidates < <(grep -rlE 'test_devices\(\)|test_devices\("[^"]*X"\)' source/ --include='test_*.py' | sort -u)
          discovered=()
          skipped=()
          for f in "${candidates[@]}"; do
            if grep -q '^MULTI_GPU_SKIP_REASON' "$f"; then
              skipped+=("$f")
            else
              discovered+=("$f")
            fi
          done
          for f in "${skipped[@]}"; do
            reason=$(grep -m1 '^MULTI_GPU_SKIP_REASON' "$f" | sed -E 's/^MULTI_GPU_SKIP_REASON[[:space:]]*=[[:space:]]*//; s/^"//; s/"$//')
            echo "::notice::multi-GPU skipped: $f — $reason"
          done
          if [ ${#discovered[@]} -eq 0 ]; then
            echo "::error::No opt-in tests discovered (grep for test_devices with an X scope)"
            exit 1
          fi
          basenames=$(printf '%s\n' "${discovered[@]}" | xargs -n1 basename | sort -u | paste -sd,)
          echo "include=$basenames" >> "$GITHUB_OUTPUT"
          # Full relative paths too, to seed the shared work queue (the run step
          # needs runnable paths, not just basenames).
          echo "paths=$(printf '%s,' "${discovered[@]}")" >> "$GITHUB_OUTPUT"
          echo "::notice::Discovered ${#discovered[@]} opt-in test files"
          printf '  %s\n' "${discovered[@]}"

      - name: Pull image from ECR
        # Pulls the per-commit image the build job pushed. ecr-build-push-pull
        # handles ECR auth via the EC2 IAM role, and on exact-cache-hit (which
        # the build job's deps-cache-hit registry-tag created for this SHA)
        # it pulls the image locally and tags it as ``$CI_IMAGE_TAG`` for our
        # parallel ``docker run`` block below.
        uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base

      - name: Run shards in parallel on local GPUs (1-docker N-shard)
        # ONE container hosts all N pytest shards as parallel subshells. Each
        # shard pins ISAACLAB_SIM_DEVICE / ISAACLAB_TEST_DEVICES to its own
        # non-default cuda:N and pulls files from the shared work queue. This
        # collapses the previous N-container layout into one container, removing
        # cross-container races on the shared workspace mount (``_isaac_sim``
        # symlink, ``/mgpu`` queue, ``/dev/dri`` cap-add) and ~30s of docker
        # init per shard, at the cost of sharing the container's /isaac-sim/
        # writable subtrees. Per-shard HOME (under /tmp) keeps user-level
        # caches isolated.
        #
        # Scaling: shard count is derived inside the container from
        # ``nvidia-smi -L`` (truth — torch.cuda.device_count() under-counts MIG
        # slices on the same parent GPU), so this works unchanged on any GPU
        # count or topology. ``CUDA_VISIBLE_DEVICES`` is set to the
        # comma-separated MIG-UUID list only on MIG-mode hosts; discrete-GPU
        # runners rely on ``--gpus all``.
        env:
          IMAGE_TAG: ${{ env.CI_IMAGE_TAG }}
          INCLUDE_FILES: ${{ steps.discover.outputs.include }}
          PATHS: ${{ steps.discover.outputs.paths }}
        run: |
          set +e
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          host_user="$(id -un)"
          # ``/isaac-sim`` is the Kit install root inside the container; pytest
          # invocations under ``./isaaclab.sh -p`` resolve the bundled Python as
          # ``./_isaac_sim/python.sh``. Mounting the workspace at
          # ``/workspace/isaaclab`` brings the host's CWD into the container,
          # so we plant a host-side symlink whose target resolves only inside
          # the container. Single creator (this step) — no concurrent creators.
          rm -f _isaac_sim && ln -s /isaac-sim _isaac_sim

          runtime_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/mgpu-runtime.XXXXXX")"
          mkdir -p "$runtime_dir"

          # Directory-based work queue (atomic os.rename pattern; conftest claims
          # entries via os.rename(queue/X, inflight/<shard>/X) — POSIX rename is
          # atomic on the same filesystem, so two shards racing on the same
          # entry are kernel-serialized: one wins, the other gets ENOENT and
          # moves on). Each pending test path is materialized as an empty file
          # in queue/ with '/' slugged to '__' so it's a flat filename.
          #
          # Subdirs:
          #   queue/<slug>             — pending claims
          #   inflight/<shard>/<slug>  — claimed by this shard, test in flight
          #   done/<shard>/<slug>      — test exited cleanly
          #
          # At job-end the reconciler step asserts queue/ + inflight/ are empty
          # — if either is non-empty the job FAILS (silent-drop signal: never
          # claimed OR claimed but crashed mid-test). See the reconciler step
          # near the end of this job for the exact assertion.
          queue_root="$runtime_dir/queue"
          mkdir -p "$queue_root/queue" "$queue_root/inflight" "$queue_root/done"
          IFS=',' read -ra _paths <<< "$PATHS"
          for path in "${_paths[@]}"; do
            [ -n "$path" ] || continue
            slug="${path//\//__}"
            : > "$queue_root/queue/$slug"
          done
          echo "::notice::seeded work queue with $(ls -1 "$queue_root/queue" | wc -l) entries"

          # Per-shard log dir mounted from the container so we can grouped-print
          # the per-shard stream after the run completes.
          logs_dir="$runtime_dir/logs"
          mkdir -p "$logs_dir"

          # MIG detection: only override CUDA_VISIBLE_DEVICES on MIG hosts.
          # nvidia-smi -L is authoritative — see memory rule
          # ``reference_gpu_enumeration``: torch.cuda.device_count() under-counts
          # MIG slices on the same parent GPU.
          cvd_args=()
          if nvidia-smi -L | grep -q "^  MIG "; then
            mapfile -t MIGS < <(nvidia-smi -L | awk -F'UUID: ' '/^  MIG /{print $2}' | tr -d ')')
            MIG_LIST=$(IFS=,; echo "${MIGS[*]}")
            cvd_args=(-e "CUDA_VISIBLE_DEVICES=${MIG_LIST}")
            echo "::notice::MIG mode: ${#MIGS[@]} slices — overriding CUDA_VISIBLE_DEVICES"
          else
            echo "::notice::discrete GPU mode — relying on --gpus all"
          fi

          # --cap-add=SYS_PTRACE for py-spy/gdb hang capture in conftest.
          docker run --rm --gpus all --network=host \
            --cap-add=SYS_PTRACE \
            --entrypoint bash \
            --user "${host_uid}:${host_gid}" \
            --name "isaac-lab-mgpu-${{ github.run_id }}-${{ github.run_attempt }}" \
            -v "$PWD:/workspace/isaaclab:rw" \
            -v "$queue_root:/mgpu:rw" \
            -v "$logs_dir:/shard-logs:rw" \
            -e USER="${host_user}" \
            -e LOGNAME="${host_user}" \
            -e OMNI_KIT_ACCEPT_EULA=yes \
            -e ACCEPT_EULA=Y \
            -e OMNI_KIT_DISABLE_CUP=1 \
            -e ISAAC_SIM_HEADLESS=1 \
            -e ISAAC_SIM_LOW_MEMORY=1 \
            -e PYTHONUNBUFFERED=1 \
            -e PYTHONIOENCODING=utf-8 \
            -e ISAACLAB_TEST_QUEUE=/mgpu \
            -e TEST_INCLUDE_FILES="$INCLUDE_FILES" \
            -e ISAACLAB_PIN_KIT_GPU=1 \
            -e HOME=/tmp/mgpu-base-home \
            -e PYTHONUSERBASE=/tmp/mgpu-pyuserbase \
            "${cvd_args[@]}" \
            -v "$PWD/.github/actions/multi-gpu/multi_gpu_shard_runner.sh:/multi_gpu_shard_runner.sh:ro" \
            "$IMAGE_TAG" \
            /multi_gpu_shard_runner.sh
          docker_rc=$?

          # Grouped re-print of per-shard logs (preserved across the host).
          for log in "$logs_dir"/cuda-*.log; do
            cuda=$(basename "$log" .log | sed s/cuda-//)
            echo "::group::shard cuda:${cuda} log"
            cat "$log"
            echo "::endgroup::"
          done

          # Reconciler — silent-drop guard. Anything left in queue/ was never
          # claimed by any shard (work-queue starvation). Anything still in
          # inflight/<shard>/ was claimed but never moved to done/ (shard
          # crashed mid-test). Either is a silent-drop signal that the docker
          # exit alone can't surface. Fail the job and name the orphans.
          echo "::group::work-queue reconciler"
          unclaimed=$(ls -1 "$queue_root/queue" 2>/dev/null | wc -l)
          if [ "$unclaimed" -gt 0 ]; then
            echo "::error::${unclaimed} test(s) never claimed by any shard:"
            ls -1 "$queue_root/queue" | sed 's|__|/|g; s/^/  /'
          fi
          orphans=0
          for shard_dir in "$queue_root/inflight"/*/; do
            [ -d "$shard_dir" ] || continue
            count=$(ls -1 "$shard_dir" 2>/dev/null | wc -l)
            if [ "$count" -gt 0 ]; then
              echo "::error::$(basename "$shard_dir") claimed but never finished ${count} test(s):"
              ls -1 "$shard_dir" | sed 's|__|/|g; s/^/  /'
              orphans=$((orphans + count))
            fi
          done
          done_total=$(find "$queue_root/done" -type f 2>/dev/null | wc -l)
          echo "::notice::reconciler: done=${done_total} unclaimed=${unclaimed} orphans=${orphans}"
          echo "::endgroup::"

          # Treat reconciler signals as fatal even if all shards exited 0.
          if [ "$unclaimed" -gt 0 ] || [ "$orphans" -gt 0 ]; then
            echo "::error::silent-drop detected — see reconciler group above"
            [ "$docker_rc" -eq 0 ] && docker_rc=2
          fi

          # Export the runtime directory so the downstream "Aggregated test
          # summary" step can locate the done/<shard>/<slug> work distribution
          # and the per-shard logs.
          echo "MGPU_RUNTIME_DIR=$runtime_dir" >> "$GITHUB_ENV"

          exit "$docker_rc"

      - name: Aggregated test summary
        # Runs whether or not the test job exit was clean — surfaces what
        # happened even on failure. Per-shard stats + per-file pass / total /
        # walltime, plus a single combined table. Also writes the same content
        # to $GITHUB_STEP_SUMMARY so it renders at the top of the run page.
        if: always()
        env:
          RUNTIME_DIR: ${{ env.MGPU_RUNTIME_DIR }}
        run: |
          python3 - <<'PY'
          import os, glob, xml.etree.ElementTree as ET, sys, pathlib

          runtime_dir = os.environ.get("RUNTIME_DIR", "")
          done_root = pathlib.Path(runtime_dir) / "queue" / "done" if runtime_dir else None

          # Map slug -> shard from done/<shard>/<slug>; slug uses "__" for "/".
          slug_to_shard = {}
          if done_root and done_root.is_dir():
              for shard_dir in done_root.iterdir():
                  if not shard_dir.is_dir():
                      continue
                  shard = shard_dir.name  # e.g. "cuda-1"
                  for entry in shard_dir.iterdir():
                      slug_to_shard[entry.name] = shard

          def unslug(name: str) -> str:
              # report file pattern: test-reports-<slug>.xml
              if name.startswith("test-reports-"):
                  name = name[len("test-reports-"):]
              if name.endswith(".xml"):
                  name = name[:-4]
              return name  # this is the slug; the file path is slug.replace("__", "/")

          # Per-file rows from JUnit XMLs.
          rows = []
          for path in sorted(glob.glob("tests/test-reports-*.xml")):
              slug = unslug(os.path.basename(path))
              file_path = slug.replace("__", "/")
              shard = slug_to_shard.get(slug, "?")
              try:
                  tree = ET.parse(path)
                  root = tree.getroot()
              except ET.ParseError:
                  rows.append((file_path, shard, "PARSE-ERROR", 0, 0, 0, 0, 0.0))
                  continue
              tests = failures = errors = skipped = 0
              total_time = 0.0
              for ts in root.iter("testsuite"):
                  tests += int(ts.get("tests", 0))
                  failures += int(ts.get("failures", 0))
                  errors += int(ts.get("errors", 0))
                  skipped += int(ts.get("skipped", 0))
                  total_time += float(ts.get("time", 0) or 0)
              passed = tests - failures - errors - skipped
              status = "PASS"
              if failures + errors > 0:
                  status = "FAIL"
              elif tests == 0:
                  status = "EMPTY"
              rows.append((file_path, shard, status, passed, tests, skipped,
                           failures + errors, total_time))

          # Per-shard aggregate.
          shards = {}
          for fp, sh, st, p, t, sk, f, tm in rows:
              if sh not in shards:
                  shards[sh] = {"files": 0, "passed": 0, "tests": 0, "skipped": 0,
                                "failed": 0, "time": 0.0}
              s = shards[sh]
              s["files"] += 1
              s["passed"] += p
              s["tests"] += t
              s["skipped"] += sk
              s["failed"] += f
              s["time"] += tm

          # ---------- Output: plain text to stdout ----------
          def fmt_row(cols, widths):
              return " | ".join(c.ljust(w) for c, w in zip(cols, widths))

          out = []
          out.append("PER-FILE RESULTS")
          out.append("=" * 110)
          hdr = ["File", "Shard", "Status", "Pass/Total", "Skip", "Fail", "Time(s)"]
          widths = [60, 7, 8, 12, 5, 5, 8]
          out.append(fmt_row(hdr, widths))
          out.append("-" * 110)
          for fp, sh, st, p, t, sk, f, tm in sorted(rows, key=lambda r: (r[1], r[0])):
              out.append(fmt_row([fp[-60:], sh, st, f"{p}/{t}", str(sk), str(f), f"{tm:.1f}"], widths))
          out.append("")
          out.append("PER-SHARD AGGREGATE")
          out.append("=" * 80)
          shard_hdr = ["Shard", "Files", "Pass/Total", "Skipped", "Failed", "Test time (s)"]
          shard_widths = [10, 7, 12, 9, 8, 14]
          out.append(fmt_row(shard_hdr, shard_widths))
          out.append("-" * 80)
          grand = {"files": 0, "passed": 0, "tests": 0, "skipped": 0, "failed": 0, "time": 0.0}
          for sh in sorted(shards):
              s = shards[sh]
              for k in grand: grand[k] += s[k]
              out.append(fmt_row(
                  [sh, str(s["files"]), f"{s['passed']}/{s['tests']}", str(s["skipped"]),
                   str(s["failed"]), f"{s['time']:.1f}"], shard_widths))
          out.append("-" * 80)
          out.append(fmt_row(
              ["TOTAL", str(grand["files"]), f"{grand['passed']}/{grand['tests']}",
               str(grand["skipped"]), str(grand["failed"]), f"{grand['time']:.1f}"],
              shard_widths))
          print("\n".join(out))

          # ---------- Output: markdown to $GITHUB_STEP_SUMMARY ----------
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              md = ["## Multi-GPU CI: Aggregated Test Summary", "",
                    "### Per-shard totals", "",
                    "| Shard | Files | Pass/Total | Skipped | Failed | Test time (s) |",
                    "|---|---:|---:|---:|---:|---:|"]
              for sh in sorted(shards):
                  s = shards[sh]
                  md.append(f"| `{sh}` | {s['files']} | {s['passed']}/{s['tests']} | {s['skipped']} | {s['failed']} | {s['time']:.1f} |")
              md.append(f"| **TOTAL** | **{grand['files']}** | **{grand['passed']}/{grand['tests']}** | **{grand['skipped']}** | **{grand['failed']}** | **{grand['time']:.1f}** |")
              md.append("")
              md.append("### Per-file results")
              md.append("")
              md.append("| File | Shard | Status | Pass/Total | Skipped | Failed | Test time (s) |")
              md.append("|---|---|---|---:|---:|---:|---:|")
              for fp, sh, st, p, t, sk, f, tm in sorted(rows, key=lambda r: (r[1], r[0])):
                  status_md = {"PASS": ":white_check_mark: PASS",
                               "FAIL": ":x: FAIL",
                               "EMPTY": ":white_circle: EMPTY",
                               "PARSE-ERROR": ":warning: PARSE-ERROR"}.get(st, st)
                  md.append(f"| `{fp}` | `{sh}` | {status_md} | {p}/{t} | {sk} | {f} | {tm:.1f} |")
              md.append("")
              with open(summary_path, "a") as fh:
                  fh.write("\n".join(md) + "\n")
          PY
