# Multi-GPU unit-test workflow
#
# Runs the cuda:1-parameterized subset of unit tests on the multi-GPU
# runner pool. Uses the same ECR-pulled isaac-lab image as the single-GPU
# CI; only diffs are the runner label, the env vars that pin Kit and the
# test parametrize to cuda:1, and the include-files list of opt-in tests.
#
# Adding a new test to multi-GPU coverage: migrate its device parametrize
# to call ``isaaclab.test.utils.cuda_test_devices()`` and add the file's
# basename to ``include-files`` below.

name: Multi-GPU pytest

on:
  pull_request:
    paths:
      - "source/isaaclab/isaaclab/test/utils/**"
      - "source/isaaclab/isaaclab/app/app_launcher.py"
      - "source/**/test/**/test_*.py"
      - ".github/workflows/test-multi-gpu-pytest.yaml"
      - ".github/actions/run-package-tests/**"
      - ".github/actions/run-tests/**"
      - ".github/actions/ecr-build-push-pull/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE_TAG: isaac-lab-ci:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.sha }}

jobs:
  config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/workflows/config.yaml
          sparse-checkout-cone-mode: false
      - id: load
        run: |
          set -euo pipefail
          f=.github/workflows/config.yaml
          echo "isaacsim_image_name=$(yq -r .isaacsim_image_name "$f")" >> "$GITHUB_OUTPUT"
          echo "isaacsim_image_tag=$(yq -r .isaacsim_image_tag "$f")" >> "$GITHUB_OUTPUT"

  build:
    name: Build / cache image
    needs: [config]
    runs-on: [self-hosted, linux, x64, multi-gpu]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true
      # Pre-populates the ECR exact-commit tag from deps-cache (registry-side
      # alias). Without this prior step, run-package-tests' internal
      # ecr-build-push-pull hits exact-cache-miss + deps-cache-hit and leaves
      # no local image, causing `docker run` to fail with `pull access
      # denied`. Mirrors the build → test split in build.yaml.
      - uses: ./.github/actions/ecr-build-push-pull
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          dockerfile-path: docker/Dockerfile.base
          cache-tag: cache-base

  test-multi-gpu-pytest:
    name: Multi-GPU unit tests
    needs: [config, build]
    if: needs.build.result == 'success'
    runs-on: [self-hosted, linux, x64, multi-gpu]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1
          lfs: true

      - name: Verify multi-GPU availability
        run: |
          GPU_COUNT=$(nvidia-smi -L | wc -l)
          echo "Detected $GPU_COUNT GPU(s)"
          if [ "$GPU_COUNT" -lt 2 ]; then
            echo "::error::At least 2 GPUs required for multi-GPU pytest, found $GPU_COUNT"
            exit 1
          fi

      - name: Discover opt-in test files
        # Auto-discovery: any test_*.py that calls ``cuda_test_devices`` is
        # in scope.  Adding a new test to multi-GPU CI requires no workflow
        # edit — migrate the file to use the helper and the next run picks
        # it up.  Per-device skips (e.g. cuda:1 is known broken for a file)
        # are declared inside the file via ``cuda_test_devices(skip={...})``
        # so the workflow stays opt-in/opt-out-free.
        id: discover
        run: |
          mapfile -t discovered < <(grep -rl 'cuda_test_devices' source/ --include='test_*.py' | sort -u)
          if [ ${#discovered[@]} -eq 0 ]; then
            echo "::error::No opt-in tests discovered (grep for cuda_test_devices)"
            exit 1
          fi
          basenames=$(printf '%s\n' "${discovered[@]}" | xargs -n1 basename | sort -u | paste -sd,)
          echo "include=$basenames" >> "$GITHUB_OUTPUT"
          echo "::notice::Discovered ${#discovered[@]} opt-in test files"
          printf '  %s\n' "${discovered[@]}"

      - uses: ./.github/actions/run-package-tests
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        with:
          image-tag: ${{ env.CI_IMAGE_TAG }}
          isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
          isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
          container-name: isaac-lab-multi-gpu-pytest
          # Auto-discovered from the ``Discover opt-in test files`` step:
          # every test that calls ``cuda_test_devices()`` is in scope.
          # No workflow edit needed when a new test opts in.
          include-files: ${{ steps.discover.outputs.include }}
          # ISAACLAB_TEST_DEVICES drives the parametrize helper at
          # collection time; ISAACLAB_SIM_DEVICE makes AppLauncher boot
          # Kit with active_gpu=1, so PhysX and Warp pin to cuda:1 from
          # process start.
          extra-env-vars: |
            ISAACLAB_TEST_DEVICES=001
            ISAACLAB_SIM_DEVICE=cuda:1
