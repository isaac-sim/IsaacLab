# Builds the kitless Newton training image (docker/Dockerfile.newton) and runs
# the canonical cartpole training smoke inside it. This is an install/build
# test of the shipped container artifact: library code is covered by the
# build.yaml test matrix, and the documented native install paths are covered
# by the Installation Tests workflow.

name: Newton Docker Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_newton_tests: ${{ steps.detect.outputs.run_newton_tests }}
    steps:
    - id: detect
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # This job is an install/build test, so it gates only on the install
        # inputs — the same set that feeds the deps-hash in the
        # ecr-build-push-pull action — plus its own wiring. Source-level
        # kitless regressions are accepted to surface on the next
        # install-input change rather than on every source PR.
        #
        # The build job skips via `if:` and reports green to branch
        # protection, which is why there is no workflow-level `paths:` filter
        # (a not-triggered required check would block the PR forever).
        patterns=(
          $'^docker/Dockerfile\\.newton$\tNewton image definition'
          $'^isaaclab\\.sh$\tInstall CLI wrapper'
          $'^pyproject\\.toml$\tRoot dependency manifest'
          $'^source/[^/]+/pyproject\\.toml$\tPackage manifests'
          $'^source/isaaclab/isaaclab/cli/\tInstall CLI implementation'
          $'^\\.github/workflows/newton-docker\\.yml$\tThis workflow file'
          $'^\\.github/actions/ecr-build-push-pull/\tECR build-cache action'
        )

        render_table() {
          local files="$1" entry regex desc count sample shown
          echo "| Pattern | What it covers | Matched files |"
          echo "|---|---|---|"
          for entry in "${patterns[@]}"; do
            IFS=$'\t' read -r regex desc <<< "$entry"
            # escape | so it doesn't end the markdown table cell mid-regex
            shown="${regex//|/\\|}"
            count=$(grep -cE "$regex" <<< "$files" || true)
            if [ "$count" -gt 0 ]; then
              sample=$(grep -m 3 -E "$regex" <<< "$files" | paste -sd ', ' -)
              [ "$count" -gt 3 ] && sample="$sample (and $((count - 3)) more)"
              echo "| \`$shown\` | $desc | $sample |"
            else
              echo "| \`$shown\` | $desc | - |"
            fi
          done
        }

        any_match() {
          local files="$1" entry regex
          for entry in "${patterns[@]}"; do
            IFS=$'\t' read -r regex _ <<< "$entry"
            if grep -qE "$regex" <<< "$files"; then
              return 0
            fi
          done
          return 1
        }

        decide() {
          local decision="$1" reason="$2" files="${3:-}"
          echo "Decision: run_newton_tests=$decision ($reason)"
          echo "run_newton_tests=$decision" >> "$GITHUB_OUTPUT"
          {
            echo "## Newton docker gating"
            echo ""
            if [ "$decision" = "true" ]; then
              echo "The Newton docker build and smoke will **run**: $reason."
            else
              echo "The Newton docker build and smoke will be **skipped**: $reason."
            fi
            if [ -n "$files" ]; then
              echo ""
              render_table "$files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        }

        if [ "$EVENT_NAME" != "pull_request" ]; then
          decide true "non-PR event ($EVENT_NAME)"
          exit 0
        fi

        if ! changed_files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
          # Fail-safe: a transient API error must not block merge. Default to running.
          echo "::warning::Could not list changed files; defaulting to running tests"
          decide true "fail-safe (could not list changed files)"
          exit 0
        fi

        printf '%s\n' "$changed_files"

        if any_match "$changed_files"; then
          decide true "relevant paths changed" "$changed_files"
        else
          decide false "no relevant paths changed" "$changed_files"
        fi

  build-newton:
    name: Build Newton Kitless Docker Image
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    needs: [changes]
    if: needs.changes.outputs.run_newton_tests == 'true'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true

    # Mirrors the per-commit tag scheme of build.yaml's config job so the
    # ECR tags stay in the same family as the other CI images.
    - name: Compute image tag
      id: tag
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "pull_request" ]; then
          ref_component="pr-${PR_NUMBER}"
        else
          ref_component="$REF_NAME"
        fi
        # Sanitize the ref name for use as a Docker tag suffix.
        sanitized_ref=$(echo "$ref_component" | sed 's/[^a-zA-Z0-9._-]/-/g')
        echo "image_tag=isaac-lab-ci:${sanitized_ref}-${SHA}-newton" >> "$GITHUB_OUTPUT"
        echo "CI image tag: isaac-lab-ci:${sanitized_ref}-${SHA}-newton"

    # Same ECR-cached setup as the build.yaml image builds: an existing
    # per-commit or deps-<hash> tag in ECR skips the build entirely, and full
    # builds reuse the registry layer cache. Dockerfile.newton builds from the
    # public ubuntu:24.04 image, so the (historically named)
    # isaacsim-base-image / isaacsim-version inputs only pin the base image
    # whose digest feeds the deps hash; the ISAACSIM_* build-args the action
    # passes are not declared by this Dockerfile and are ignored. The kitless
    # guarantee stays asserted inside the Dockerfile itself (no isaacsim
    # distribution, no _isaac_sim link), so any path that produces the image
    # has already proven it.
    - name: Build and push to ECR
      uses: ./.github/actions/ecr-build-push-pull
      with:
        image-tag: ${{ steps.tag.outputs.image_tag }}
        isaacsim-base-image: ubuntu
        isaacsim-version: "24.04"
        dockerfile-path: docker/Dockerfile.newton
        cache-tag: cache-newton
        # The smoke below docker-runs the image in this same job, and the
        # ECR login only exists while the action runs, so the action itself
        # must pull on a deps-cache hit.
        pull-on-deps-hit: "true"

    # Every action path (full build --load, exact-tag pull, deps-hit pull)
    # leaves the image local; fail fast with a clear message if not, instead
    # of letting docker run attempt a docker.io pull of the CI-only tag.
    - name: Ensure image is available locally
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
        if ! docker image inspect "${IMAGE_TAG}" >/dev/null 2>&1; then
          echo "::error::Image ${IMAGE_TAG} is not available locally after the build action."
          exit 1
        fi

    # Mirrors the verification command documented in
    # docs/source/deployment/docker.rst and the canonical cartpole training
    # probe used by the installation tests. source/, scripts/ and apps/ are
    # mounted from the checkout so a deps-cached image still runs this PR's
    # code: the isaaclab packages are installed editable from source/, so the
    # baked venv resolves imports through the mounted tree.
    - name: Run training smoke test
      shell: bash
      run: |
        set -euo pipefail
        log="$(mktemp)"
        docker run --rm --gpus all --network host \
          -v "$PWD/source":/workspace/isaaclab/source \
          -v "$PWD/scripts":/workspace/isaaclab/scripts \
          -v "$PWD/apps":/workspace/isaaclab/apps \
          "${{ steps.tag.outputs.image_tag }}" \
          isaaclab train --rl_library rsl_rl \
          --task Isaac-Cartpole-Direct \
          --num_envs 16 \
          presets=newton_mjwarp \
          --max_iterations 5 2>&1 | tee "$log"
        if grep -q "Traceback (most recent call last):" "$log"; then
          echo "::error::Training smoke test raised a traceback."
          exit 1
        fi
        if ! grep -q "Training time:" "$log"; then
          echo "::error::Training smoke test did not report 'Training time:'."
          exit 1
        fi

    - name: Verify Newton runtime user is non-root
      shell: bash
      run: |
        set -euo pipefail
        runtime_identity="$(docker run --rm --entrypoint bash "${{ steps.tag.outputs.image_tag }}" \
          -lc 'printf "%s %s %s\n" "$(id -u)" "$(id -g)" "$(id -un 2>/dev/null || true)"')"
        read -r runtime_uid runtime_gid runtime_user <<< "${runtime_identity}"
        echo "Newton runtime identity: uid=${runtime_uid} gid=${runtime_gid} user=${runtime_user}"
        if [ "${runtime_uid}" = "0" ]; then
          echo "::error::Newton Docker image must not run as root by default."
          exit 1
        fi

    # Keep the self-hosted runner's disk lean: drop the local tags after the
    # run; the layers stay cached in ECR for the next build.
    - name: Remove local image
      if: always()
      shell: bash
      run: |
        docker image rm -f "${{ steps.tag.outputs.image_tag }}" || true
        if [ -n "${ECR_IMAGE:-}" ]; then
          docker image rm -f "${ECR_IMAGE}" || true
        fi
