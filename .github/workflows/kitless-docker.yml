# Builds and validates the kit-less training image
# (docker/Dockerfile.kitless). This is an install/build test of the shipped
# container artifact: broader library coverage remains in the build.yaml test
# matrix, and documented native install paths remain in Installation Tests.

name: Kit-less Docker Image

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_kitless_tests: ${{ steps.detect.outputs.run_kitless_tests }}
    steps:
    - id: detect
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # This job is an install/build test, so it gates on the install inputs
        # that feed the deps hash, its own wiring, and the existing kit-less
        # pytest subset exercised inside the resulting image.
        #
        # The build job skips via `if:` and reports green to branch
        # protection, which is why there is no workflow-level `paths:` filter
        # (a not-triggered required check would block the PR forever).
        patterns=(
          $'^\\.dockerignore$\tDocker build context definition'
          $'^docker/Dockerfile\\.kitless$\tKit-less image definition'
          $'^docker/\\.env\\.kitless$\tKit-less Compose environment'
          $'^docker/container\\.py$\tContainer CLI'
          $'^docker/docker-compose\\.yaml$\tKit-less Compose definition'
          $'^docker/test/test_container_profiles\\.py$\tKit-less profile tests'
          $'^docker/test/test_dockerfile_nonroot\\.py$\tDockerfile contract tests'
          $'^docker/utils/container_interface\\.py$\tContainer profile implementation'
          $'^docker/utils/volume_mounts\\.py$\tContainer volume helper'
          $'^isaaclab\\.sh$\tInstall CLI wrapper'
          $'^pyproject\\.toml$\tRoot dependency manifest'
          $'^uv\\.lock$\tLocked dependency graph'
          $'^source/[^/]+/pyproject\\.toml$\tPackage manifests'
          $'^source/isaaclab/isaaclab/cli/\tInstall CLI implementation'
          $'^source/isaaclab_newton/isaaclab_newton/test/mock_interfaces/\tMock-interface implementation'
          $'^source/isaaclab_newton/test/test_mock_interfaces/\tKit-less pytest subset'
          $'^\\.github/workflows/kitless-docker\\.yml$\tThis workflow file'
          $'^\\.github/actions/_lib/compute-deps-hash/\tDependency-cache identity'
          $'^\\.github/actions/docker-build/\tDocker build action'
          $'^\\.github/actions/ecr-build-push-pull/\tECR build-cache action'
          $'^\\.github/actions/validate-kitless-image/\tKit-less image validation action'
        )

        render_table() {
          local files="$1" entry regex desc count sample shown
          echo "| Pattern | What it covers | Matched files |"
          echo "|---|---|---|"
          for entry in "${patterns[@]}"; do
            IFS=$'\t' read -r regex desc <<< "$entry"
            # escape | so it doesn't end the markdown table cell mid-regex
            shown="${regex//|/\\|}"
            count=$(grep -cE "$regex" <<< "$files" || true)
            if [ "$count" -gt 0 ]; then
              sample=$(grep -m 3 -E "$regex" <<< "$files" | paste -sd ', ' -)
              [ "$count" -gt 3 ] && sample="$sample (and $((count - 3)) more)"
              echo "| \`$shown\` | $desc | $sample |"
            else
              echo "| \`$shown\` | $desc | - |"
            fi
          done
        }

        any_match() {
          local files="$1" entry regex
          for entry in "${patterns[@]}"; do
            IFS=$'\t' read -r regex _ <<< "$entry"
            if grep -qE "$regex" <<< "$files"; then
              return 0
            fi
          done
          return 1
        }

        decide() {
          local decision="$1" reason="$2" files="${3:-}"
          echo "Decision: run_kitless_tests=$decision ($reason)"
          echo "run_kitless_tests=$decision" >> "$GITHUB_OUTPUT"
          {
            echo "## Kit-less Docker gating"
            echo ""
            if [ "$decision" = "true" ]; then
              echo "The kit-less image build and validation will **run**: $reason."
            else
              echo "The kit-less image build and validation will be **skipped**: $reason."
            fi
            if [ -n "$files" ]; then
              echo ""
              render_table "$files"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        }

        if [ "$EVENT_NAME" != "pull_request" ]; then
          decide true "non-PR event ($EVENT_NAME)"
          exit 0
        fi

        if ! changed_files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
          # Fail-safe: a transient API error must not block merge. Default to running.
          echo "::warning::Could not list changed files; defaulting to running tests"
          decide true "fail-safe (could not list changed files)"
          exit 0
        fi

        printf '%s\n' "$changed_files"

        if any_match "$changed_files"; then
          decide true "relevant paths changed" "$changed_files"
        else
          decide false "no relevant paths changed" "$changed_files"
        fi

    - name: Checkout Code
      if: steps.detect.outputs.run_kitless_tests == 'true'
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Set up uv
      if: steps.detect.outputs.run_kitless_tests == 'true'
      uses: astral-sh/setup-uv@v6

    - name: Validate kit-less container profile
      if: steps.detect.outputs.run_kitless_tests == 'true'
      shell: bash
      run: |
        set -euo pipefail
        uv run --no-project --with pytest --with pyyaml \
          python -m pytest -q \
          docker/test/test_container_profiles.py \
          docker/test/test_dockerfile_nonroot.py
        (
          cd docker
          docker compose \
            --file docker-compose.yaml \
            --profile kitless \
            --env-file .env.kitless \
            config --quiet
        )

  build-kitless:
    name: Build Kit-less Docker Image
    runs-on: [self-hosted, gpu]
    timeout-minutes: 120
    needs: [changes]
    if: needs.changes.outputs.run_kitless_tests == 'true'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true

    # Mirrors the per-commit tag scheme of build.yaml's config job so the
    # ECR tags stay in the same family as the other CI images.
    - name: Compute image tag
      id: tag
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "pull_request" ]; then
          ref_component="pr-${PR_NUMBER}"
        else
          ref_component="$REF_NAME"
        fi
        # Sanitize the ref name for use as a Docker tag suffix.
        sanitized_ref=$(echo "$ref_component" | sed 's/[^a-zA-Z0-9._-]/-/g')
        echo "image_tag=isaac-lab-ci:${sanitized_ref}-${SHA}-kitless" >> "$GITHUB_OUTPUT"
        echo "CI image tag: isaac-lab-ci:${sanitized_ref}-${SHA}-kitless"

    # Same ECR-cached setup as the build.yaml image builds: an existing
    # per-commit or deps-<hash> tag in ECR skips the build entirely, and full
    # builds reuse the registry layer cache. Dockerfile.kitless builds from the
    # public ubuntu:24.04 image, so the (historically named)
    # isaacsim-base-image / isaacsim-version inputs only pin the base image
    # whose digest feeds the deps hash; the ISAACSIM_* build-args the action
    # passes are not declared by this Dockerfile and are ignored. The kit-less
    # guarantee stays asserted inside the Dockerfile itself (no isaacsim
    # distribution, no _isaac_sim link), so any path that produces the image
    # has already proven it.
    - name: Build and push to ECR
      uses: ./.github/actions/ecr-build-push-pull
      with:
        image-tag: ${{ steps.tag.outputs.image_tag }}
        isaacsim-base-image: ubuntu
        isaacsim-version: "24.04"
        dockerfile-path: docker/Dockerfile.kitless
        cache-tag: cache-kitless
        # Validation below docker-runs the image in this same job, and the
        # ECR login only exists while the action runs, so the action itself
        # must pull on a deps-cache hit.
        pull-on-deps-hit: "true"

    # Every action path (full build --load, exact-tag pull, deps-hit pull)
    # leaves the image local; fail fast with a clear message if not, instead
    # of letting docker run attempt a docker.io pull of the CI-only tag.
    - name: Ensure image is available locally
      shell: bash
      run: |
        set -euo pipefail
        IMAGE_TAG="${{ steps.tag.outputs.image_tag }}"
        if ! docker image inspect "${IMAGE_TAG}" >/dev/null 2>&1; then
          echo "::error::Image ${IMAGE_TAG} is not available locally after the build action."
          exit 1
        fi

    # A deps-cached image contains the dependency graph but not necessarily this
    # PR's source. Read-only mounts make validation exercise the current checkout
    # while keeping the cached runtime layer intact.
    - name: Validate kit-less image
      uses: ./.github/actions/validate-kitless-image
      with:
        image-tag: ${{ steps.tag.outputs.image_tag }}
        mount-source: "true"

    # Keep the self-hosted runner's disk lean: drop the local tags after the
    # run; the layers stay cached in ECR for the next build.
    - name: Remove local image
      if: always()
      shell: bash
      run: |
        docker image rm -f "${{ steps.tag.outputs.image_tag }}" || true
        if [ -n "${ECR_IMAGE:-}" ]; then
          docker image rm -f "${ECR_IMAGE}" || true
        fi
