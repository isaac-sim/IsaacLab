name: Apply issue 5242 patch

on:
  push:
    branches:
      - fix/set-camera-view-sequence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/set-camera-view-sequence
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("source/isaaclab/isaaclab/sim/simulation_context.py")
          text = path.read_text()

          old_import = "from collections.abc import Callable, Iterator"
          new_import = "from collections.abc import Callable, Iterator, Sequence"
          if text.count(old_import) != 1:
              raise RuntimeError("Unexpected collections.abc import shape")
          text = text.replace(old_import, new_import, 1)

          old_method = '''    def set_camera_view(self, eye: tuple, target: tuple) -> None:\n        \"\"\"Set camera view on all visualizers that support it.\"\"\"\n'''
          new_method = '''    def set_camera_view(self, eye: Sequence[float], target: Sequence[float]) -> None:\n        \"\"\"Set camera view on all visualizers that support it.\n\n        Args:\n            eye: Camera eye position as a three-element sequence.\n            target: Camera target position as a three-element sequence.\n        \"\"\"\n'''
          if text.count(old_method) != 1:
              raise RuntimeError("Unexpected set_camera_view implementation shape")
          text = text.replace(old_method, new_method, 1)
          path.write_text(text)

          changelog = Path("source/isaaclab/changelog.d/sylvesterkaczmarek-set-camera-view-sequence.patch.rst")
          changelog.write_text(
              "Fixed\n^^^^^\n\n"
              "* Relaxed :meth:`isaaclab.sim.SimulationContext.set_camera_view` type hints to accept any float sequence, "
              "matching existing list-based call sites.\n"
          )
          PY
          git rm .github/workflows/apply-5242.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/isaaclab/isaaclab/sim/simulation_context.py source/isaaclab/changelog.d/sylvesterkaczmarek-set-camera-view-sequence.patch.rst
          git commit -m "Fix set_camera_view sequence type hints"
          git push origin HEAD:fix/set-camera-view-sequence
