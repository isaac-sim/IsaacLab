# Nightly auto-compile: rolls accumulated fragments under
# ``source/<pkg>/changelog.d/`` into per-package ``CHANGELOG.rst`` entries,
# bumps each package's version metadata, syncs ``uv.lock``, deletes consumed
# fragments, and pushes the result back to each branch in the configured
# list. Keeps every tracked branch's changelog current without requiring a
# maintainer to run ``compile`` by hand.
#
# The lifecycle lives in ``tools/changelog/cli.py auto-bump`` on each target
# branch, not here. This file owns only what is genuinely the workflow's:
# the schedule, the branch list, the checkout, and the App token.
#
# Scheduled workflow — must live on the repository's default branch for the
# cron to register. See ``.github/workflows/README.md``.
#
# Scheduled runs combine ``env.CRON_BRANCHES`` with every remote
# ``release/*`` branch that carries ``tools/changelog/cli.py``. This picks up
# new compiler-enabled release branches automatically while leaving historical
# branches that predate the fragment system untouched.
#
# The push uses a short-lived GitHub App installation token minted from
# ``CHANGELOG_APP_ID`` + ``CHANGELOG_APP_PRIVATE_KEY`` (repo secrets). The
# App must be installed on this repository with ``contents: write`` and
# added to the bypass-actor list of each target branch's ruleset so the
# auto-commit can push directly without satisfying required-checks /
# required-approval gates.
# Commits signed by an App token (unlike ``GITHUB_TOKEN``) are treated as
# external pushes, so they DO trigger downstream workflow runs (Docker
# rebuild, docs, etc.) without needing a separate PAT.

name: Nightly Changelog Compilation

# Static branches the nightly cron compiles. The resolver also discovers every
# remote ``release/*`` branch that carries ``tools/changelog/cli.py``. Every
# resolved branch must allow the isaaclab-bot App to bypass its ruleset.
env:
  CRON_BRANCHES: develop

on:
  schedule:
    # Run nightly at 5 AM UTC.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      branch:
        # Manual trigger is always a single branch. Free-text on purpose
        # — scales to any branch (e.g. a new ``release/*`` cut from
        # develop) without needing to update the workflow. A branch
        # that lacks ``tools/changelog/cli.py`` fails the verify step
        # below with a clear error, which is the desired failure mode.
        description: 'Branch to compile (e.g. develop, release/3.0.0). Must carry tools/changelog/cli.py.'
        required: true
        type: string
      dry_run:
        description: 'Preview only — do not commit / push'
        required: false
        type: boolean
        default: false

permissions:
  # Reduced: the App installation token below carries its own write scope.
  # GITHUB_TOKEN only needs read access for the standard checkout machinery.
  contents: read

jobs:
  resolve-branches:
    # Static/manual branches plus supported ``release/*`` refs → JSON array.
    # ``workflow_dispatch`` remains exactly one explicitly requested branch.
    name: Resolve branch list
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      branches: ${{ steps.b.outputs.branches }}
    steps:
      - id: b
        env:
          # Schedule → static branches plus supported remote ``release/*``
          # refs. Manual → exactly the branch the maintainer entered.
          BRANCHES: ${{ github.event_name == 'schedule' && env.CRON_BRANCHES || inputs.branch }}
          # ``EVENT_NAME`` mirrors ``github.event_name`` so the guard below
          # branches on it without re-interpolating into the shell.
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          API_TOKEN: ${{ github.token }}
        run: |
          branches=$(echo "$BRANCHES" | tr ',' '\n' | xargs -n1)
          if [ "$EVENT_NAME" = "schedule" ]; then
            release_branches=$(git ls-remote --heads "https://github.com/$REPOSITORY.git" 'refs/heads/release/*' \
              | awk '{sub(/^refs\/heads\//, "", $2); print $2}')
            while IFS= read -r branch; do
              [ -z "$branch" ] && continue
              encoded_branch=$(jq -rn --arg branch "$branch" '$branch | @uri')
              http_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --header "Authorization: Bearer $API_TOKEN" \
                --header 'Accept: application/vnd.github+json' \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$REPOSITORY/contents/tools/changelog/cli.py?ref=$encoded_branch")
              case "$http_status" in
                200) branches=$(printf '%s\n%s\n' "$branches" "$branch") ;;
                404) echo "::notice::Skipping $branch because it predates the changelog compiler." ;;
                *)
                  echo "::error::GitHub Contents API returned HTTP $http_status for $branch."
                  exit 1
                  ;;
              esac
            done <<< "$release_branches"
          fi
          # Trim, de-duplicate, and convert the resolved branches to a JSON array.
          arr=$(printf '%s\n' "$branches" | sed '/^$/d' | sort -u | jq -R . | jq -s -c .)
          # Manual trigger contract: exactly one branch. A maintainer who
          # pastes a comma-separated list into the dispatch form should
          # see a clear error, not a silent multi-branch fan-out.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$(echo "$arr" | jq 'length')" -ne 1 ]; then
            echo "::error::Manual trigger accepts exactly one branch; got $arr. Fire the workflow separately per branch."
            exit 1
          fi
          echo "branches=$arr" >> "$GITHUB_OUTPUT"
          echo "Resolved branches: $arr"

  compile-changelog:
    name: Compile changelog fragments (${{ matrix.branch }})
    needs: resolve-branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Independent branches: one failing shouldn't cancel the others.
      # Each matrix entry shows up as a separate job tile in the Actions
      # UI, so one release ref failing doesn't hide another ref's success
      # (and ``gh run rerun --failed`` re-runs only the failed entry).
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.resolve-branches.outputs.branches) }}
    concurrency:
      # Per-branch group: two runs against the same ref queue, but
      # different refs (develop and a release branch) compile in parallel.
      group: nightly-changelog-${{ matrix.branch }}
      cancel-in-progress: false

    steps:
      # Mint a short-lived (1 h) installation access token for the
      # ``isaaclab-bot`` GitHub App. The App is on each target branch's
      # ruleset bypass list, so its push lands without needing the
      # standard required-checks / required-approval pipeline.
      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        id: app-token
        with:
          # ``client-id`` (the App's OAuth client ID, ``Iv23...``) supersedes
          # the deprecated ``app-id`` integer input as of v3.x.
          client-id: ${{ secrets.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          # Declare the scope the App must have so token mint fails loudly
          # if the App is misconfigured, instead of failing silently at the
          # push step.
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # Operate on the target branch, not the repo's default branch.
          # Scheduled workflows fire from the default branch's workflow
          # file, but the *checkout* is the branch we're compiling so the
          # compile sees that branch's accumulated fragments and the push
          # writes back to it.
          ref: ${{ matrix.branch }}
          # App token (vs. GITHUB_TOKEN) means the push is signed by
          # ``isaaclab-bot`` — the bypass identity — and downstream CI
          # workflows DO trigger on the resulting commit.
          token: ${{ steps.app-token.outputs.token }}
          # Full history so the compiler can resolve each fragment's merge
          # time via ``git log --diff-filter=A --first-parent``.
          fetch-depth: 0

      - name: Verify changelog tooling exists on target branch
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          # Loud-fail this matrix entry (not the whole run — ``fail-fast:
          # false`` keeps siblings going) when the target branch lacks
          # ``tools/changelog/cli.py``. A red tile is the desired signal:
          # a branch in the nightly set without the compile tooling is a
          # configuration error, not a "no-op" condition.
          if [ ! -f tools/changelog/cli.py ]; then
            echo "::error::Branch '$TARGET_BRANCH' is missing tools/changelog/cli.py — drop it from env.CRON_BRANCHES (or the dispatch input) or restore the tooling on that branch."
            exit 1
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify the target branch carries the auto-bump subcommand
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          # Separate from the file check above because it needs the interpreter
          # ``setup-python`` provides -- the tool requires Python 3.11+ for
          # ``tomllib``, and the runner's default may be older.
          #
          # The file existing is not enough: a branch predating this subcommand
          # would fail with an argparse usage error deep in the run, after the
          # checkout and token mint. Manual dispatch accepts any branch name,
          # so fail fast with a message that says what to do.
          if ! python3 tools/changelog/cli.py auto-bump --help >/dev/null 2>&1; then
            echo "::error::Branch '$TARGET_BRANCH' has tools/changelog/cli.py but no working 'auto-bump' subcommand — cherry-pick the changelog tooling to that branch first."
            exit 1
          fi

      - name: Compile, sync the lock, commit and push
        # One invocation owns the whole post-compile lifecycle: staging,
        # the commit shape, the bot identity, uv.lock, and retry-on-conflict.
        # None of that lives here any more, which is the point -- this file
        # previously carried a duplicate of "which files cli.py writes" and
        # that copy went stale twice, bricking the cron both times.
        #
        # auto-bump publishes healthy packages before returning a failure.
        # The following step reports that exit status as a failed job.
        id: compile
        continue-on-error: true
        env:
          # Passed through an env var rather than interpolated into ``run:``
          # directly: interpolation happens before shell quoting, so an
          # adversarial branch name could escape the surrounding quotes.
          TARGET_BRANCH: ${{ matrix.branch }}
        run: |
          ARGS=(--branch "$TARGET_BRANCH" --remote origin)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          # --event-name is not passed: cli.py reads GITHUB_EVENT_NAME, which
          # Actions exports into every step.
          echo "Running: python3 tools/changelog/cli.py auto-bump ${ARGS[*]}"
          python3 tools/changelog/cli.py auto-bump "${ARGS[@]}"

      - name: Re-propagate compile failure
        # Healthy packages have already shipped within auto-bump. Keep
        # the job red when another package or the lock failed.
        if: ${{ steps.compile.outcome == 'failure' }}
        run: |
          echo "::error::One or more packages failed to compile (see the Compile fragments step above)."
          exit 1
