name: Run Docker CI Command
run-name: Run Docker CI for PR #${{ github.event.issue.number }}

on:
  # GitHub always runs ``issue_comment`` workflows from the repository default
  # branch, so this file has to land there for the ``run-ci`` command to work.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: run-docker-ci-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  request-docker-ci:
    name: Request Docker CI
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'run-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authorize the request
        id: authorize
        env:
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -efuo pipefail

          # Normalize CRLF and trim surrounding whitespace so trailing newlines from
          # web or mobile comments still match ``run-ci [option ...]``.
          body="${COMMENT_BODY//$'\r'/}"
          body="${body#"${body%%[![:space:]]*}"}"
          body="${body%"${body##*[![:space:]]}"}"
          if [[ "$body" == *$'\n'* ]]; then
            echo "::error::'run-ci' must be a single-line command: 'run-ci [option ...]' (supported options: ovstage)."
            exit 1
          fi

          read -r -a tokens <<< "$body"
          command_name="${tokens[0]:-}"
          if [ "${command_name,,}" != "run-ci" ]; then
            echo "::error::Unsupported command '$command_name'. Use 'run-ci' or 'run-ci <option> ...' (supported options: ovstage)."
            exit 1
          fi

          options=()
          for raw_opt in "${tokens[@]:1}"; do
            opt="${raw_opt,,}"
            case "$opt" in
              ovstage)
                if [[ " ${options[*]-} " != *" $opt "* ]]; then
                  options+=("$opt")
                fi
                ;;
              *)
                echo "::error::Unknown run-ci option '$raw_opt'. Supported options: ovstage."
                exit 1
                ;;
            esac
          done

          if [ "${#options[@]}" -eq 0 ]; then
            label="ci:run-docker"
            canonical_command="run-ci"
          else
            mapfile -t sorted_options < <(printf '%s\n' "${options[@]}" | LC_ALL=C sort)
            if [ "${#sorted_options[@]}" -eq 1 ] && [ "${sorted_options[0]}" = "ovstage" ]; then
              label="ci:run-ovstage"
            else
              joined_options="$(IFS=+; printf '%s' "${sorted_options[*]}")"
              label="ci:run-docker:${joined_options}"
            fi
            canonical_command="run-ci ${sorted_options[*]}"
          fi

          read -r pr_author pr_state head_sha < <(
            gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '[.user.login, .state, .head.sha] | @tsv'
          )
          if [ "$pr_state" != "open" ]; then
            echo "::error::PR #$PR_NUMBER is not open."
            exit 1
          fi
          if [ "${COMMENT_AUTHOR,,}" != "${pr_author,,}" ]; then
            commenter_permission="$(
              gh api "repos/$REPOSITORY/collaborators/$COMMENT_AUTHOR/permission" \
                --jq '.permission' 2>/dev/null || printf 'none'
            )"
            case "$commenter_permission" in
              admin|write) ;;
              *)
                echo "::error::Only PR author @$pr_author or a user with write access can request Docker CI."
                exit 1
                ;;
            esac
          fi

          {
            echo "head_sha=$head_sha"
            echo "label=$label"
            echo "command=$canonical_command"
          } >> "$GITHUB_OUTPUT"

      - name: Create isaaclab-bot token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3  # v3.1.1
        with:
          client-id: ${{ secrets.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Trigger Docker CI
        env:
          COMMAND: ${{ steps.authorize.outputs.command }}
          EXPECTED_HEAD_SHA: ${{ steps.authorize.outputs.head_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LABEL: ${{ steps.authorize.outputs.label }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # GitHub resolves the head when it processes the label, so labeling a
          # PR whose head has already moved on builds a revision nobody asked
          # for. Skip the request instead of spending GPU minutes on it.
          head_sha="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR #$PR_NUMBER moved from ${EXPECTED_HEAD_SHA:0:7} to ${head_sha:0:7} while this request was processed. Comment '$COMMAND' again to test the current head."
            exit 1
          fi

          endpoint="repos/$REPOSITORY/issues/$PR_NUMBER/labels"
          label_uri="$(jq -rn --arg v "$LABEL" '$v | @uri')"
          gh api --method DELETE "$endpoint/$label_uri" --silent >/dev/null 2>&1 || true
          gh api --method POST "$endpoint" -f "labels[]=$LABEL" --silent
          gh api --method DELETE "$endpoint/$label_uri" --silent

          # A push can still land between the check above and GitHub processing
          # the label; nothing can make those two steps atomic. Re-read the head
          # so the mismatch is reported rather than silently testing a revision
          # the requester never saw.
          built_sha="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$built_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR #$PR_NUMBER moved to ${built_sha:0:7} as the label was applied, so Docker CI is testing that revision and not the requested ${EXPECTED_HEAD_SHA:0:7}. Comment '$COMMAND' again to test the current head."
            exit 1
          fi

          echo "Requested Docker CI ($COMMAND) for PR #$PR_NUMBER at ${EXPECTED_HEAD_SHA:0:7}." >> "$GITHUB_STEP_SUMMARY"
