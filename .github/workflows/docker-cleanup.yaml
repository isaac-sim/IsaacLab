name: Docker Image Cleanup

on:
  schedule:
    # Run twice a day at 12 AM and 12 PM Pacific (7:00 / 19:00 UTC during PDT)
    - cron: '0 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup-old-docker-images:
    name: Remove Old Docker Images
    runs-on: [self-hosted, gpu]
    steps:
    - name: Remove Docker images older than 3 days
      run: |
        set -euo pipefail
        echo "Removing Docker images older than 3 days..."
        cutoff=$(date -d '3 days ago' +%s)
        docker images --format '{{.ID}} {{.CreatedAt}}' | while read -r id created_rest; do
          created_ts=$(date -d "$created_rest" +%s 2>/dev/null) || continue
          if [ "$created_ts" -lt "$cutoff" ]; then
            echo "Removing image $id (created: $created_rest)"
            docker rmi -f "$id" || true
          fi
        done
        echo "Docker image cleanup complete."
