name: Skills Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "skills/**"
      - ".agents/skills/**"
      - ".claude/skills"
      - "tools/skills/**"
      - ".github/workflows/skills-check.yml"
  workflow_dispatch:

concurrency:
  group: skills-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-skills:
    name: Check skills
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          # Keyed on this workflow file, not pyproject.toml: the pip cache key is
          # otherwise identical across every 3.12 ubuntu job here, so they collide
          # and all but the first fail to save. Hashing the workflow also ties
          # invalidation to the install list below rather than to unrelated
          # dependency churn.
          cache-dependency-path: .github/workflows/skills-check.yml

      - name: Verify skills
        run: python3 tools/skills/cli.py check

      - name: Install test dependencies
        run: bash "$GITHUB_WORKSPACE/.github/actions/_lib/with-python-package-retries.sh" python3 -m pip install pytest

      - name: Test skills validator
        run: python3 -m pytest tools/skills/

  # SkillEvaluator Tier 1/2A/2B/3 for skills/user/* skills touched by this PR
  # (skills/_internal/ is excluded — not part of the NVCARPS-facing catalog).
  # Needs internal network access (PyPI mirror + inference.nvidia.com) and a
  # Docker daemon for Tier 3, hence the self-hosted runner and reuse of the
  # NVIDIA_INFERENCE_API_KEY secret.
  validate-skills:
    name: Validate skills (SkillEvaluator)
    runs-on: [self-hosted, gpu]
    timeout-minutes: 90
    # Requires explicit maintainer approval before running untrusted PR code on the
    # self-hosted runner. Configure this environment in the repo settings with
    # required reviewers to gate execution.
    environment: skillevaluator-review
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Check NVIDIA internal registry connectivity
        id: registry_check
        run: |
          if python3 -c "import socket; socket.getaddrinfo('urm.nvidia.com', 443)" 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::urm.nvidia.com unreachable — runner is not on the NVIDIA internal network; SkillEvaluator steps will be skipped"
          fi

      - name: Install skillevaluator
        id: install_skillevaluator
        # Only runs when urm.nvidia.com is reachable (NVIDIA internal runners).
        # Any install failure other than network unreachability fails the job so
        # a bad version pin or pip error does not silently disable the gate.
        if: steps.registry_check.outputs.reachable == 'true'
        env:
          # Pinned deliberately: a bump can newly-fail every open PR.
          SKILLEVALUATOR_VERSION: "1.0.0"
          # Provided so that `skillevaluator doctor` can verify inference-API access.
          NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "skillevaluator==${SKILLEVALUATOR_VERSION}" -i https://urm.nvidia.com/artifactory/api/pypi/nv-shared-pypi/simple
          skillevaluator --version
          skillevaluator doctor || echo "::warning::skillevaluator doctor reported issues — check NVIDIA_INFERENCE_KEY and network access"

      - name: Determine touched skills
        id: touched
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          # Use Python stdlib to fetch changed files — gh CLI is not available on all runners.
          changed_files="$(python3 tools/skills/get_pr_files.py)"

          declare -A seen=()
          skill_dirs=()
          while IFS= read -r f; do
            [[ "$f" == skills/user/*/* ]] || continue
            name="${f#skills/user/}"
            name="${name%%/*}"
            root="skills/user/${name}"
            if [[ -d "$root" && -z "${seen[$root]:-}" ]]; then
              seen[$root]=1
              skill_dirs+=("$root")
            fi
          done <<< "$changed_files"

          if [ ${#skill_dirs[@]} -eq 0 ]; then
            echo "No skills/user/ directories were changed by this PR; nothing to validate."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "Skills touched by this PR (validating only these):"
            printf '  - %s\n' "${skill_dirs[@]}"
            echo "any=true" >> "$GITHUB_OUTPUT"
            { printf 'dirs<<SKILL_DIRS_EOF\n'; printf '%s\n' "${skill_dirs[@]}"; printf 'SKILL_DIRS_EOF\n'; } >> "$GITHUB_OUTPUT"
          fi

      - name: Run SkillEvaluator Tier 1 / Tier 2A / Tier 3
        if: steps.install_skillevaluator.outcome == 'success' && steps.touched.outputs.any == 'true'
        env:
          NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_API_KEY }}
          SKILL_DIRS: ${{ steps.touched.outputs.dirs }}
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r skill_dir; do
            [[ -n "$skill_dir" ]] || continue
            echo ""
            echo "===== Per-skill validation: ${skill_dir} ====="
            if ! skillevaluator validate "${skill_dir}" \
                  -c \
                  --tier3 \
                  --profile internal \
                  --catalog-path skills \
                  --no-dedup; then
              failed=1
            fi

            echo ""
            echo "===== Tier 2A intra-skill context dedup: ${skill_dir} ====="
            if ! skillevaluator context-optimization-check "${skill_dir}"; then
              failed=1
            fi
          done <<< "${SKILL_DIRS}"

          echo ""
          echo "===== Tier 2B intra-repo similarity scan: skills/user/ ====="
          if ! skillevaluator similarity-check skills/user/ --type skill; then
            failed=1
          fi

          exit "${failed}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always() && steps.install_skillevaluator.outcome == 'success' && steps.touched.outputs.any == 'true'
        with:
          name: skillevaluator-reports
          path: reports/
          retention-days: 7
