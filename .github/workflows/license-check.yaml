name: Python Dependency Licenses Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
  LICENSE_CHECK_IMAGE_TAG: isaac-lab-license-check:pr-${{ github.event.pull_request.number }}-${{ github.sha }}

jobs:
  config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        sparse-checkout: .github/workflows/config.yaml
        sparse-checkout-cone-mode: false
    - id: load
      run: |
        set -euo pipefail
        f=.github/workflows/config.yaml
        echo "isaacsim_image_name=$(yq -r .isaacsim_image_name "$f")" >> "$GITHUB_OUTPUT"
        echo "isaacsim_image_tag=$(yq -r .isaacsim_image_tag "$f")" >> "$GITHUB_OUTPUT"

  license-check:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        filter: tree:0

    - name: Clean up disk space
      run: |
        # Remove pre-installed tools
        rm -rf /opt/hostedtoolcache
        rm -rf /usr/share/dotnet
        rm -rf /opt/ghc
        sudo rm -rf /usr/local/lib/android
        rm -rf /usr/share/swift
        rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/lib/node_modules
        sudo rm -rf /usr/local/share/chromium
        sudo rm -rf /usr/local/share/powershell
        # Clean apt cache
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*
        # Docker cleanup
        docker container prune -f
        docker image prune -af
        docker volume prune -f
        docker system prune -af

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies using ./isaaclab.sh -i
      env:
        DEBUG: 1
        OMNI_KIT_ACCEPT_EULA: yes
        ACCEPT_EULA: Y
        ISAACSIM_ACCEPT_EULA: YES
      run: |
        # first install isaac sim
        pip install --upgrade pip
        pip install 'isaacsim[all,extscache]==${{ vars.ISAACSIM_BASE_VERSION || '6.0.0' }}' --extra-index-url https://pypi.nvidia.com
        chmod +x ./isaaclab.sh  # Make sure the script is executable
        # install all lab dependencies
        ./isaaclab.sh -i

    - name: Install pip-licenses
      run: |
        ./isaaclab.sh -p -m pip install --no-cache-dir pip-licenses
        ./isaaclab.sh -p -m pip install --no-cache-dir -r tools/template/requirements.txt
        ./isaaclab.sh -p -m pip install --no-cache-dir -r docs/requirements.txt

    # Optional: Print the license report for visibility
    - name: Print License Report
      run: ./isaaclab.sh -p -m piplicenses --from=mixed --format=markdown

    # Print pipdeptree
    - name: Print pipdeptree
      run: |
        # clean up pip cache
        ./isaaclab.sh -p -m pip cache purge
        ./isaaclab.sh -p -m pip install pipdeptree
        ./isaaclab.sh -p -m pipdeptree

    - name: Check licenses against whitelist and exceptions
      run: |
        ./isaaclab.sh -p tools/check_dependency_licenses.py pip \
          --exceptions-file .github/workflows/license-exceptions.json \
          --report-label "host pip"

  docker-license-check:
    name: Docker Image Licenses Check
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    needs: [config]
    env:
      ISAACSIM_BASE_IMAGE_NAME: ${{ needs.config.outputs.isaacsim_image_name }}
      ISAACSIM_BASE_IMAGE_TAG: ${{ needs.config.outputs.isaacsim_image_tag }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true

    - name: Prepare Docker disk space
      shell: bash
      run: |
        set -euo pipefail
        isaacsim_base_image="${ISAACSIM_BASE_IMAGE_NAME}:${ISAACSIM_BASE_IMAGE_TAG}"
        bash .github/actions/run-package-tests/cleanup_docker_storage.sh \
          "${isaacsim_base_image}" \
          "isaacsim-pin-license-check-${{ github.run_id }}-${{ github.run_attempt }}-pre" \
          "pre-license-check-cleanup" \
          "true"

    - name: Collect base apt package baseline
      shell: bash
      run: |
        set -euo pipefail
        isaacsim_base_image="${ISAACSIM_BASE_IMAGE_NAME}:${ISAACSIM_BASE_IMAGE_TAG}"
        mkdir -p license-reports

        docker_config_dir="$(mktemp -d)"
        trap 'rm -rf "${docker_config_dir}"' EXIT
        echo '{"credsStore":""}' > "${docker_config_dir}/config.json"

        if [ -n "${NGC_API_KEY}" ]; then
          printf '%s' "${NGC_API_KEY}" | docker --config "${docker_config_dir}" login \
            -u '$oauthtoken' --password-stdin nvcr.io
        else
          echo "NGC_API_KEY not set - attempting to read the base image without registry login."
        fi

        # The Isaac Sim base image is outside this repository's control. Use it
        # as the baseline so the apt check covers system packages introduced by
        # the Isaac Lab Docker build.
        docker --config "${docker_config_dir}" run --rm --entrypoint bash "${isaacsim_base_image}" \
          -lc 'apt-mark showmanual | sort' > license-reports/base-apt-manual.txt

    - name: Build Docker Image
      uses: ./.github/actions/ecr-build-push-pull
      with:
        image-tag: ${{ env.LICENSE_CHECK_IMAGE_TAG }}
        isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
        isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
        dockerfile-path: docker/Dockerfile.base
        cache-tag: cache-base

    - name: Check Docker pip package licenses
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm --network=host \
          -e OMNI_KIT_ACCEPT_EULA=Y \
          -e ACCEPT_EULA=Y \
          -e ISAACSIM_ACCEPT_EULA=YES \
          -v "$PWD":/workspace/isaaclab \
          --entrypoint bash \
          "${LICENSE_CHECK_IMAGE_TAG}" \
          -lc '
            set -euo pipefail
            cd /workspace/isaaclab
            /isaac-sim/python.sh -m pip install --no-cache-dir pip-licenses
            /isaac-sim/python.sh -m piplicenses --from=mixed --format=markdown
            /isaac-sim/python.sh tools/check_dependency_licenses.py pip \
              --exceptions-file .github/workflows/license-exceptions.json \
              --report-label "docker pip"
          '

    - name: Check Docker apt package licenses
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          -v "$PWD":/workspace/isaaclab \
          --entrypoint bash \
          "${LICENSE_CHECK_IMAGE_TAG}" \
          -lc '
            set -euo pipefail
            cd /workspace/isaaclab
            /isaac-sim/python.sh tools/check_dependency_licenses.py apt \
              --apt-manual-only \
              --apt-baseline-file license-reports/base-apt-manual.txt \
              --exceptions-file .github/workflows/license-exceptions.json \
              --report-label "docker apt"
          '

    - name: Cleanup old Docker images
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        isaacsim_base_image="${ISAACSIM_BASE_IMAGE_NAME}:${ISAACSIM_BASE_IMAGE_TAG}"
        bash .github/actions/run-package-tests/cleanup_docker_storage.sh \
          "${isaacsim_base_image}" \
          "isaacsim-pin-license-check-${{ github.run_id }}-${{ github.run_attempt }}-post" \
          "post-license-check-cleanup" \
          "false"
