        extra-pip-packages: "pytetwild[all]>=0.3.0,<0.4"
        shard-index: "2"
        shard-count: "3"
        warp-cache: restore
        container-name: isaac-lab-tasks-3-test

  test-isaaclab-core:
    name: isaaclab (core) [1/3]
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    needs: [build, config]
    if: >-
