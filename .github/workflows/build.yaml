# TEMPORARY: This workflow intentionally defines only isaaclab_newton tests while
# the optimized Newton test profiles are validated on CI. Restore the package,
# rendering, training, image-build, and architecture jobs after that validation.

name: Docker + Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-isaaclab-newton-kitless:
    name: isaaclab_newton kitless
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Run Kit-less Newton tests
      env:
        ISAACLAB_RUN_CI_TESTS: "1"
        PYTEST_ADDOPTS: "--without-kit"
      run: >-
        uv run --extra test --locked python -m pytest
        source/isaaclab_newton/test
        --junitxml=isaaclab-newton-kitless.xml
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: isaaclab-newton-kitless-report
        path: isaaclab-newton-kitless.xml

  test-isaaclab-newton-kit:
    name: isaaclab_newton requires Kit
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Run Newton tests that require Kit
      env:
        ACCEPT_EULA: "Y"
        OMNI_KIT_ACCEPT_EULA: "YES"
        OMNI_KIT_DISABLE_CUP: "1"
        ISAAC_SIM_HEADLESS: "1"
        ISAAC_SIM_LOW_MEMORY: "1"
        ISAACLAB_RUN_CI_TESTS: "1"
        PYTHONUNBUFFERED: "1"
        TEST_FILTER_PATTERN: "isaaclab_newton"
        CI_MARKER: "requires_kit"
        TEST_RESULT_FILE: "isaaclab-newton-kit.xml"
      run: >-
        uv run --extra isaacsim --locked
        --with pytest --with pytest-mock --with junitparser
        --with prettytable --with flaky --with 'coverage>=7.6.1'
        python -m pytest tools -v
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: isaaclab-newton-kit-report
        path: tests/isaaclab-newton-kit.xml
