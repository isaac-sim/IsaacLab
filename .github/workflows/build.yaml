        filter-pattern: "not isaaclab_"
        shard-index: "1"
        shard-count: "3"
        warp-cache: restore
        container-name: isaac-lab-core-2-test

  test-isaaclab-core-3:
    name: isaaclab (core) [3/3]
    runs-on: [self-hosted, gpu]
