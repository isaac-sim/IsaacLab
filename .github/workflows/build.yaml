  performance-smoke:
    name: performance-smoke-benchmarks
    runs-on: [self-hosted, gpu]
    # Configured paired attempts total 372 minutes, leaving 78 minutes for setup and reporting.
    timeout-minutes: 450
    needs: [build, config]
    env:
      PERF_BASE_COMMIT: ${{ needs.config.outputs.paired_base_commit }}
      PERF_PAIR_ERROR: ${{ needs.config.outputs.paired_base_error }}
    # develop pushes refresh the rolling-history baseline used by the gate.
    if: >-
      (github.event_name != 'push' || github.ref == 'refs/heads/develop') &&
      needs.build.result == 'success'
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true
    # Row format: name|task|num_envs|bench_timeout_s|args
    - name: Define benchmark matrix
      run: |
        cat > benchmark-legs.tsv <<'EOF'
        cartpole-newton|Isaac-Cartpole-Direct|4096|600|physics=newton_mjwarp
        shadow-camera-newton-renderer|IsaacContrib-Reorient-Cube-Shadow-Camera-Benchmark-Direct|512|1200|physics=newton_mjwarp renderer=newton_renderer
        shadow-camera-ovphysx-newton|IsaacContrib-Reorient-Cube-Shadow-Camera-Benchmark-Direct|512|1200|physics=ovphysx renderer=newton_renderer
        g1-newton|Isaac-Velocity-Flat-G1|512|720|physics=newton_mjwarp
        EOF

    - name: Resolve Warp version for the JIT cache key
      id: warp_version
      run: |
        set -euo pipefail
        version="$(sed -n 's/.*warp-lang[^0-9]*\([0-9][0-9A-Za-z.\-]*\).*/\1/p' pyproject.toml | head -n1)"
        if [ -z "$version" ]; then
          echo "::error::Could not resolve the warp-lang pin from pyproject.toml; the JIT cache key would stop tracking Warp"
          exit 1
        fi
        echo "value=$version" >> "$GITHUB_OUTPUT"

    - name: Restore warm JIT cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/jit-cache
        key: perf-jit-warp${{ steps.warp_version.outputs.value }}-${{ github.run_id }}
        restore-keys: |
          perf-jit-warp${{ steps.warp_version.outputs.value }}-

    # Switching revisions cleans the checkout, so store the controller and results outside it.
    - name: Preserve benchmark controller and restored JIT cache
      run: |
        set -euo pipefail
        controller="${RUNNER_TEMP}/perf-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        mkdir -p "$controller/tools" "$controller/baseline-output"
        cp -a tools/perf_smoke "$controller/tools/"
        cp benchmark-legs.tsv "$controller/benchmark-legs.tsv"
        if [ -d jit-cache ]; then
          mv jit-cache "$controller/jit-cache"
        else
          mkdir -p "$controller/jit-cache"
        fi
        echo "PERF_CONTROLLER=$controller" >> "$GITHUB_ENV"
        echo "PERF_BASELINE_OUTPUT=$controller/baseline-output" >> "$GITHUB_ENV"
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          echo "PERF_MEASUREMENT_ROOT=$controller/measurement" >> "$GITHUB_ENV"
          echo "PERF_MEASUREMENT_MANIFEST=$controller/measurement/measurement-manifest.json" >> "$GITHUB_ENV"
        fi

    - name: Preserve the tested PR measurement implementation
      if: github.event_name == 'pull_request'
      run: |
        python3 "$PERF_CONTROLLER/tools/perf_smoke/source_revision.py" snapshot \
          --checkout-root "$GITHUB_WORKSPACE" --output-dir "$PERF_MEASUREMENT_ROOT"

    - name: Check out the PR base revision
      id: base_checkout
      continue-on-error: true
      if: github.event_name == 'pull_request' && needs.config.outputs.paired_base_commit != ''
      uses: actions/checkout@v6
      with:
        ref: ${{ needs.config.outputs.paired_base_commit }}
        fetch-depth: 1
        lfs: true

    - name: Restore this PR's verified base measurement
      id: pr_baseline
      timeout-minutes: 5
      if: steps.base_checkout.outcome == 'success'
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        cd "$PERF_CONTROLLER"
        python3 -m tools.perf_smoke.paired restore \
          --checkout-root "$GITHUB_WORKSPACE" --output-dir "$PERF_BASELINE_OUTPUT" \
          --selection "$PERF_CONTROLLER/selection.json" --legs "$PERF_CONTROLLER/benchmark-legs.tsv"

    - name: Resolve the base revision's dependency image
      id: base_dependencies
      continue-on-error: true
      if: steps.base_checkout.outcome == 'success' && steps.pr_baseline.outputs.reused != 'true' && needs.config.outputs.base_image_config_outcome == 'success'
      uses: ./.github/actions/ecr-build-push-pull
      with:
        image-tag: isaac-lab-perf-base:${{ needs.config.outputs.paired_base_commit }}
        isaacsim-base-image: ${{ needs.config.outputs.base_isaacsim_image_name }}
        isaacsim-version: ${{ needs.config.outputs.base_isaacsim_image_tag }}
        dockerfile-path: docker/Dockerfile.base
        cache-tag: cache-base
        pull-on-deps-hit: 'true'

    - name: Benchmark the PR base on this runner
      id: measure_base
      if: steps.base_dependencies.outcome == 'success'
      continue-on-error: true
      env:
        CI_IMAGE_TAG: isaac-lab-perf-base:${{ needs.config.outputs.paired_base_commit }}
      run: |
        set -euo pipefail
        cd "$PERF_CONTROLLER"
        # Remove any error report from a failed check for reusable results in earlier CI runs
        # to keep it out of the new benchmark results.
        rm -rf -- "$PERF_BASELINE_OUTPUT"
        mkdir -p "$PERF_BASELINE_OUTPUT"
        python3 -m tools.perf_smoke.paired capture \
          --checkout-root "$GITHUB_WORKSPACE" --output-dir "$PERF_BASELINE_OUTPUT" \
          --image "$CI_IMAGE_TAG" --role baseline --legs "$PERF_CONTROLLER/benchmark-legs.tsv"
        CHECKOUT_ROOT="$GITHUB_WORKSPACE" BENCHMARK_OUTPUT="$PERF_BASELINE_OUTPUT" \
        SOURCE_REVISION_LAUNCHER="$PERF_CONTROLLER/tools/perf_smoke/source_revision.py" \
        SOURCE_MANIFEST="$PERF_BASELINE_OUTPUT/source-manifest.json" \
        BENCHMARK_LEGS="$PERF_CONTROLLER/benchmark-legs.tsv" JIT_CACHE_ROOT="$PERF_CONTROLLER/jit-cache" \
        BENCHMARK_ROLE=BASELINE bash "$PERF_CONTROLLER/tools/perf_smoke/run_benchmarks.sh"

    - name: Archive the PR base measurement
      id: base_artifact
      if: always() && github.event_name == 'pull_request' && steps.pr_baseline.outputs.reused != 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: performance-pr-baseline-${{ github.event.pull_request.number }}-${{ needs.config.outputs.paired_base_commit }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/perf-smoke-${{ github.run_id }}-${{ github.run_attempt }}/baseline-output/
        if-no-files-found: warn

    - name: Restore the tested PR revision
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        lfs: true

    - name: Pull pull-request image
      if: ${{ !cancelled() }}
      uses: ./.github/actions/ecr-build-push-pull
      with:
        image-tag: ${{ needs.config.outputs.ci_image_tag }}
        isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
        isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
        dockerfile-path: docker/Dockerfile.base
        cache-tag: cache-base
        pull-on-deps-hit: 'true'

    - name: Pin the base comparison for this tested PR revision
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      env:
        BASE_ARTIFACT_ID: ${{ steps.base_artifact.outputs.artifact-id }}
        PERF_BASELINE_REUSED: ${{ steps.pr_baseline.outputs.reused }}
        BASE_CHECKOUT: ${{ steps.base_checkout.outcome }}
        BASE_RESTORE: ${{ steps.pr_baseline.outcome }}
        BASE_CONFIG: ${{ needs.config.outputs.base_image_config_outcome }}
        BASE_IMAGE: ${{ steps.base_dependencies.outcome }}
        BASE_MEASUREMENT: ${{ steps.measure_base.outcome }}
        BASE_ARCHIVE: ${{ steps.base_artifact.outcome }}
      run: |
        baseline_issue=""
        if { [ "$BASE_RESTORE" = failure ] || [ "$BASE_MEASUREMENT" = failure ]; } && \
           [ -f "$PERF_BASELINE_OUTPUT/paired-failure.json" ]; then
          mkdir -p "$GITHUB_WORKSPACE/benchmark-output"
          cp "$PERF_BASELINE_OUTPUT/paired-failure.json" "$GITHUB_WORKSPACE/benchmark-output/"
        fi
        if [ "$BASE_CHECKOUT" != success ]; then
          baseline_issue="The base source checkout failed; baseline FPS is unavailable."
        elif [ "$BASE_CONFIG" != success ]; then
          baseline_issue="The base image configuration could not be read; the base benchmark did not run."
        elif [ "$BASE_IMAGE" = failure ]; then
          baseline_issue="The base dependency image could not be prepared; the base benchmark did not run."
        elif [ "$BASE_MEASUREMENT" = failure ]; then
          baseline_issue="The base benchmark failed; baseline results are incomplete or unavailable."
        elif [ "$BASE_ARCHIVE" = failure ]; then
          baseline_issue="The base results could not be uploaded; baseline FPS is unavailable."
        elif [ "$BASE_RESTORE" != success ] && [ "$BASE_MEASUREMENT" != success ]; then
          baseline_issue="The base measurement setup failed; baseline FPS is unavailable."
        fi
        cd "$PERF_CONTROLLER"
        python3 -m tools.perf_smoke.paired bind \
          --selection "$PERF_CONTROLLER/selection.json" --output-dir "$GITHUB_WORKSPACE/benchmark-output" \
          --artifact-id "$BASE_ARTIFACT_ID" --baseline-issue "$baseline_issue"

    - name: Capture performance build provenance and source evidence
      id: source_capture
      if: always()
      env:
        CI_IMAGE_TAG: ${{ needs.config.outputs.ci_image_tag }}
      run: |
        cd "$PERF_CONTROLLER"
        python3 -m tools.perf_smoke.paired capture \
          --checkout-root "$GITHUB_WORKSPACE" --output-dir "$GITHUB_WORKSPACE/benchmark-output" \
          --image "$CI_IMAGE_TAG" --role current --legs "$PERF_CONTROLLER/benchmark-legs.tsv"

    - name: Run runtime benchmarks
      if: ${{ !cancelled() && steps.source_capture.outcome == 'success' }}
      env:
        CI_IMAGE_TAG: ${{ needs.config.outputs.ci_image_tag }}
      run: |
        CHECKOUT_ROOT="$GITHUB_WORKSPACE" BENCHMARK_OUTPUT="$GITHUB_WORKSPACE/benchmark-output" \
        SOURCE_REVISION_LAUNCHER="$PERF_CONTROLLER/tools/perf_smoke/source_revision.py" \
        SOURCE_MANIFEST="$GITHUB_WORKSPACE/benchmark-output/source-manifest.json" \
        BENCHMARK_LEGS="$PERF_CONTROLLER/benchmark-legs.tsv" JIT_CACHE_ROOT="$PERF_CONTROLLER/jit-cache" \
        BENCHMARK_ROLE=CURRENT bash "$PERF_CONTROLLER/tools/perf_smoke/run_benchmarks.sh"

    - name: Restore the JIT archive path
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: mv "$PERF_CONTROLLER/jit-cache" "$GITHUB_WORKSPACE/jit-cache"

    - name: Save warm JIT cache
      if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/jit-cache
        key: perf-jit-warp${{ steps.warp_version.outputs.value }}-${{ github.run_id }}

    - name: Set up uv for performance comparisons
      if: always()
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false

    # The gate runs on the host, so install its dependencies in a temporary environment.
    - name: Set up ASV and the baseline store client
      if: always()
      # Dependency failures report a gate ERROR without failing a successful benchmark job.
      continue-on-error: true
      id: store_venv
      run: |
        set -euo pipefail
        venv="${RUNNER_TEMP}/perf-smoke-venv"
        uv venv --python 3.12 "$venv"
        uv pip install --python "$venv/bin/python" \
          -r tools/perf_smoke/requirements.txt
        echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"

    # This step runs PR code, so it receives only read access to stored baselines.
    - name: Compare against baseline history
      # The summary job reports regressions; this job's status tracks benchmark execution.
      # Continue after a comparison error so the remaining workloads still get results.
      continue-on-error: true
      if: always()
      timeout-minutes: 30
      env:
        ISAACLAB_BLOB_URL: ${{ secrets.ISAACLAB_BLOB_READ_URL }}
        PERF_PYTHON: ${{ steps.store_venv.outputs.python }}
      run: |
        set -uo pipefail
        while IFS='|' read -r leg task num_envs bench_timeout_s args; do
          gate_report="$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            mkdir -p "benchmark-output/${leg}"
            gate_report="benchmark-output/${leg}/rolling-history.md"
          fi
          mapfile -t results < <(find "benchmark-output/${leg}" -type f -name 'benchmark_runtime_*.json' | sort)
          if [ "$(cat "benchmark-output/${leg}/status" 2>/dev/null)" != "ok" ] || [ "${#results[@]}" -ne 3 ]; then
            echo "::warning::${leg}: expected three runtime benchmark JSONs, found ${#results[@]}"
            results=("benchmark-output/${leg}/benchmark_runtime_MISSING.json")
          fi
          uv run --no-project --python "${PERF_PYTHON:-python3}" python -m tools.perf_smoke.cli compare \
            --benchmark_result "${results[@]}" \
            --label "$leg" \
            --output_json "benchmark-output/${leg}/comparison.json" \
            | tee -a "$gate_report"
        done < "$PERF_CONTROLLER/benchmark-legs.tsv"

    # Unique commit/run names keep new measurements from overwriting earlier history.
    - name: Record baseline
      if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      timeout-minutes: 30
      env:
        ISAACLAB_BLOB_URL: ${{ secrets.ISAACLAB_BLOB_URL }}
        PERF_PYTHON: ${{ steps.store_venv.outputs.python }}
      run: |
        set -uo pipefail
        if [ -z "${ISAACLAB_BLOB_URL:-}" ]; then
          echo "::warning::ISAACLAB_BLOB_URL is not set; no baselines recorded"
          exit 0
        fi
        while IFS='|' read -r leg task num_envs bench_timeout_s args; do
          if [ "$(cat "benchmark-output/${leg}/status" 2>/dev/null)" != "ok" ]; then
            echo "::warning::${leg}: benchmark did not succeed; no baseline recorded"
            continue
          fi
          mapfile -t results < <(find "benchmark-output/${leg}" -type f -name 'benchmark_runtime_*.json' | sort)
          if [ "${#results[@]}" -ne 3 ]; then
            echo "::error::${leg}: expected three runtime benchmark JSONs, found ${#results[@]}; no baseline recorded"
            continue
          fi
          for index in "${!results[@]}"; do
            uv run --no-project --python "${PERF_PYTHON:-python3}" python -m tools.perf_smoke.cli write \
              --benchmark_result "${results[$index]}" \
              --commit "$GITHUB_SHA" \
              --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --run_id "${GITHUB_RUN_ID}-${leg}-sample-${index}"
          done
        done < "$PERF_CONTROLLER/benchmark-legs.tsv"
    - name: Upload performance results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: performance-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        path: benchmark-output/
        if-no-files-found: warn
        retention-days: 7

  # Benchmark execution failures are reported by performance-smoke-benchmarks.
  performance-smoke-summary:
    name: performance-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    needs: [performance-smoke]
    if: always() && needs.performance-smoke.result != 'skipped'
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: false
    - uses: actions/download-artifact@v7
      with:
        name: performance-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        path: comparisons
      continue-on-error: true
    - name: Compare the tested build with its selected baseline
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: uv run --no-project python -m tools.perf_smoke.build_compare --output_dir build-comparison

    - name: Upload the automatic build comparison
      id: build_comparison_artifact
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: performance-build-comparison-${{ github.run_id }}-${{ github.run_attempt }}
        path: build-comparison/
        if-no-files-found: warn

    - name: Summarise performance comparisons
      if: always()
      env:
        COMPARISON_ARTIFACT_URL: ${{ steps.build_comparison_artifact.outputs.artifact-url }}
      run: |
        set -euo pipefail
        gate_exit=0
        uv run --no-project python -m tools.perf_smoke.cli aggregate \
          --comparison_dir comparisons > rolling-history.md || gate_exit=$?
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          cat rolling-history.md >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_exit"
        fi
        {
          printf '## Performance smoke\n\n'
          if [ -s build-comparison/build-comparison.md ]; then
            cat build-comparison/build-comparison.md
          else
            printf '### Automatic build comparison\n\n'
            printf '**Build comparison: SKIPPED.** The comparison report was not produced; baseline selection and A/B results are unavailable. See the "Compare the tested build with its selected baseline" step for the error.\n\n'
            printf '**B — current build:** [%s](%s/%s/commit/%s) · [run %s, attempt %s](%s/%s/actions/runs/%s/attempts/%s).\n\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf '**A — baseline build:** unavailable because report generation did not complete.\n'
          fi
          printf '\n'
          cat rolling-history.md
          if [ -n "$COMPARISON_ARTIFACT_URL" ]; then
            printf '\n[Download optional comparison evidence and provenance](%s)\n' "$COMPARISON_ARTIFACT_URL"
          else
            printf '\nThe optional comparison artifact was not uploaded; available source-result links are shown above.\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        echo "Performance comparison rendered in the GitHub Actions Summary."
        exit "$gate_exit"

    - name: Link the rendered comparison from PR Checks
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('node:fs');
          const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
            ...context.repo,
            run_id: context.runId,
            attempt_number: attempt,
            per_page: 100,
            request: {timeout: 60000},
          });
          const summaryJob = jobs.find(job => job.name === 'performance-smoke');
          if (!summaryJob) throw new Error('The Performance smoke Summary job could not be located.');
          const summaryUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}`
            + `/actions/runs/${context.runId}/attempts/${attempt}#summary-${summaryJob.id}`;
          // Native checks open logs; the report check opens rendered output.
          // Also link the Summary here because GitHub may group the report under another suite.
          core.notice(summaryUrl, {title: 'Open rendered Performance smoke Summary'});
          const reportPath = 'build-comparison/build-comparison.md';
          const report = fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : '';
          const result = report.match(/^\*\*(.+)\*\*$/m)?.[0]
            || '**Comparison unavailable. Open the Summary for the reason and available evidence.**';
          const {data: check} = await github.rest.checks.create({
            ...context.repo,
            name: 'Performance smoke comparison',
            head_sha: context.payload.pull_request.head.sha,
            status: 'completed',
            conclusion: 'neutral',
            external_id: `performance-smoke-comparison:${context.runId}:${attempt}`,
            details_url: summaryUrl,
            output: {
              title: 'Performance smoke comparison',
              summary: [
                `## [Open rendered Performance smoke Summary](${summaryUrl})`,
                result,
                'View baseline and PR FPS, percentage changes, and results for every workload. '
                  + 'Builds, source runs, samples, and diagnostics are in the collapsed details.',
                'This report is informational. The existing `performance-smoke` check retains the rolling-history CI gate.',
              ].join('\n\n'),
            },
          });
          core.info(`PR comparison check: ${check.html_url}`);

  # PR-created caches are scoped to that PR, and pushes run no solver-heavy tests to warm a shared cache.
  # This job extends the shared cache and saves only changed contents to avoid duplicate snapshots.
  warm-warp-cache:
    name: "warp-cache-warm"
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    # A failed warm leaves the previous cache usable.
    continue-on-error: true
    needs: [build, config]
    # Concurrent writers could each publish a cache missing the other's additions.
    concurrency:
      group: warp-cache-write-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success'
    env:
      # PRs can restore these caches from their base branch; publishing on other branches wastes quota.
      PUBLISHES_WARP_CACHE: ${{ github.ref_name == 'main' || github.ref_name == 'develop' || startsWith(github.ref_name, 'release/') }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true
    - uses: ./.github/actions/run-package-tests
      with:
        image-tag: ${{ needs.config.outputs.ci_image_tag }}
        isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
        isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
        filter-pattern: "isaaclab_tasks"
        # MJWarp compiles kernels per model, so a small task sample would leave most PR tests with a cold cache.
        # The multi-agent suite includes Handover.
        include-files: >-
          test_environments_newton.py,
          test_multi_agent_environments.py
        test-k-expr: "test_environments and not (Soft or Cloth or Cable)"
        warp-cache: ${{ env.PUBLISHES_WARP_CACHE == 'true' && 'save' || 'restore' }}
        container-name: isaac-lab-warp-cache-warm
        omni-github-test-type: warp-cache-warm

  # Publish outside PR runs so base-branch jobs do not inherit caches written by PR code.
  warm-ovrtx-cache:
    name: "ovrtx-cache-warm"
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    continue-on-error: true
    needs: [build, config]
    concurrency:
      group: ovrtx-cache-write-${{ github.ref }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success'
    env:
      PUBLISHES_OVRTX_CACHE: ${{ github.ref_name == 'main' || github.ref_name == 'develop' || startsWith(github.ref_name, 'release/') }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true
    - name: Resolve OV runtime pins from pyproject
      uses: ./.github/actions/resolve-ov-pins
      id: ov_pins
    - uses: ./.github/actions/run-package-tests
      with:
        image-tag: ${{ needs.config.outputs.ci_image_tag }}
        isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
        isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
        filter-pattern: "isaaclab_tasks"
        extra-pip-packages: "${{ steps.ov_pins.outputs.ovrtx }} ${{ steps.ov_pins.outputs.ovphysx }}"
        include-files: >-
          test_rendering_cartpole.py,
          test_rendering_cartpole_kitless.py
        # Only isaacsim_rtx and ovrtx fill the Kit and kitless shader caches.
        # Exact test IDs make a rename fail visibly instead of silently warming nothing.
        test-node-ids-file: .github/test-subsets/postmerge-rendering.toml
        test-node-ids-key: ovrtx-cache-warm
        ovrtx-shader-cache: ${{ env.PUBLISHES_OVRTX_CACHE == 'true' && 'save' || 'restore' }}
        container-name: isaac-lab-ovrtx-cache-warm
        omni-github-test-type: ovrtx-cache-warm
