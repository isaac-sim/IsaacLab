# Any label starts a run because GitHub cannot filter label names at trigger time.

name: Docker + Tests

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    types: [labeled, synchronize]
    branches:
      - main
      - develop
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Pushes, manual runs, and unrelated labels leave the current run in progress.
  cancel-in-progress: ${{ github.event.action == 'synchronize' || github.event.label.name == 'ci:run-docker' }}

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
  issues: read

env:
  NGC_API_KEY: ${{ secrets.NGC_API_KEY }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
      activated: ${{ steps.activation.outputs.activated }}
    steps:
    - name: Check PR update activation
      id: activation
      continue-on-error: true
      timeout-minutes: 5
      uses: actions/github-script@v9
      with:
        script: |
          // Label history preserves activation after run-ci removes its triggering label.
          core.setOutput('activated', 'false');
          if (context.eventName !== 'pull_request' || context.payload.action !== 'synchronize') {
            core.setOutput('activated', 'true');
            return;
          }
          try {
            for await (const response of github.paginate.iterator(github.rest.issues.listEvents, {
              ...context.repo, issue_number: context.payload.pull_request.number, per_page: 100,
              request: {timeout: 60000},
            })) {
              // GITHUB_TOKEN labeler events cannot trigger another workflow.
              if (response.data.some(event => event.event === 'labeled'
                  && event.actor?.login && event.actor.login !== 'github-actions[bot]')) {
                core.setOutput('activated', 'true');
                return;
              }
            }
            core.notice('Docker CI has not been activated for this PR. Apply a label or use the existing run-ci command.');
          } catch (error) {
            core.warning(`Could not verify prior PR activation (HTTP ${error.status || 'unavailable'}). Apply a label or use run-ci to start CI explicitly.`);
          }
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        sparse-checkout: .github/actions/detect-changes
        sparse-checkout-cone-mode: false
    - id: detect
      uses: ./.github/actions/detect-changes
      with:
        triggered-jobs-push: "Docker base build job + rendering-correctness + rendering-correctness-kitless + warp-cache-warm + ovrtx-cache-warm"
        triggered-jobs-pr: "Docker build jobs + all test-* matrix jobs"
        # config.yaml changes can change the Docker base image.
        patterns: |
          ^source/ :: Library source code
          ^docker/ :: Container build inputs
          ^tools/ :: Build tooling
          ^apps/ :: Standalone apps
          ^scripts/ :: Standalone scripts
          ^\.dockerignore$ :: Docker build context filter
          ^conftest\.py$ :: Root pytest configuration
          ^uv\.lock$ :: Dependency lockfile
          ^pyproject\.toml$ :: Root Python project (Docker copy)
          ^\.github/workflows/build\.yaml$ :: This workflow file
          ^\.github/workflows/config\.yaml$ :: Shared CI config
          ^\.github/actions/ :: CI actions
          ^\.github/test-subsets/ :: CI test subset config

  config:
    name: Load Config
    runs-on: ubuntu-latest
    outputs:
      isaacsim_image_name: ${{ steps.load.outputs.isaacsim_image_name }}
      isaacsim_image_tag: ${{ steps.load.outputs.isaacsim_image_tag }}
      isaaclab_image_name: ${{ steps.load.outputs.isaaclab_image_name }}
      ovphysx_wheelhouse_image: ${{ steps.load.outputs.ovphysx_wheelhouse_image }}
      ci_image_tag: ${{ steps.image_tag.outputs.ci_image_tag }}
      base_isaacsim_image_name: ${{ steps.base_load.outputs.name }}
      base_isaacsim_image_tag: ${{ steps.base_load.outputs.version }}
      base_image_config_outcome: ${{ steps.base_load.outcome }}
      paired_base_commit: ${{ steps.perf_pair.outputs.base_commit }}
      paired_base_error: ${{ steps.perf_pair.outputs.reason }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        sparse-checkout: |
          .github/workflows/config.yaml
          tools/perf_smoke/
        sparse-checkout-cone-mode: false
    - id: load
      run: |
        set -euo pipefail
        f=.github/workflows/config.yaml
        echo "isaacsim_image_name=$(yq -r .isaacsim_image_name "$f")" >> "$GITHUB_OUTPUT"
        echo "isaacsim_image_tag=$(yq -r .isaacsim_image_tag "$f")" >> "$GITHUB_OUTPUT"
        echo "isaaclab_image_name=$(yq -r .isaaclab_image_name "$f")" >> "$GITHUB_OUTPUT"
        echo "ovphysx_wheelhouse_image=$(yq -r '.ovphysx_wheelhouse_image // ""' "$f")" >> "$GITHUB_OUTPUT"
    # arm-ci.yml repeats this formula for its separate ARM image.
    - id: image_tag
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" = "pull_request" ]; then
          ref_component="pr-${PR_NUMBER}"
        else
          ref_component="$REF_NAME"
        fi

        sanitized_ref=$(echo "$ref_component" | sed 's/[^a-zA-Z0-9._-]/-/g')
        echo "ci_image_tag=isaac-lab-ci:${sanitized_ref}-${SHA}" >> "$GITHUB_OUTPUT"
        echo "CI image tag: isaac-lab-ci:${sanitized_ref}-${SHA}"

    - name: Resolve the base parent of the tested PR merge
      id: perf_pair
      if: github.event_name == 'pull_request'
      continue-on-error: true
      run: python3 -m tools.perf_smoke.paired resolve --checkout-root "$GITHUB_WORKSPACE"

    - name: Check out the PR base image configuration
      id: base_config_checkout
      if: github.event_name == 'pull_request' && steps.perf_pair.outcome == 'success'
      continue-on-error: true
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.perf_pair.outputs.base_commit }}
        fetch-depth: 1
        sparse-checkout: .github/workflows/config.yaml
        sparse-checkout-cone-mode: false
    - name: Read the PR base image configuration
      id: base_load
      if: github.event_name == 'pull_request' && steps.base_config_checkout.outcome == 'success'
      continue-on-error: true
      run: |
        set -euo pipefail
        name=$(yq -er .isaacsim_image_name .github/workflows/config.yaml)
        version=$(yq -er .isaacsim_image_tag .github/workflows/config.yaml)
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

  test-dockerfile-contract:
    name: dockerfile-contract
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      with:
        enable-cache: true

    - name: Run Dockerfile contract tests
      shell: bash
      run: |
        set -euo pipefail
        contract_env="$(mktemp -d "${RUNNER_TEMP}/isaaclab-contract.XXXXXX")"
        uv venv --python 3.12 "${contract_env}"
        uv pip sync --require-hashes --only-binary :all: \
          --python "${contract_env}/bin/python" docker/test/requirements.txt
        uv pip check --python "${contract_env}/bin/python"
        "${contract_env}/bin/python" -m pytest -q \
          docker/test/test_dockerfile_nonroot.py docker/test/test_security_dependencies.py

  build:
    name: Build Base Docker Image
    # Skipping every required check would let an untested PR merge.
    runs-on: ${{ fromJSON(needs.changes.outputs.activated == 'true' && '["self-hosted", "gpu"]' || '["ubuntu-latest"]') }}
    needs: [changes, config]
    if: needs.changes.outputs.should_run == 'true'
    steps:
    - name: Explain missing PR activation
      if: needs.changes.outputs.activated != 'true'
      run: |
        echo '::error::Docker CI has not been activated, or prior activation could not be verified. Apply a label or use the existing run-ci command. No GPU build or benchmark was started.'
        exit 1
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true

    # GPU runners need uv installed for the image checks.
    - name: Set up uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      with:
        enable-cache: true

    # uv sync skips the pip check from #6329, so verify package files in the built image.
    # Old bundled __init__.py files can break Isaac Sim imports (nvbugs 6343978).
    - name: Build and push to ECR
      uses: ./.github/actions/ecr-build-push-pull
      with:
        image-tag: ${{ needs.config.outputs.ci_image_tag }}
        isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
        isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
        dockerfile-path: docker/Dockerfile.base
        cache-tag: cache-base
        verify-test-path: docker/test/test_image_invariants.py

  build-curobo:
    name: Build cuRobo Docker Image
    runs-on: [self-hosted, gpu]
    needs: [changes, config]
    if: >-
      github.event_name != 'push' &&
      needs.changes.outputs.activated == 'true' &&
      needs.changes.outputs.should_run == 'true'
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true

    - name: Build and push to ECR
      uses: ./.github/actions/ecr-build-push-pull
      with:
        image-tag: ${{ needs.config.outputs.ci_image_tag }}-curobo
        isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
        isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
        dockerfile-path: docker/Dockerfile.curobo
        cache-tag: cache-curobo

  test-isaaclab-tasks:
    name: isaaclab_tasks [1/3]
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    continue-on-error: true
    needs: [build, config]
    if: >-
      github.event_name != 'push' &&
      needs.build.result == 'success'
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        lfs: true
    - uses: ./.github/actions/run-package-tests
      with:
        image-tag: ${{ needs.config.outputs.ci_image_tag }}
        isaacsim-base-image: ${{ needs.config.outputs.isaacsim_image_name }}
        isaacsim-version: ${{ needs.config.outputs.isaacsim_image_tag }}
        filter-pattern: "isaaclab_tasks"
        exclude-pattern: "test_rendering_,test_video_recording.py"
        shard-index: "0"
        shard-count: "3"
        warp-cache: restore
        ovrtx-shader-cache: restore
        test-jobs: "4"
        container-name: isaac-lab-tasks-1-test

