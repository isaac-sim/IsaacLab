name: Installation Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      - release/**
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Docker base image for the test container'
        required: false
        default: 'ubuntu:24.04'
        type: string
      test_filter:
        description: 'pytest -k filter expression (e.g. "uv" or "bugs")'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_install_tests: ${{ steps.detect.outputs.run }}
    steps:
      # Local composite actions need the repo present; only the action
      # directory is required.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions/detect-changes
          sparse-checkout-cone-mode: false

      # Installation tests run only when paths in the patterns table change.
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          summary-title: Installation test gating
          patterns: |
            ^apps/ Standalone apps
            ^tools/ Build tooling
            ^source/ Library source code
            ^\.github/actions/run-package-tests/ Test action
            ^\.github/actions/install-ci-(collect|run)/ Install-ci composite actions
            ^\.github/actions/detect-changes/ Path-gating action
            ^\.github/workflows/install-ci\.yml$ This workflow file
            ^VERSION$ Version file
            (^|/)pyproject\.toml$ Python project metadata
            (^|/)environment\.ya?ml$ Conda environment file

  install-tests-x86:
    name: Installation Tests (x86)
    needs: [changes]
    if: needs.changes.outputs.run_install_tests == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Show Collected Tests
        uses: ./.github/actions/install-ci-collect
        with:
          test-filter: ${{ inputs.test_filter }}
      - name: Run Tests
        uses: ./.github/actions/install-ci-run
        with:
          base-image: ${{ inputs.base_image || 'ubuntu:24.04' }}
          test-filter: ${{ inputs.test_filter }}

  install-tests-arm:
    name: Installation Tests (ARM)
    needs: [changes]
    if: needs.changes.outputs.run_install_tests == 'true'
    runs-on: [self-hosted, aarch64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Show Collected Tests
        uses: ./.github/actions/install-ci-collect
        with:
          test-filter: ${{ inputs.test_filter }}
      - name: Run Tests
        uses: ./.github/actions/install-ci-run
        with:
          base-image: ${{ inputs.base_image || 'ubuntu:24.04' }}
          test-filter: ${{ inputs.test_filter }}
