name: Installation Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      - release/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/actions/detect-changes
          sparse-checkout-cone-mode: false
      - id: detect
        uses: ./.github/actions/detect-changes
        with:
          triggered-jobs-push: installation tests
          triggered-jobs-pr: installation tests
          patterns: |
            ^isaaclab\.(sh|bat)$ :: Install entrypoints
            ^pyproject\.toml$ :: Root dependency manifest
            ^uv\.lock$ :: Locked dependency graph
            ^source/[^/]+/pyproject\.toml$ :: Package dependency manifests
            ^source/isaaclab/isaaclab/cli/ :: Install CLI implementation
            ^\.github/workflows/install-ci\.yml$ :: This workflow file
            ^\.github/actions/detect-changes/ :: Change-detection action

  install:
    name: Installation Tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86
            runner: [self-hosted, gpu]
          - name: ARM
            runner: [self-hosted, aarch64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install and import the default environment
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/isaaclab-install-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          uv run --frozen python -c \
            "import isaaclab, isaaclab_assets, isaaclab_rl, isaaclab_tasks"

      - name: Install and import the legacy core environment
        run: |
          legacy_env="${RUNNER_TEMP}/isaaclab-legacy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv venv --python 3.12 "$legacy_env"
          source "$legacy_env/bin/activate"
          ./isaaclab.sh -i core
          python -c "import isaaclab, isaaclab_assets, isaaclab_rl, isaaclab_tasks"
