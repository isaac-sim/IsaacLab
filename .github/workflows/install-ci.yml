name: Installation Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      - release/**
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Docker base image for the test container'
        required: false
        default: 'ubuntu:24.04'
        type: string
      test_filter:
        description: 'pytest -k filter expression (e.g. "workspace" or "wheel")'
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_install_tests: ${{ steps.detect.outputs.run_install_tests }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Installation tests run only when paths in the patterns table change.
          # Otherwise the test job skips via `if:` and reports green to branch
          # protection, which is why we don't use a workflow-level `paths:`
          # filter (a not-triggered required check would block the PR forever).
          patterns=(
            $'^apps/\tStandalone apps'
            $'^tools/\tBuild tooling'
            $'^source/\tLibrary source code'
            $'^\\.github/actions/run-package-tests/\tTest action'
            $'^\\.github/actions/install-ci-(collect|run)/\tInstall-ci composite actions'
            $'^\\.github/workflows/install-ci\\.yml$\tThis workflow file'
            $'^VERSION$\tVersion file'
            $'(^|/)pyproject\\.toml$\tPython project metadata'
            $'^uv\\.lock$\tuv lockfile'
          )

          render_table() {
            local files="$1" entry regex desc count sample shown
            echo "| Pattern | What it covers | Matched files |"
            echo "|---|---|---|"
            for entry in "${patterns[@]}"; do
              IFS=$'\t' read -r regex desc <<< "$entry"
              # escape | so it doesn't end the markdown table cell mid-regex
              shown="${regex//|/\\|}"
              count=$(grep -cE "$regex" <<< "$files" || true)
              if [ "$count" -gt 0 ]; then
                sample=$(grep -m 3 -E "$regex" <<< "$files" | paste -sd ', ' -)
                [ "$count" -gt 3 ] && sample="$sample (and $((count - 3)) more)"
                echo "| \`$shown\` | $desc | $sample |"
              else
                echo "| \`$shown\` | $desc | - |"
              fi
            done
          }

          any_match() {
            local files="$1" entry regex
            for entry in "${patterns[@]}"; do
              IFS=$'\t' read -r regex _ <<< "$entry"
              if grep -qE "$regex" <<< "$files"; then
                return 0
              fi
            done
            return 1
          }

          decide() {
            local decision="$1" reason="$2" files="${3:-}"
            echo "Decision: run_install_tests=$decision ($reason)"
            echo "run_install_tests=$decision" >> "$GITHUB_OUTPUT"
            {
              if [ -n "$files" ]; then
                render_table "$files"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            decide true "non-PR event ($EVENT_NAME)"
            exit 0
          fi

          if ! changed_files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"; then
            # Fail-safe: a transient API error must not block merge. Default to running.
            echo "::warning::Could not list changed files; defaulting to running tests"
            decide true "fail-safe (could not list changed files)"
            exit 0
          fi

          printf '%s\n' "$changed_files"

          if any_match "$changed_files"; then
            decide true "relevant paths changed" "$changed_files"
          else
            decide false "no relevant paths changed" "$changed_files"
          fi

  install-tests-x86:
    name: Installation Tests (x86)
    needs: [changes]
    if: needs.changes.outputs.run_install_tests == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Show Collected Tests
        uses: ./.github/actions/install-ci-collect
        with:
          test-filter: ${{ inputs.test_filter }}
      - name: Run Tests
        uses: ./.github/actions/install-ci-run
        with:
          base-image: ${{ inputs.base_image || 'ubuntu:24.04' }}
          test-filter: ${{ inputs.test_filter }}

  install-tests-arm:
    name: Installation Tests (ARM)
    needs: [changes]
    if: needs.changes.outputs.run_install_tests == 'true'
    runs-on: [self-hosted, aarch64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Show Collected Tests
        uses: ./.github/actions/install-ci-collect
        with:
          test-filter: ${{ inputs.test_filter }}
      # GB10 allocates GPU memory from host RAM; page cache left by earlier jobs starves CUDA init.
      - name: Runner Health and Page-Cache Drop (Pre)
        run: |
          .github/scripts/runner_health.sh pre-test
          docker run --rm --privileged ubuntu:24.04 sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'
          .github/scripts/runner_health.sh after-cache-drop
      - name: Run Tests
        uses: ./.github/actions/install-ci-run
        with:
          base-image: ${{ inputs.base_image || 'ubuntu:24.04' }}
          test-filter: ${{ inputs.test_filter }}
      - name: Runner Health (Post)
        if: always()
        continue-on-error: true
        run: |
          .github/scripts/runner_health.sh post-test

  # Windows has no Docker, so the suite runs natively. The composite actions above are
  # bash and pin setup-uv v6, which crashes on exit on these runners
  # (astral-sh/setup-uv#686).
  install-tests-windows:
    name: Installation Tests (Windows)
    needs: [changes]
    if: needs.changes.outputs.run_install_tests == 'true'
    runs-on: [self-hosted, gpu-windows]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.9"

      # By name, Windows resolves bash to WSL's launcher in System32 ahead of PATH.
      - name: Build wheel
        run: |
          & "C:\Program Files\Git\bin\bash.exe" tools/wheel_builder/build.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Tests
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          $wheel = @(Get-ChildItem tools/wheel_builder/build/dist -Filter "isaaclab-*.whl")
          if ($wheel.Count -ne 1) { throw "expected one wheel, found $($wheel.Count)" }
          # pytest's default base sits under the NetworkService profile, deep enough that
          # Kit's DLLs in a venv there pass the 260-character path limit.
          $pytestArgs = @("--run-gpu", "--tb=short", "-sv", "--basetemp=$env:RUNNER_TEMP\i", "--junitxml=${{ github.workspace }}\results\results.xml")
          # Windows CI installs the uv workspace and trains in it, so only the wheel is tested here.
          $pytestArgs += "--ignore=test_workspace.py"
          if ($env:TEST_FILTER) { $pytestArgs += @("-k", $env:TEST_FILTER) }
          uv run --no-project --python 3.12 --with pytest python tools/run_install_ci.py native --wheel $wheel[0].FullName -- @pytestArgs
          exit $LASTEXITCODE

      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-ci-junit-windows
          path: ${{ github.workspace }}/results/results.xml
          if-no-files-found: ignore
          retention-days: 7
