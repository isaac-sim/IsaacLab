# Runtime image transfer; task configuration supplies cameras and prompts.
backend:
  checkpoint: nvidia/Cosmos3-Nano
  num_steps: 50
  guidance: 3.0
  control_kind: seg
  control_guidance: 2.0
  resolution: "720"
  aspect_ratio: "4,3"
  shift: 10.0
  native_resolution: false
  mask_guidance: true
  mask_strength: 1.0
  mask_step_threshold: null  # All updates: 49 for public Nano, 3 for four-step exports.
  mask_downsample_mode: area
camera:
  composite_foreground: false
  boundary_px: 0
  boundary_erosion_px: 8  # Shrink the union; radius is in input-camera pixels.
