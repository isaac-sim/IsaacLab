version: "3.9"

services:
  docs:
    build:
      context: ../
      dockerfile: docs/Dockerfile
    volumes:
      - ..:/workspace
    working_dir: /workspace/docs
    command: sh -c "rm -rf _build/current && sphinx-build -W . _build/current"

  docs-multi:
    build:
      context: ../
      dockerfile: docs/Dockerfile
    volumes:
      - ..:/workspace
    working_dir: /workspace/docs
    command: sh -c "sphinx-multiversion . _build && cp _redirect/index.html _build/index.html"