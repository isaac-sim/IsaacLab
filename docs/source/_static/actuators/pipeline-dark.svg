<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="270" viewBox="0 0 940 270" font-family="'NVIDIA Sans', Arial, sans-serif">
  <defs>
    <marker id="arrow-explicit-d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f0894a"/>
    </marker>
    <marker id="arrow-implicit-d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4fb4e0"/>
    </marker>
    <marker id="arrow-flow-d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="20" font-weight="bold" fill="#f0f0f0">Actuator pipeline</text>
  <text x="20" y="52" font-size="14" fill="#b0b0b0">targets &#8594; ActuatorCollection &#8594; model.compute() &#8594; backend submit</text>

  <!-- Stage 1: targets -->
  <rect x="20" y="130" width="170" height="80" rx="10" fill="#2a2f24" stroke="#76b900" stroke-width="2"/>
  <text x="105" y="163" font-size="15" font-weight="bold" fill="#f0f0f0" text-anchor="middle">User targets</text>
  <text x="105" y="184" font-size="11" fill="#b0b0b0" text-anchor="middle">set_joint_*_target</text>
  <text x="105" y="199" font-size="11" fill="#b0b0b0" text-anchor="middle">_index / _mask</text>

  <!-- Stage 2: collection -->
  <rect x="240" y="130" width="180" height="80" rx="10" fill="#2a2f24" stroke="#76b900" stroke-width="2"/>
  <text x="330" y="163" font-size="15" font-weight="bold" fill="#f0f0f0" text-anchor="middle">ActuatorCollection</text>
  <text x="330" y="184" font-size="11" fill="#b0b0b0" text-anchor="middle">command buffers,</text>
  <text x="330" y="199" font-size="11" fill="#b0b0b0" text-anchor="middle">per-group actuators</text>

  <!-- Stage 3: compute (explicit only) -->
  <rect x="490" y="35" width="180" height="80" rx="10" fill="#3a2c20" stroke="#f0894a" stroke-width="2"/>
  <text x="580" y="68" font-size="15" font-weight="bold" fill="#f0f0f0" text-anchor="middle">model.compute()</text>
  <text x="580" y="89" font-size="11" fill="#b0b0b0" text-anchor="middle">PD / DC / net,</text>
  <text x="580" y="104" font-size="11" fill="#b0b0b0" text-anchor="middle">torque clipping</text>

  <!-- Stage 4: submit -->
  <rect x="740" y="130" width="180" height="80" rx="10" fill="#2a2f24" stroke="#76b900" stroke-width="2"/>
  <text x="830" y="163" font-size="15" font-weight="bold" fill="#f0f0f0" text-anchor="middle">Backend submit</text>
  <text x="830" y="184" font-size="11" fill="#b0b0b0" text-anchor="middle">PhysX / Newton /</text>
  <text x="830" y="199" font-size="11" fill="#b0b0b0" text-anchor="middle">OVPhysX write</text>

  <!-- Flow arrows -->
  <line x1="190" y1="170" x2="234" y2="170" stroke="#aaaaaa" stroke-width="2" marker-end="url(#arrow-flow-d)"/>

  <!-- explicit branch: collection -> compute -> submit -->
  <path d="M420,150 C455,150 455,75 484,75" fill="none" stroke="#f0894a" stroke-width="2" marker-end="url(#arrow-explicit-d)"/>
  <path d="M670,75 C705,75 705,150 734,150" fill="none" stroke="#f0894a" stroke-width="2" marker-end="url(#arrow-explicit-d)"/>
  <text x="580" y="128" font-size="12" font-weight="bold" fill="#f0894a" text-anchor="middle">explicit models</text>

  <!-- implicit branch: collection -> submit directly -->
  <path d="M420,190 L734,190" fill="none" stroke="#4fb4e0" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-implicit-d)"/>
  <text x="577" y="183" font-size="12" font-weight="bold" fill="#4fb4e0" text-anchor="middle">implicit: gains preloaded to solver PD, compute() is a no-op</text>

  <text x="20" y="252" font-size="11" fill="#b0b0b0">Explicit models clip torque in compute(); their solver gains read zero. All of this runs inside write_data_to_sim() each step.</text>
</svg>
