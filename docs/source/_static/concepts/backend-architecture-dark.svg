<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" role="img" aria-labelledby="title">
<title id="title">Isaac Lab backend architecture</title>
<defs>
<style>.lbl { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; } .body { font-family: "Segoe UI", Arial, sans-serif; font-weight: 400; } .mono { font-family: Consolas, "DejaVu Sans Mono", monospace; }</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4be"/></marker>
</defs>
<rect width="900" height="652" fill="#1e1e2e"/>
<rect x="16" y="16" width="868" height="58" rx="7" fill="#2b2f36" stroke="#8c959f" stroke-width="1.5"/>
<text x="450.0" y="37" text-anchor="middle" class="lbl" font-size="13.5" fill="#e6edf3">Environment and task code</text>
<text x="450.0" y="54" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">ManagerBasedRLEnv · DirectRLEnv · InteractiveScene — the same public API on every backend</text>
<line x1="228" y1="74" x2="228" y2="98" stroke="#aab4be" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="236" y="91" text-anchor="start" class="body" font-size="11" font-style="italic" fill="#aab4be">Articulation(cfg), ContactSensor(cfg), ...</text>
<rect x="16" y="100" width="484" height="98" rx="7" fill="#1f2d16" stroke="#76b900" stroke-width="1.5"/>
<text x="258.0" y="121" text-anchor="middle" class="lbl" font-size="13.5" fill="#ccff90">Public asset and sensor API</text>
<text x="258.0" y="137" text-anchor="middle" class="body" font-size="11" fill="#aab4be">isaaclab.assets · isaaclab.sensors</text>
<text x="258.0" y="154" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">Articulation · RigidObject · RigidObjectCollection · DeformableObject</text>
<text x="258.0" y="171" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">ContactSensor · Imu · RayCaster · FrameTransformer · JointWrenchSensor</text>
<text x="258.0" y="188" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">class Articulation(FactoryBase, BaseArticulation)</text>
<rect x="560" y="100" width="324" height="98" rx="7" fill="#132a40" stroke="#42a5f5" stroke-width="1.5"/>
<text x="722.0" y="121" text-anchor="middle" class="lbl" font-size="13.5" fill="#90caf9">Backend-agnostic base classes</text>
<text x="722.0" y="138" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">BaseArticulation · BaseRigidObject</text>
<text x="722.0" y="155" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">BaseContactSensor · BaseImu · ...</text>
<text x="722.0" y="172" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">PhysicsManager · SceneDataBackend</text>
<text x="722.0" y="189" text-anchor="middle" class="body" font-size="11" fill="#aab4be">implemented by every backend package</text>
<line x1="500" y1="149" x2="558" y2="149" stroke="#aab4be" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="530" y="141" text-anchor="middle" class="body" font-size="11" font-style="italic" fill="#aab4be">inherits</text>
<line x1="228" y1="198" x2="228" y2="226" stroke="#aab4be" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="16" y="228" width="424" height="112" rx="7" fill="#33290a" stroke="#fbc02d" stroke-width="1.5"/>
<text x="228.0" y="249" text-anchor="middle" class="lbl" font-size="13.5" fill="#ffe082">FactoryBase.__new__()  (construction time)</text>
<text x="228.0" y="266" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">_get_backend() → &quot;physx&quot; | &quot;newton&quot; | &quot;ovphysx&quot;</text>
<text x="228.0" y="283" text-anchor="middle" class="body" font-size="11" fill="#aab4be">(from physics_manager, set to the resolved cfg&#x27;s class_type)</text>
<text x="228.0" y="300" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">_get_module_name() → isaaclab_&lt;backend&gt;.&lt;subpath&gt;</text>
<text x="228.0" y="317" text-anchor="middle" class="body" font-size="11" fill="#aab4be">ovphysx → isaaclab_ov · lazy import, cached in a registry</text>
<rect x="490" y="228" width="394" height="112" rx="7" fill="#3a2410" stroke="#ffa726" stroke-width="1.5"/>
<text x="687.0" y="249" text-anchor="middle" class="lbl" font-size="13.5" fill="#ffcc80">Physics preset  (isaaclab_tasks, configuration time)</text>
<text x="687.0" y="266" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">physics=newton_mjwarp → PresetCfg alternative</text>
<text x="687.0" y="283" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">SimulationCfg.physics: PhysicsCfg | None</text>
<text x="687.0" y="300" text-anchor="middle" class="body" font-size="11" fill="#aab4be">PhysxAutoCfg resolves to a concrete PhysX cfg at launch</text>
<text x="687.0" y="317" text-anchor="middle" class="body" font-size="11" fill="#aab4be">core receives a concrete PhysxCfg, NewtonCfg or OvPhysxCfg</text>
<line x1="490" y1="284" x2="442" y2="284" stroke="#aab4be" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="466" y="276" text-anchor="middle" class="body" font-size="11" font-style="italic" fill="#aab4be">selects</text>
<line x1="228" y1="340" x2="228" y2="360" stroke="#aab4be" stroke-width="1.6"/>
<line x1="154.0" y1="360" x2="746.0" y2="360" stroke="#aab4be" stroke-width="1.6"/>
<line x1="154.0" y1="360" x2="154.0" y2="382" stroke="#aab4be" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="450.0" y1="360" x2="450.0" y2="382" stroke="#aab4be" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="746.0" y1="360" x2="746.0" y2="382" stroke="#aab4be" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="236" y="354" text-anchor="start" class="body" font-size="11" font-style="italic" fill="#aab4be">imports the active backend&#x27;s implementation</text>
<rect x="16" y="384" width="276" height="128" rx="7" fill="#2d1a33" stroke="#ba68c8" stroke-width="1.5"/>
<text x="154.0" y="405" text-anchor="middle" class="mono lbl" font-size="13.5" fill="#e1bee7">isaaclab_physx</text>
<text x="154.0" y="422" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">PhysxManager</text>
<text x="154.0" y="439" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">assets.Articulation, sensors.Imu, ...</text>
<text x="154.0" y="456" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">PhysxSceneDataBackend</text>
<text x="154.0" y="473" text-anchor="middle" class="body" font-size="11" fill="#aab4be">physics=isaacsim_physx · physx</text>
<rect x="312" y="384" width="276" height="128" rx="7" fill="#2d1a33" stroke="#ba68c8" stroke-width="1.5"/>
<text x="450.0" y="405" text-anchor="middle" class="mono lbl" font-size="13.5" fill="#e1bee7">isaaclab_newton</text>
<text x="450.0" y="422" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">NewtonManager</text>
<text x="450.0" y="439" text-anchor="middle" class="body" font-size="11" fill="#aab4be">+ solver managers: NewtonMJWarpManager, ...</text>
<text x="450.0" y="456" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">assets.Articulation, sensors.Imu, ...</text>
<text x="450.0" y="473" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">NewtonSceneDataBackend</text>
<text x="450.0" y="490" text-anchor="middle" class="body" font-size="11" fill="#aab4be">physics=newton_mjwarp · newton_kamino</text>
<rect x="608" y="384" width="276" height="128" rx="7" fill="#2d1a33" stroke="#ba68c8" stroke-width="1.5"/>
<text x="746.0" y="405" text-anchor="middle" class="mono lbl" font-size="13.5" fill="#e1bee7">isaaclab_ov</text>
<text x="746.0" y="422" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">OvPhysxManager</text>
<text x="746.0" y="439" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">assets.Articulation, sensors.Imu, ...</text>
<text x="746.0" y="456" text-anchor="middle" class="mono" font-size="11" fill="#e6edf3">OvPhysxSceneDataBackend</text>
<text x="746.0" y="473" text-anchor="middle" class="body" font-size="11" fill="#aab4be">physics=ovphysx · physx (kit-less)</text>
<line x1="154.0" y1="512" x2="154.0" y2="536" stroke="#aab4be" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="450.0" y1="512" x2="450.0" y2="536" stroke="#aab4be" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="746.0" y1="512" x2="746.0" y2="536" stroke="#aab4be" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="16" y="538" width="276" height="74" rx="7" fill="#263238" stroke="#78909c" stroke-width="1.5"/>
<text x="154.0" y="559" text-anchor="middle" class="lbl" font-size="13.5" fill="#cfd8dc">Isaac Sim PhysX</text>
<text x="154.0" y="576" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">Kit runtime</text>
<text x="154.0" y="593" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">omni.physx · omni.physics.tensors</text>
<rect x="312" y="538" width="276" height="74" rx="7" fill="#263238" stroke="#78909c" stroke-width="1.5"/>
<text x="450.0" y="559" text-anchor="middle" class="lbl" font-size="13.5" fill="#cfd8dc">Newton on NVIDIA Warp</text>
<text x="450.0" y="576" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">MuJoCo-Warp · Kamino · XPBD</text>
<text x="450.0" y="593" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">VBD · Featherstone · MPM solvers</text>
<rect x="608" y="538" width="276" height="74" rx="7" fill="#263238" stroke="#78909c" stroke-width="1.5"/>
<text x="746.0" y="559" text-anchor="middle" class="lbl" font-size="13.5" fill="#cfd8dc">OvPhysX</text>
<text x="746.0" y="576" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">ovphysx library</text>
<text x="746.0" y="593" text-anchor="middle" class="body" font-size="12" fill="#e6edf3">PhysX without the Kit runtime</text>
<text x="450.0" y="636" text-anchor="middle" class="body" font-size="11.5" fill="#aab4be">Renderers (renderer=) and visualizers (--viz) are selected independently through their configuration's class_type.</text>
</svg>
