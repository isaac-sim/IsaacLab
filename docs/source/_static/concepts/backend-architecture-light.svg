<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" role="img" aria-labelledby="title">
<title id="title">Isaac Lab backend architecture</title>
<defs>
<style>.lbl { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; } .body { font-family: "Segoe UI", Arial, sans-serif; font-weight: 400; } .mono { font-family: Consolas, "DejaVu Sans Mono", monospace; }</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>
<rect width="900" height="652" fill="#ffffff"/>
<rect x="16" y="16" width="868" height="58" rx="7" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="450.0" y="37" text-anchor="middle" class="lbl" font-size="13.5" fill="#24292f">Environment and task code</text>
<text x="450.0" y="54" text-anchor="middle" class="body" font-size="12" fill="#1f2328">ManagerBasedRLEnv · DirectRLEnv · InteractiveScene — the same public API on every backend</text>
<line x1="228" y1="74" x2="228" y2="98" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="236" y="91" text-anchor="start" class="body" font-size="11" font-style="italic" fill="#57606a">Articulation(cfg), ContactSensor(cfg), ...</text>
<rect x="16" y="100" width="484" height="98" rx="7" fill="#f1f8e9" stroke="#558b2f" stroke-width="1.5"/>
<text x="258.0" y="121" text-anchor="middle" class="lbl" font-size="13.5" fill="#1b5e20">Public asset and sensor API</text>
<text x="258.0" y="137" text-anchor="middle" class="body" font-size="11" fill="#57606a">isaaclab.assets · isaaclab.sensors</text>
<text x="258.0" y="154" text-anchor="middle" class="body" font-size="12" fill="#1f2328">Articulation · RigidObject · RigidObjectCollection · DeformableObject</text>
<text x="258.0" y="171" text-anchor="middle" class="body" font-size="12" fill="#1f2328">ContactSensor · Imu · RayCaster · FrameTransformer · JointWrenchSensor</text>
<text x="258.0" y="188" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">class Articulation(FactoryBase, BaseArticulation)</text>
<rect x="560" y="100" width="324" height="98" rx="7" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
<text x="722.0" y="121" text-anchor="middle" class="lbl" font-size="13.5" fill="#0d47a1">Backend-agnostic base classes</text>
<text x="722.0" y="138" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">BaseArticulation · BaseRigidObject</text>
<text x="722.0" y="155" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">BaseContactSensor · BaseImu · ...</text>
<text x="722.0" y="172" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">PhysicsManager · SceneDataBackend</text>
<text x="722.0" y="189" text-anchor="middle" class="body" font-size="11" fill="#57606a">implemented by every backend package</text>
<line x1="500" y1="149" x2="558" y2="149" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="530" y="141" text-anchor="middle" class="body" font-size="11" font-style="italic" fill="#57606a">inherits</text>
<line x1="228" y1="198" x2="228" y2="226" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="16" y="228" width="424" height="112" rx="7" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="228.0" y="249" text-anchor="middle" class="lbl" font-size="13.5" fill="#e65100">FactoryBase.__new__()  (construction time)</text>
<text x="228.0" y="266" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">_get_backend() → &quot;physx&quot; | &quot;newton&quot; | &quot;ovphysx&quot;</text>
<text x="228.0" y="283" text-anchor="middle" class="body" font-size="11" fill="#57606a">(from physics_manager, set to the resolved cfg&#x27;s class_type)</text>
<text x="228.0" y="300" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">_get_module_name() → isaaclab_&lt;backend&gt;.&lt;subpath&gt;</text>
<text x="228.0" y="317" text-anchor="middle" class="body" font-size="11" fill="#57606a">ovphysx → isaaclab_ov · lazy import, cached in a registry</text>
<rect x="490" y="228" width="394" height="112" rx="7" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
<text x="687.0" y="249" text-anchor="middle" class="lbl" font-size="13.5" fill="#bf360c">Physics preset  (isaaclab_tasks, configuration time)</text>
<text x="687.0" y="266" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">physics=newton_mjwarp → PresetCfg alternative</text>
<text x="687.0" y="283" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">SimulationCfg.physics: PhysicsCfg | None</text>
<text x="687.0" y="300" text-anchor="middle" class="body" font-size="11" fill="#57606a">PhysxAutoCfg resolves to a concrete PhysX cfg at launch</text>
<text x="687.0" y="317" text-anchor="middle" class="body" font-size="11" fill="#57606a">core receives a concrete PhysxCfg, NewtonCfg or OvPhysxCfg</text>
<line x1="490" y1="284" x2="442" y2="284" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="466" y="276" text-anchor="middle" class="body" font-size="11" font-style="italic" fill="#57606a">selects</text>
<line x1="228" y1="340" x2="228" y2="360" stroke="#57606a" stroke-width="1.6"/>
<line x1="154.0" y1="360" x2="746.0" y2="360" stroke="#57606a" stroke-width="1.6"/>
<line x1="154.0" y1="360" x2="154.0" y2="382" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="450.0" y1="360" x2="450.0" y2="382" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="746.0" y1="360" x2="746.0" y2="382" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="236" y="354" text-anchor="start" class="body" font-size="11" font-style="italic" fill="#57606a">imports the active backend&#x27;s implementation</text>
<rect x="16" y="384" width="276" height="128" rx="7" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="154.0" y="405" text-anchor="middle" class="mono lbl" font-size="13.5" fill="#4a148c">isaaclab_physx</text>
<text x="154.0" y="422" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">PhysxManager</text>
<text x="154.0" y="439" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">assets.Articulation, sensors.Imu, ...</text>
<text x="154.0" y="456" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">PhysxSceneDataBackend</text>
<text x="154.0" y="473" text-anchor="middle" class="body" font-size="11" fill="#57606a">physics=isaacsim_physx · physx</text>
<rect x="312" y="384" width="276" height="128" rx="7" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="450.0" y="405" text-anchor="middle" class="mono lbl" font-size="13.5" fill="#4a148c">isaaclab_newton</text>
<text x="450.0" y="422" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">NewtonManager</text>
<text x="450.0" y="439" text-anchor="middle" class="body" font-size="11" fill="#57606a">+ solver managers: NewtonMJWarpManager, ...</text>
<text x="450.0" y="456" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">assets.Articulation, sensors.Imu, ...</text>
<text x="450.0" y="473" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">NewtonSceneDataBackend</text>
<text x="450.0" y="490" text-anchor="middle" class="body" font-size="11" fill="#57606a">physics=newton_mjwarp · newton_kamino</text>
<rect x="608" y="384" width="276" height="128" rx="7" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="746.0" y="405" text-anchor="middle" class="mono lbl" font-size="13.5" fill="#4a148c">isaaclab_ov</text>
<text x="746.0" y="422" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">OvPhysxManager</text>
<text x="746.0" y="439" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">assets.Articulation, sensors.Imu, ...</text>
<text x="746.0" y="456" text-anchor="middle" class="mono" font-size="11" fill="#1f2328">OvPhysxSceneDataBackend</text>
<text x="746.0" y="473" text-anchor="middle" class="body" font-size="11" fill="#57606a">physics=ovphysx · physx (kit-less)</text>
<line x1="154.0" y1="512" x2="154.0" y2="536" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="450.0" y1="512" x2="450.0" y2="536" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="746.0" y1="512" x2="746.0" y2="536" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="16" y="538" width="276" height="74" rx="7" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="154.0" y="559" text-anchor="middle" class="lbl" font-size="13.5" fill="#263238">Isaac Sim PhysX</text>
<text x="154.0" y="576" text-anchor="middle" class="body" font-size="12" fill="#1f2328">Kit runtime</text>
<text x="154.0" y="593" text-anchor="middle" class="body" font-size="12" fill="#1f2328">omni.physx · omni.physics.tensors</text>
<rect x="312" y="538" width="276" height="74" rx="7" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="450.0" y="559" text-anchor="middle" class="lbl" font-size="13.5" fill="#263238">Newton on NVIDIA Warp</text>
<text x="450.0" y="576" text-anchor="middle" class="body" font-size="12" fill="#1f2328">MuJoCo-Warp · Kamino · XPBD</text>
<text x="450.0" y="593" text-anchor="middle" class="body" font-size="12" fill="#1f2328">VBD · Featherstone · MPM solvers</text>
<rect x="608" y="538" width="276" height="74" rx="7" fill="#eceff1" stroke="#546e7a" stroke-width="1.5"/>
<text x="746.0" y="559" text-anchor="middle" class="lbl" font-size="13.5" fill="#263238">OvPhysX</text>
<text x="746.0" y="576" text-anchor="middle" class="body" font-size="12" fill="#1f2328">ovphysx library</text>
<text x="746.0" y="593" text-anchor="middle" class="body" font-size="12" fill="#1f2328">PhysX without the Kit runtime</text>
<text x="450.0" y="636" text-anchor="middle" class="body" font-size="11.5" fill="#57606a">Renderers (renderer=) and visualizers (--viz) are selected independently through their configuration's class_type.</text>
</svg>
