[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_cosmos_server"
version = "0.1.0"
description = "Cosmos services for Isaac Lab, for camera image transfer and for world models, and the socket protocol their clients share."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "simulation", "cosmos", "world model"]
requires-python = ">=3.12"
# The service runs in Cosmos Framework's environment, which provides the model and its Torch and CUDA stack, without
# Isaac Lab. Isaac Lab installs this package too, for the protocol its camera client uses. Warp shares GPU buffers
# between the two processes and works beside either Torch build.
dependencies = [
    "numpy>=2",
    "lazy-loader>=0.4",
    "warp-lang>=1.17.0",
]

[project.scripts]
isaaclab-cosmos-server = "isaaclab_cosmos_server.worker:main"
isaaclab-cosmos-world-model-server = "isaaclab_cosmos_server.world_model:main"

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_cosmos_server", "isaaclab_cosmos_server.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
