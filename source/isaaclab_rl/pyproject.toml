[build-system]
requires = ["setuptools<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab-rl"
version = "0.5.0"
description = "Reinforcement learning wrappers for Isaac Lab"
license = "BSD-3-Clause"
requires-python = ">=3.11,<3.12"
dependencies = [
    "isaaclab",
    "isaaclab-assets",
    "isaaclab-tasks",
    "numpy<2",
    "torch>=2.7",
    "torchvision>=0.14.1",
    "protobuf>=4.25.8,!=5.26.0",
    "hydra-core",
    "h5py",
    "tensorboard",
    "moviepy",
    "pillow==11.3.0",
    "packaging<24",
]

[project.optional-dependencies]
sb3 = ["stable-baselines3>=2.6", "tqdm", "rich"]
skrl = ["skrl>=1.4.3"]
rl-games = [
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@python3.11",
    "gym",
]
rsl-rl = ["rsl-rl-lib==5.0.1", "onnxscript>=0.5"]
# NOTE: Update this list when adding/changing any extra above.
all = [
    "stable-baselines3>=2.6", "tqdm", "rich",
    "skrl>=1.4.3",
    "rl-games @ git+https://github.com/isaac-sim/rl_games.git@python3.11", "gym",
    "rsl-rl-lib==5.0.1", "onnxscript>=0.5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_rl*"]
