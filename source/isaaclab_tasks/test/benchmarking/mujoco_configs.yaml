    lower_thresholds:
      reward: 15
      episode_length: 700
    upper_thresholds:
      duration: 3000
  rsl_rl:Isaac-Velocity-Flat-H1:
    max_iterations: 1000
    lower_thresholds:
      reward: 15
      episode_length: 700
    upper_thresholds:
      duration: 3000
  rsl_rl:Isaac-Velocity-Flat-G1:
    max_iterations: 1000
    lower_thresholds:
      reward: 10
      episode_length: 700
    upper_thresholds:
      duration: 3500
  rsl_rl:Isaac-Reorient-Cube-Allegro-Direct:
    max_iterations: 500
    lower_thresholds:
      reward: 200
      episode_length: 150
    upper_thresholds:
      duration: 1500
  rsl_rl:Isaac-Reorient-Cube-Shadow-Direct:
    max_iterations: 3000
    lower_thresholds:
      reward: 1000
      episode_length: 300
    upper_thresholds:
      duration: 10000
  # Shadow Handover is a multi-agent env; only skrl is registered (no rsl_rl entry point).
  # Pass --workflows rsl_rl skrl to include this row.
  skrl:Isaac-Shadow-Handover-Direct:
    max_iterations: 1000
    lower_thresholds:
      reward: 5
    upper_thresholds:
      duration: 8000

