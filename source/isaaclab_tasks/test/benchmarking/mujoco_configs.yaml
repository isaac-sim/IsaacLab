# Training benchmarks for environments whose robot USD moved to MuJoCo Menagerie (see mtrepte/mujoco-menagerie/).
# One workflow per task (rsl_rl only) so each env runs once when using e.g. --workflows rsl_rl.
# Thresholds and max_iterations match configs.yaml ``full`` for the same task / closest matching rule.
#
# Optional per-task keys (read by test_environments_training.train_job):
#   num_envs — if set, ``--num_envs`` is passed to train.py; if omitted, train.py uses its default.
#
# Run (KPI benchmark): pytest ... --config_path mujoco_configs.yaml --mode benchmark --workflows rsl_rl skrl
# Run (smoke / wiring):  pytest ... --config_path mujoco_configs.yaml --mode test --workflows rsl_rl skrl --sim-backend physx newton
# Physics / Menagerie USD (pytest): ``--sim-backend`` accepts one or more values (parametrized per test).
#   physx: ``--menagerie-physics-variant physx`` (default env presets).
#   newton: ``--menagerie-physics-variant mujoco`` + ``presets=newton_mjwarp`` (see conftest.py).
#
# ``test`` mode: same env list as ``benchmark``, max_iterations=10, num_envs=2, thresholds chosen so KPI checks do not gate
# (see env_benchmark_test_utils.evaluate_job). Lower metrics must be *above* the floor, so floors are -9999; duration
# must stay *below* the cap, so the cap is 9999. Using +9999 for lowers and -9999 for duration would fail every job.
#
# --- Menagerie-related envs not covered by this file (missing from automated RL benchmark harness) ---
#
# Isaac-PickPlace-Locomanipulation-G1-Abs-v0
#   Uses G1_29DOF Menagerie USD (distinct from velocity G1 minimal). Only robomimic_bc is registered;
#   test/benchmarking/env_benchmark_test_utils.py parses rsl_rl / rl_games / sb3 / skrl logs only, so no row here.
#   Exercise the asset via: scripts/imitation_learning/robomimic/train.py, play.py, robust_eval.py;
#   demos: scripts/tools/record_demos.py (see isaaclab_teleop docs). Catalog: mtrepte/mujoco-menagerie/asset_tasks.txt.
#
# Isaac-PickPlace-FixedBaseUpperBodyIK-G1-Abs-v0
#   Same G1_29DOF Menagerie role; gym registry has env_cfg only (no robomimic_bc_cfg_entry_point), so no stock robomimic
#   train/play path. Smoke / controller coverage: source/isaaclab/test/controllers/test_pink_ik.py lists this task.
#   Add a workflow entry point + agent JSON if you need imitation-learning benchmarks comparable to Locomanipulation-G1.
#
# Isaac-Shadow-Handover-Direct
#   Multi-agent env; only skrl/rl_games entry points registered (no rsl_rl). Not covered by this rsl_rl-only file.
#   Smoke: scripts/reinforcement_learning/skrl/train.py --task Isaac-Shadow-Handover-Direct --num_envs 2 --max_iterations 5

benchmark:
  # Velocity-Flat thresholds align with configs.yaml ``full`` (Flat-* / per-task overrides).
  rsl_rl:IsaacContrib-Velocity-Flat-AnymalB:
    max_iterations: 1000
    lower_thresholds:
      reward: 10
      episode_length: 700
    upper_thresholds:
      duration: 3000
  rsl_rl:IsaacContrib-Velocity-Flat-AnymalC:
    max_iterations: 1000
    lower_thresholds:
