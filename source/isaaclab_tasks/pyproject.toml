[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_tasks"
version = "9.1.0"
description = "Extension containing suite of environments for robot learning."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "rl", "il", "learning"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here.
dependencies = [
    "isaaclab",
    "isaaclab_assets",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab_assets = { path = "../isaaclab_assets", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_tasks", "isaaclab_tasks.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
