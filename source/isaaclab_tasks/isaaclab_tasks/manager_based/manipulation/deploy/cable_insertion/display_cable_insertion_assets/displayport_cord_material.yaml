project:
  name: "displayport_cord_material_assignment"
  session_id: "displayport_cord_material"
  working_dir: ".displayport_cord_material"
  description: "Assign visual materials to the converted McMaster-Carr 2584N111 DisplayPort cord USD."

input:
  usd_path: "/home/horde/cad2simready_runs/displayport_cord_20260513/output/conversion/2584N111_Displayport_Cord.usd"
  reference_images: []

output:
  layer_only: false
  flatten_output: false

materials:
  path: "../content-agents-main/apps/material_agent/data/materials/material_libs_default/materials.yaml"

steps:
  validate_input:
    enabled: true
    on_failure: warn

  optimize_usd:
    enabled: false

  build_dataset_usd:
    renderer:
      backend: ovrtx
      image_width: 512
      image_height: 512
      cull_style: back
      should_highlight_prim: false
      should_assign_random_colors: true
      highlight_color: [0.7, 0.0, 0.0]
      other_color_range: [0.35, 0.35]
      rendering_modes:
        prim_only:
          margin: 1.2
          cameras: ["+x+y+z", "-x-y-z"]
          camera_focus_mode: prim
        composition:
          margin: 6.0
          cameras: ["+x", "+y", "+z"]
          camera_focus_mode: stage
          skip_occluded_images: false
    prim_filters:
      types:
        - "UsdGeom.Mesh"
        - "UsdGeom.Cube"
        - "UsdGeom.Cylinder"
        - "UsdGeom.Capsule"
        - "UsdGeom.Sphere"
        - "UsdGeom.Cone"
      skip_instances: false
    extract_material_bindings: true
    extract_hierarchy: true
    extract_metadata: true
    build_usd_model: true
    export_usd_model: true
    skip_existing: true
    batch_size: 16

  build_dataset_pdf_vectorstore:
    enabled: false

  build_dataset_prepare_dataset:
    enabled: true
    include_ground_truth: false
    include_prim_path_context: true
    pdf_conversion:
      dpi: 150
      format: "png"
      first_page: 1
      last_page: 2
    prompts:
      vlm_system: |
        You are an expert at identifying object parts and assigning plausible visual materials for simulation USD assets.
        The asset is a McMaster-Carr 2584N111 DisplayPort cord/cable converted from CAD. Prefer black polymer or rubber-like cable jacket and molded connector housings, with metal shells or pins where geometry indicates connector hardware.
        Use the available material list and choose the closest matching material. Mark uncertain assumptions through conservative choices.

        Available materials:
        {materials_list}

        Respond as structured JSON:
        {{
          "material": "material name"
        }}
      vlm_user: |
        Identify the highlighted part of the DisplayPort cord and select the most appropriate material from the predefined list.
        Focus on geometry, position, and part function. Do not overfit to random render colors.

        Additional context:
        {context}
      vlm_image_prompts:
        prim_only: "This is a rendered part of interest only without highlighting."
        composition: "This is an orthographic view of the object with the part of interest highlighted with an orange outline."

  cluster_prims:
    enabled: false

  predict:
    prediction_batch_size: 1
    vlm:
      backend: nim
      model: qwen/qwen3.5-397b-a17b
      temperature: 0.3
      max_completion_tokens: 4096
    max_workers: 8
    llm:
      backend: nim
      model: qwen/qwen3.5-397b-a17b
      temperature: 0.1
      max_tokens: 512
    report:
      image_max_size: 256
      image_format: jpeg
      image_quality: 75

  validate_predictions:
    enabled: true

  harmonize_predictions:
    enabled: true

  apply:
    layer_only: false
    flatten_output: false

  restore_usd:
    enabled: false

  validate_output:
    enabled: true
    on_failure: warn

  render:
    enabled: true
    backend: ovrtx
    image_width: 1024
    image_height: 1024
    camera_corners: ["+x+y+z", "-x-y-z"]
    camera_margin: 1.0
    background_color: [1.0, 1.0, 1.0]

advanced:
  keep_temp_files: true
  log_level: INFO
