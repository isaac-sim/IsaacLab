[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_neural"
version = "0.0.0"
description = "Extension that runs IsaacLab tasks on neural robot dynamics models."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "simulation", "newton", "neural robot dynamics"]
requires-python = ">=3.12"
# Keep only workspace-internal dependencies here; newton-neural is an optional extra on the root project.
dependencies = [
    "isaaclab",
    "isaaclab_newton",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab_newton = { path = "../isaaclab_newton", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_neural", "isaaclab_neural.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
