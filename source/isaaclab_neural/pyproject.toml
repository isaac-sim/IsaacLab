[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_neural"
version = "0.1.0"
description = "Extension providing IsaacLab with learned world-model (neural simulator) backends."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "simulation", "world-model", "neural-simulator"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here.
dependencies = [
    "isaaclab",
    "isaaclab-experimental",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab-experimental = { path = "../isaaclab_experimental", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_neural", "isaaclab_neural.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
