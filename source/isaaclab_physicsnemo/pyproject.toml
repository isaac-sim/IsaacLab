[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_physicsnemo"
version = "0.0.0"
description = "Extension integrating PhysicsNeMo Robotics learned dynamics with Isaac Lab Newton environments."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "simulation", "learned-dynamics", "newton", "physicsnemo", "isaaclab"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here. PhysicsNeMo Robotics is installed separately,
# see docs/README.md.
dependencies = [
    "isaaclab",
    "isaaclab-newton",
    "isaaclab-tasks",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab-newton = { path = "../isaaclab_newton", editable = true }
isaaclab-tasks = { path = "../isaaclab_tasks", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_physicsnemo", "isaaclab_physicsnemo.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
