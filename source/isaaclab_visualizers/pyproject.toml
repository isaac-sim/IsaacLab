[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab-visualizers"
version = "1.0.3"
description = "Visualizer backends for Isaac Lab (Kit, Newton, Rerun, Viser)."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "simulation", "visualization"]
requires-python = ">=3.12"
# >>> BEGIN auto-generated dependencies -- edit [tool.isaaclab.packages] in the root pyproject.toml and run tools/gen_package_pyproject.py >>>
dependencies = [
    "isaaclab",
    "numpy>=2",
]

[project.optional-dependencies]
kit = []
newton = [
    "warp-lang>=1.14.0",
    "newton[sim]>=1.2.0",
    "PyOpenGL-accelerate>=3.1.0",
    "pyglet>=2.1.6,<3",
    "imgui-bundle>=1.92.5",
    "typing-extensions>=4.12.2",
]
rerun = [
    "newton[sim]>=1.2.0",
    "rerun-sdk>=0.29.0",
    "pyarrow==22.0.0",
]
viser = [
    "newton[sim]>=1.2.0",
    "viser>=1.0.16",
]
all = [
    "imgui-bundle>=1.92.5",
    "newton[sim]>=1.2.0",
    "PyOpenGL-accelerate>=3.1.0",
    "pyglet>=2.1.6,<3",
    "pyarrow==22.0.0",
    "rerun-sdk>=0.29.0",
    "typing-extensions>=4.12.2",
    "viser>=1.0.16",
    "warp-lang>=1.14.0",
]
# <<< END auto-generated dependencies <<<

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_visualizers", "isaaclab_visualizers.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
