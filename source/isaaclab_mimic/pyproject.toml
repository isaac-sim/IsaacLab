[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_mimic"
version = "2.0.2"
description = "Mimic for Isaac Lab."
license = {text = "Apache-2.0"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["extension", "template", "isaaclab"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here.
dependencies = [
    "isaaclab",
    "isaaclab_assets",
    "isaaclab_tasks",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab_assets = { path = "../isaaclab_assets", editable = true }
isaaclab_tasks = { path = "../isaaclab_tasks", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_mimic", "isaaclab_mimic.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
