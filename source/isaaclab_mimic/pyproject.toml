[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_mimic"
version = "2.0.1"
description = "Mimic for Isaac Lab."
license = {text = "Apache-2.0"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["extension", "template", "isaaclab"]
requires-python = ">=3.12"
# >>> BEGIN auto-generated dependencies -- edit [tool.isaaclab.packages] in the root pyproject.toml and run tools/gen_package_pyproject.py >>>
dependencies = [
    "ipywidgets>=8.1.5",
    "h5py>=3.15.0",
    "robomimic @ git+https://github.com/ARISE-Initiative/robomimic.git@v0.4.0 ; sys_platform == 'linux'",
]
# <<< END auto-generated dependencies <<<

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_mimic", "isaaclab_mimic.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
