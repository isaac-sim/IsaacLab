[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_neural_bridge"
version = "0.1.0"
description = "Connects Isaac Lab to a model served by its own process: messages, socket and CUDA IPC transport, and the service loop."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "simulation", "world model"]
requires-python = ">=3.12"
# Both processes install this package: Isaac Lab for its client side, and the model's own environment, which has its
# own Torch and CUDA stack, for the service. It imports neither Isaac Lab nor a model framework. Warp shares GPU
# buffers between the two processes and works beside either Torch build.
dependencies = [
    "numpy>=2",
    "lazy-loader>=0.4",
    "warp-lang>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_neural_bridge", "isaaclab_neural_bridge.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
