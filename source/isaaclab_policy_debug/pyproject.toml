[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_policy_debug"
version = "0.1.0"
description = "Interactive RSL-RL checkpoint comparison for Isaac Lab."
readme = "docs/README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "reinforcement-learning", "debugging", "visualization"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here.
dependencies = [
    "isaaclab",
    "isaaclab_rl",
    "isaaclab-visualizers",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab_rl = { path = "../isaaclab_rl", editable = true }
isaaclab-visualizers = { path = "../isaaclab_visualizers", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_policy_debug", "isaaclab_policy_debug.*"]
