[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_contrib"
version = "2.0.1"
description = "An extension used to stage and integrate externally contributed features and implementations."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["kit", "robotics", "assets", "isaaclab"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here.
dependencies = [
    "isaaclab",
]

# AgiBot's redundant-arm IK solver (Ik7dController / Ik7dAction). Not on PyPI: install the shipped cp312/x86_64 wheel first, and put a GCC 13 libstdc++ (GLIBCXX_3.4.31) on LD_LIBRARY_PATH at runtime -- a constraint pip cannot express.
[project.optional-dependencies]
ik-7d = [
    "ik_7d==0.3.5",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_contrib", "isaaclab_contrib.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
