[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_contrib"
version = "2.0.1"
description = "An extension used to stage and integrate externally contributed features and implementations."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["kit", "robotics", "assets", "isaaclab"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here.
dependencies = [
    "isaaclab",
]

[project.optional-dependencies]
# Support for the patched Cosmos source checkout installed separately with --no-deps.
# Its upstream metadata has no inference-only extra compatible with the shared env.
cosmos-runtime = [
    "accelerate", "av", "cattrs", "diffusers==0.35.1", "einops",
    "hydra-core", "imageio-ffmpeg", "imageio", "loguru", "msgpack",
    "nvidia-cudnn-frontend; sys_platform == 'linux'", "nvidia-ml-py",
    "obstore", "omegaconf", "pydantic", "requests", "scipy", "termcolor",
    "transformers>=4.57.1,<5", "tyro", "uv", "websockets",
    "ftfy", "qwen-vl-utils", "iopath", "multi-storage-client", "boto3", "pandas", "wandb",
]
nixl = ["nixl; sys_platform == 'linux'"]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_contrib", "isaaclab_contrib.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
