[pytest]
testpaths = .
python_files =
    test_*.py
    *.test.py
    *_test.py
    *_tests.py
markers =
    bug: bug-regression tests (use bug id as argument)
    gpu: tests that require a GPU
    docker: tests that only run inside Docker
    native: tests that only run natively (not in Docker)
    slow: tests that take a long time
    uv: tests that exercise the uv installation workflow
    conda: tests that exercise the conda installation workflow
    isaacsim_source: tests that use Isaac Sim pre-installed via the _isaac_sim symlink
timeout = 1200
