[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab"
version = "11.2.0"
description = "Extension providing main framework interfaces and abstractions for robot learning."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["kit", "robotics", "learning", "ai"]
requires-python = ">=3.12"
# Third-party requirements are centralized in the root pyproject.toml
# (single source of truth for the uv workspace, the wheel builder, and the
# ./isaaclab.sh -i install CLI).
dependencies = []

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

# Only the ``isaaclab`` entry point is exposed; training/play are subcommands
# (``isaaclab train`` / ``isaaclab play`` / ``isaaclab train_multigpu``) so they
# do not clash with ``train``/``play`` scripts from other installed packages.
[project.scripts]
isaaclab = "isaaclab.cli:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab", "isaaclab.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
